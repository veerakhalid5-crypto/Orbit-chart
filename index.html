<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QCity Terminal</title>
<style>
:root{--bg:#0b0f14;--p:#121821;--l:#1e2733;--t:#dbe3ee;--m:#7d8a9c;--u:#2bd4a0;--d:#ff5d6c;--a:#5aa9ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:13px/1.45 system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
#bar{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--p);border-bottom:1px solid var(--l);overflow-x:auto;flex-shrink:0}
select,button,input{background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:6px 9px;font:inherit}
button.on{background:var(--a);color:#06101c;border-color:var(--a);font-weight:600}
#px{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

#cw{position:relative;flex:1;min-height:0}

#lay{position:absolute;top:6px;left:6px;z-index:5;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#lay button{padding:3px 8px;font-size:11px;background:rgba(11,15,20,.85)}
#lay button.on{background:var(--a)}
#dot{position:absolute;top:10px;right:64px;z-index:5;width:9px;height:9px;border-radius:50%;background:var(--m)}

#sheet{background:var(--p);border-top:1px solid var(--l);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex}#tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--m)}
#tabs button.on{color:var(--a);background:none;border-bottom:2px solid var(--a)}
#body{overflow:auto;padding:10px;max-height:42dvh;display:none}#sheet.open #body{display:block}
.u{color:var(--u)}.d{color:var(--d)}.m{color:var(--m)}
.v{padding:10px;border-radius:8px;font-weight:700;font-size:16px;margin-bottom:8px;background:var(--bg);border:1px solid var(--l)}
.v small{display:block;font-weight:400;color:var(--m);font-size:11px}
.f{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--l)}.f b{min-width:92px}
.kv{display:flex;justify-content:space-between;padding:3px 0}

#lay{align-items:flex-start}#lp{display:none;flex-basis:100%;background:rgba(18,24,33,.96);backdrop-filter:blur(10px);border:1px solid var(--l);border-radius:10px;padding:8px;max-width:340px;max-height:62dvh;overflow:auto;animation:fi .2s}
#lay.open #lp{display:block}#lp h4{margin:8px 0 4px}#lp .grp,#lp #pre{display:flex;flex-wrap:wrap;gap:4px}#lp button{padding:5px 10px;font-size:12px}#lp button small{opacity:.75;margin-left:4px}#lp button.z{opacity:.45}#lp button.au{border-color:var(--a)}#lp button.off{opacity:.35;text-decoration:line-through}#lp #pre button{background:var(--p)}
.fs #bar,.fs #sheet,.fs #tk{display:none}

<script>
"use strict";
const QC=(()=>{
/* ===== Registry & constants ===== */
const $=s=>document.querySelector(s);
const TFS=['1m','3m','5m','15m','30m','1h','2h','4h','6h','8h','12h','1d','3d','1w','1M'];
const TS={'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,'6h':21600,'8h':28800,'12h':43200,'1d':86400,'3d':259200,'1w':604800};
const HTF={'1m':'15m','3m':'1h','5m':'1h','15m':'4h','30m':'4h','1h':'1d','2h':'1d','4h':'1d','6h':'3d','8h':'3d','12h':'1w','1d':'1w','3d':'1w','1w':'1M','1M':'1M'};
const TYPES=[['candle','Candles'],['hollow','Hollow'],['bars','OHLC bars'],['line','Line'],['area','Area'],['base','Baseline'],['ha','Heikin Ashi'],['renko','Renko (ATR 14)']];
const SPOT=['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com'];
const FUT=['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com'];
const TP='Binance TradFi perpetual: tracks the metal/energy price, but it is a contract, not spot';
const COM=[['XAUUSDT','Gold'],['XAGUSDT','Silver'],['CLUSDT','WTI Oil'],['BZUSDT','Brent'],['NATGASUSDT','Nat Gas']];
const TOK=[['PAXGUSDT','PAXG'],['XAUTUSDT','XAUT']];
const STABLE=new Set(['usdt','usdc','fdusd','dai','tusd','usde','usds','usdd','pyusd','susde','usd0','steth','wsteth','weth','wbtc','weeth','wbeth','cbbtc','bsc-usd','leo']);
const FALL=['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','AVAX','TRX','LINK'];
const ALIAS={gold:'XAUUSDT',silver:'XAGUSDT',oil:'CLUSDT',wti:'CLUSDT',brent:'BZUSDT',gas:'NATGASUSDT',btc:'BTCUSDT',bitcoin:'BTCUSDT',eth:'ETHUSDT',sol:'SOLUSDT',xrp:'XRPUSDT',bnb:'BNBUSDT',doge:'DOGEUSDT'};
const UP='#2bd4a0',DN='#ff5d6c',Z='rgba(0,0,0,0)';
const S={asset:null,assets:[],tf:'15m',type:'candle',L:{sr:1,st:1,fvg:1,ob:1,liq:1},candles:[],A:null,H:null,R:null,hl:null,ws:null,tick:0,log:[],prev:undefined,eq:1000,risk:1,dirty:0,src:'',al:[],M:null,auto:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('qc_v2')||'{}'));S.log=JSON.parse(localStorage.getItem('qc_log')||'[]');}catch(e){}
const ALLK=['st','sr','tl','pt','ob','fvg','liq','pda','ict','ses','fib','wy','ema','vwap','bb','sts','vp','pd'],CLEAN=[],AUTOK=['st','sr','tl','pt','ob','fvg'],L0={};ALLK.forEach(k=>{L0[k]=CLEAN.includes(k)?1:0;});
S.L=S.v>=5?Object.assign(L0,S.L):L0;S.v=5;
const save=()=>{try{localStorage.setItem('qc_v2',JSON.stringify({tf:S.tf,type:S.type,L:S.L,v:5,auto:S.auto,eq:S.eq,risk:S.risk,al:S.al,sym:S.asset&&S.asset.s}));localStorage.setItem('qc_log',JSON.stringify(S.log.slice(0,40)));}catch(e){}};
const fmt=n=>!isFinite(n)?'—':n>=100?n.toFixed(2):n>=1?n.toFixed(3):n.toPrecision(4);
const ema=(v,p)=>{const k=2/(p+1);let e=v[0];return v.map(x=>e=x*k+e*(1-k));};
const msg=t=>{$('#msg').textContent=t;};

/* ===== New York time (DST-aware) for ICT windows ===== */
const NYF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}),nyc=new Map();
const ny=t=>{let v=nyc.get(t);if(!v){const p={};NYF.formatToParts(new Date(t*1000)).forEach(x=>{p[x.type]=x.value;});v={h:(+p.hour)%24,m:+p.minute,d:p.year+'-'+p.month+'-'+p.day};nyc.set(t,v);}return v;};
const kzn=h=>h>=2&&h<5?'London KZ':h>=7&&h<10?'NY KZ':h===10?'Silver Bullet':null;
/* ===== Data providers ===== */
const tfetch=(u,ms=7000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t));};
async function jget(hs,p){for(const h of hs){try{const r=await tfetch(h+p);if(r.ok)return await r.json();jget.err='HTTP '+r.status;}catch(e){jget.err=String(e.message||e);}}return null;}
async function klines(a,tf,n){
  const r=await jget(a.fut?FUT:SPOT,(a.fut?'/fapi/v1/klines?':'/api/v3/klines?')+'symbol='+a.s+'&interval='+tf+'&limit='+n);
  if(!Array.isArray(r)||!r.length)throw new Error('No data for '+a.s+' '+tf+(jget.err?' ('+jget.err+')':''));
  return r.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
}
function baseAssets(l){return [...COM.map(([s,n])=>({s,n,fut:1,g:'Commodities',i:TP})),...TOK.map(([s,n])=>({s,n,fut:0,g:'Tokenized gold',i:'Gold-backed token on Binance spot. NOT the same as XAU/USD spot price'})),...l.map(s=>({s:s+'USDT',n:s,fut:0,g:'Crypto top 50',i:'Binance spot'}))];}
async function registry(){
  const A=baseAssets([]);
  let top=null;
  try{
    const [m,p]=await Promise.all([tfetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100').then(r=>r.json()),jget(SPOT,'/api/v3/ticker/price')]);
    const ok=new Set(p.map(x=>x.symbol)),seen=new Set();top=[];
    for(const c of m){const s=c.symbol.toUpperCase();if(STABLE.has(c.symbol)||seen.has(s)||!ok.has(s+'USDT'))continue;seen.add(s);top.push(s);if(top.length===50)break;}
  }catch(e){}
  const good=top&&top.length>=30;S.src=good?'CoinGecko market-cap ranking, Binance-listed pairs':'built-in fallback list (CoinGecko not reachable)';
  (good?top:FALL).forEach(s=>A.push({s:s+'USDT',n:s,fut:0,g:'Crypto top 50',i:'Binance spot'}));
  S.assets=A;
}

/* ===== Transforms ===== */
function ha(c){let p=null;return c.map(x=>{const cl=(x.open+x.high+x.low+x.close)/4,op=p?(p.open+p.close)/2:(x.open+x.close)/2;return p={time:x.time,open:op,high:Math.max(x.high,op,cl),low:Math.min(x.low,op,cl),close:cl};});}
function renko(c){
  const sz=S.A&&S.A.atr;if(!sz)return [];let base=c[0].close,dir=0,last=0;const out=[];
  for(const x of c)for(;;){let o,cl;
    if(x.close>=base+(dir<0?2*sz:sz)){o=dir<0?base+sz:base;cl=o+sz;dir=1;}
    else if(x.close<=base-(dir>0?2*sz:sz)){o=dir>0?base-sz:base;cl=o-sz;dir=-1;}else break;
    base=cl;last=Math.max(x.time,last+1);out.push({time:last,open:o,high:Math.max(o,cl),low:Math.min(o,cl),close:cl});}
  return out;
}

/* ===== Analysis engine (closed candles only, so signals never repaint) ===== */
function analyse(c,tf=S.tf,lite=false){
  const n=c.length,K=3;
  const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);
  const atr=tr.slice(-14).reduce((a,b)=>a+b,0)/Math.min(14,n);
  const SH=[],SL=[],ev=[];let hi=null,lo=null,trend=0;
  for(let i=2*K;i<n;i++){
    const p=i-K;let ph=1,pl=1;
    for(let j=p-K;j<=i;j++){if(c[j].high>c[p].high)ph=0;if(c[j].low<c[p].low)pl=0;}
    if(ph){hi={p,price:c[p].high,used:0};SH.push(hi);}
    if(pl){lo={p,price:c[p].low,used:0};SL.push(lo);}
    if(hi&&!hi.used&&c[i].close>hi.price){ev.push({i,t:c[i].time,k:trend>=0?'BOS':'CHoCH',d:1,lvl:hi.price,t0:c[hi.p].time});trend=1;hi.used=1;}
    if(lo&&!lo.used&&c[i].close<lo.price){ev.push({i,t:c[i].time,k:trend<=0?'BOS':'CHoCH',d:-1,lvl:lo.price,t0:c[lo.p].time});trend=-1;lo.used=1;}
  }
  const pts=[...SH.slice(-25),...SL.slice(-25)].map(s=>s.price).sort((a,b)=>a-b),cl=[];
  pts.forEach(p=>{const g=cl[cl.length-1];if(g&&p-g.s/g.n<atr*.5){g.s+=p;g.n++;}else cl.push({s:p,n:1});});
  const sr=cl.filter(g=>g.n>=2).map(g=>({p:g.s/g.n,n:g.n})).sort((a,b)=>b.n-a.n).slice(0,6);
  const fvg=[];
  for(let i=2;i<n;i++){
    const a=c[i-2],b=c[i];let z=null;
    if(a.high<b.low)z={d:1,lo:a.high,hi:b.low};else if(a.low>b.high)z={d:-1,lo:b.high,hi:a.low};
    if(z&&z.hi-z.lo>atr*.3){z.t=c[i-1].time;let dead=0;
      for(let j=i+1;j<n;j++)if(z.d>0?c[j].low<=z.lo:c[j].high>=z.hi){dead=1;break;}
      if(!dead)fvg.push(z);}
  }
  const ob=[],brk=[];
  ev.slice(-8).forEach(e=>{for(let j=e.i-1;j>=Math.max(0,e.i-25);j--){const x=c[j];
    if(e.d>0?x.close<x.open:x.close>x.open){const z={d:e.d,lo:x.low,hi:x.high,t:x.time};let dead=0;
      let dm=-1;for(let m=e.i+1;m<n;m++)if(e.d>0?c[m].close<z.lo:c[m].close>z.hi){dm=m;break;}
      if(dm<0)ob.push(z);else if(!c.slice(dm+1).some(y=>e.d>0?y.close>z.hi:y.close<z.lo))brk.push({d:-e.d,lo:z.lo,hi:z.hi,t:c[dm].time});break;}}});
  const pool=(arr,h)=>{const o=[];arr.slice(-20).forEach(s=>{const g=o.find(q=>Math.abs(q.p-s.price)<atr*.15);
    if(g){g.p=(g.p*g.n+s.price)/(g.n+1);g.n++;}else o.push({p:s.price,n:1,h,t:c[s.p].time});});return o.filter(q=>q.n>=2);};
  const raw=[...pool(SH,1),...pool(SL,0)],sweeps=[];
  raw.forEach(q=>c.slice(-12).forEach(x=>{if(x.time>q.t&&(q.h?x.high>q.p&&x.close<q.p:x.low<q.p&&x.close>q.p))sweeps.push({d:q.h?-1:1,p:q.p,t:x.time});}));
  const liq=raw.filter(q=>!c.some(x=>x.time>q.t&&(q.h?x.close>q.p:x.close<q.p)));
  const h=SH.length?SH[SH.length-1].price:Math.max(...c.map(x=>x.high)),l=SL.length?SL[SL.length-1].price:Math.min(...c.map(x=>x.low));
  const v20=c.slice(-21,-1).reduce((a,x)=>a+x.volume,0)/20;
  const vp=(()=>{const win=c.slice(-300);let vlo=Infinity,vhi=-Infinity;win.forEach(x=>{vlo=Math.min(vlo,x.low);vhi=Math.max(vhi,x.high);});
    const NB=40,vs_=(vhi-vlo)/NB||1,pr=new Array(NB).fill(0);win.forEach(x=>{pr[Math.min(NB-1,Math.floor(((x.high+x.low)/2-vlo)/vs_))]+=x.volume;});
    let pi=0;pr.forEach((v,i)=>{if(v>pr[pi])pi=i;});const tot=pr.reduce((a,b)=>a+b,0);let va=pr[pi],u=pi,d=pi;
    while(va<tot*.7&&(u<NB-1||d>0)){const uv=u<NB-1?pr[u+1]:-1,dv=d>0?pr[d-1]:-1;if(uv>=dv){u++;va+=uv;}else{d--;va+=dv;}}
    return {lo:vlo,st:vs_,pr,max:pr[pi],poc:vlo+(pi+.5)*vs_,vah:vlo+(u+1)*vs_,val:vlo+d*vs_};})();
  const pd=(()=>{if(['1d','3d','1w','1M'].includes(tf))return null;const day=Math.floor(c[n-1].time/86400),q=c.filter(x=>Math.floor(x.time/86400)===day-1);
    return q.length>3?{h:Math.max(...q.map(x=>x.high)),l:Math.min(...q.map(x=>x.low))}:null;})();
  const pat=(()=>{const two=(raw,W)=>{const arr=[];raw.forEach(s=>{const l=arr[arr.length-1];if(l&&s.p-l.p<5){if(W?s.price<l.price:s.price>l.price)arr[arr.length-1]=s;}else arr.push(s);});if(arr.length<2)return null;const a=arr[arr.length-2],b=arr[arr.length-1];
      if(b.p-a.p<5||n-1-b.p>120||Math.abs(a.price-b.price)>atr)return null;
      const seg=c.slice(a.p,b.p+1),neck=W?Math.max(...seg.map(x=>x.high)):Math.min(...seg.map(x=>x.low)),ni=seg.findIndex(x=>(W?x.high:x.low)===neck);
      if(Math.abs(neck-a.price)<2.5*atr)return null;const px=c[n-1].close,done=W?px>neck:px<neck;
      if(!done&&!(W?px>a.price:px<a.price))return null;return {k:W?'W':'M',neck,t:c[a.p].time,done,bp:b.p,p1:{t:c[a.p].time,v:a.price},p2:{t:c[b.p].time,v:b.price},pk:{t:c[a.p+ni].time,v:neck}};};
    return [two(SL,1),two(SH,0)].filter(Boolean).sort((x,y)=>y.bp-x.bp)[0]||null;})();
  const sq=z=>{const i=c.findIndex(x=>x.time===z.t);if(i<0)return 0;let touch=0,disp=0;
    for(let j=i+3;j<n;j++)if(c[j].low<=z.hi&&c[j].high>=z.lo)touch++;
    for(let j=i+1;j<Math.min(n,i+4);j++)disp=Math.max(disp,Math.abs(c[j].close-c[j].open));
    return Math.round(Math.min(100,35*Math.min(1,disp/(1.5*atr))+35*(touch===0?1:touch===1?.5:touch===2?.2:0)+30*Math.min(1,(z.hi-z.lo)/atr/1.2)));};
  ob.forEach(z=>{z.q=sq(z);});fvg.forEach(z=>{z.q=sq(z);});
  const dd=(raw,W)=>{const o=[];raw.forEach(s=>{const l=o[o.length-1];if(l&&s.p-l.p<5){if(W?s.price<l.price:s.price>l.price)o[o.length-1]=s;}else o.push(s);});return o;};
  const fib=(()=>{const a=SH[SH.length-1],b=SL[SL.length-1];if(!a||!b||Math.abs(a.price-b.price)<2*atr)return null;
    const down=b.p>a.p,H=a.price,L=b.price,rg=H-L,at=r=>down?L+rg*r:H-rg*r,ex=r=>down?L-rg*(r-1):H+rg*(r-1);
    return {t:c[Math.min(a.p,b.p)].time,down,lv:[.382,.5,.618,.705,.786].map(r=>({r,p:at(r)})),gp:[at(.618),at(.65)],ext:[1.272,1.618].map(r=>({r,p:ex(r)}))};})();
  const rsi=(()=>{const o=new Array(n).fill(null);if(n<16)return o;let g=0,l=0;for(let i=1;i<=14;i++){const d=c[i].close-c[i-1].close;if(d>=0)g+=d;else l-=d;}

    try{const k=(await klines(a,tf,200)).slice(0,-1),A=analyse(k,tf),e=ema(k.map(x=>x.close),50),up=k[k.length-1].close>e[e.length-1];res.push({tf,d:A.trend&&(A.trend>0)===up?A.trend:0,lines:A.tl.filter(l=>l.str>=50&&l.st==='intact').map(l=>({k:l.k,v:l.now,s:l.str}))});}
    catch(e){res.push({tf,d:0});}
  }
  if(S.asset.s===a.s&&S.tf===t0){S.M=res;recompute(true);}
}
function chkAl(px){const n=S.al.length;S.al=S.al.filter(a=>{if(a.s!==S.asset.s)return true;if(a.up?px>=a.p:px<=a.p){banner(a.n+' reached '+fmt(a.p),S.asset);return false;}return true;});if(S.al.length!==n)save();}
/* ===== Indicators ===== */
function ind(c){
  const cl=c.map(x=>x.close),o={},e=p=>ema(cl,p).map((v,i)=>i>=p-1?{time:c[i].time,value:v}:null).filter(Boolean);
  o.e20=e(20);o.e50=e(50);o.e200=e(200);
  let pv=0,vv=0,d0=-1;o.vw=c.map(x=>{const d=Math.floor(x.time/86400);if(d!==d0){pv=vv=0;d0=d;}pv+=(x.high+x.low+x.close)/3*x.volume;vv+=x.volume;return vv?{time:x.time,value:pv/vv}:null;}).filter(Boolean);
  o.bu=[];o.bm=[];o.bl=[];
  for(let i=19;i<c.length;i++){let m=0,s=0;for(let j=i-19;j<=i;j++)m+=cl[j];m/=20;for(let j=i-19;j<=i;j++)s+=(cl[j]-m)**2;const sd=Math.sqrt(s/20),t=c[i].time;o.bu.push({time:t,value:m+2*sd});o.bm.push({time:t,value:m});o.bl.push({time:t,value:m-2*sd});}
  const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);
  let at=0,dir=1,fu=null,fl=null;o.st=[];
  c.forEach((x,i)=>{if(i<9)return;at=i===9?tr.slice(0,10).reduce((a,b)=>a+b,0)/10:(at*9+tr[i])/10;
    const mid=(x.high+x.low)/2,up=mid+3*at,lo=mid-3*at,nfu=(fu!=null&&c[i-1].close<=fu)?Math.min(up,fu):up,nfl=(fl!=null&&c[i-1].close>=fl)?Math.max(lo,fl):lo;
    if(dir===1&&x.close<nfl)dir=-1;else if(dir===-1&&x.close>nfu)dir=1;fu=nfu;fl=nfl;
    o.st.push({time:x.time,value:dir===1?nfl:nfu,color:dir===1?UP:DN});});
  return o;
}
/* ===== Live ticker strip (one stream for spot, one for futures) ===== */
let tw=[];
function tickers(){
  tw.forEach(w=>{w.onclose=null;try{w.close();}catch(e){}});tw=[];
  const el=$('#tk');el.innerHTML=S.assets.map(a=>'<div data-s="'+a.s+'">'+a.n+' <span class="m">…</span></div>').join('');
  el.onclick=e=>{const x=e.target.closest('[data-s]');if(x)load(S.assets.find(a=>a.s===x.dataset.s),S.tf);};
  [[0,'wss://data-stream.binance.vision/stream?streams='],[1,'wss://fstream.binance.com/stream?streams=']].forEach(([f,u])=>{
    const l=S.assets.filter(a=>!!a.fut===!!f);if(!l.length)return;
    const ws=new WebSocket(u+l.map(a=>a.s.toLowerCase()+'@miniTicker').join('/'));tw.push(ws);
    ws.onmessage=e=>{try{const m=JSON.parse(e.data).data,p=+m.c,pc=(p/+m.o-1)*100,x=el.querySelector('[data-s="'+m.s+'"] span');if(x){x.textContent=fmt(p)+' '+pc.toFixed(1)+'%';x.className=pc>=0?'u':'d';}}catch(err){}};
    ws.onclose=()=>setTimeout(()=>{if(tw.includes(ws))tickers();},5000);
  });
}
/* ===== Background scan + alerts: first pass is silent, later passes alert only on NEW closed-candle setups ===== */
let alertOn=true,primed=false,lastTf='',seen=new Set();
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=760;g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.18);}catch(e){}}
function banner(t,a){const b=$('#ban');b.textContent=t+' (tap to open)';b.style.display='block';b.onclick=()=>{b.style.display='none';load(a,S.tf);};clearTimeout(b._t);b._t=setTimeout(()=>{b.style.display='none';},9000);if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([150,60,150]);beep();}
async function autoScan(){
  if(!alertOn||S.demo||scanBusy)return;const tf=S.tf;if(lastTf!==tf){primed=false;lastTf=tf;}
  for(const a of S.assets.filter(x=>x.g==='Crypto top 50').slice(0,20)){
    if(tf!==S.tf)return;
    try{const k=(await klines(a,tf,200)).slice(0,-1),A=analyse(k,tf),R=read(A,null),key=a.s+tf+k[k.length-1].time;
      if(R.dir&&R.plan&&Math.abs(R.score)>=.4&&!seen.has(key)){seen.add(key);
        if(primed){const p=R.plan;S.log.unshift({t:k[k.length-1].time,sym:a.s,name:a.n,tf,d:R.dir,entry:p.entry,stop:p.stop,tp:p.tp,score:Math.round(Math.abs(R.score)*100),st:'open'});save();renderRead();
          banner(a.n+' '+tf+': '+(R.dir>0?'bullish':'bearish')+' setup, confluence '+Math.round(Math.abs(R.score)*100)+'/100',a);}}
    }catch(e){}
    await new Promise(r=>setTimeout(r,60));
  }
  primed=true;
}

/* ===== UI wiring ===== */
const GROUPS=[['Structure',[['st','Structure'],['sr','S/R'],['tl','Trendlines'],['pt','Patterns']]],['Smart money',[['ob','Order blocks'],['fvg','FVG'],['liq','Liquidity'],['pda','Prem/Disc']]],['ICT',[['ict','ICT'],['ses','Sessions'],['fib','Fib']]],['Wyckoff',[['wy','Wyckoff']]],['Indicators',[['ema','EMA'],['vwap','VWAP'],['bb','BB'],['sts','Supertrend'],['vp','Vol profile'],['pd','PDH/L']]]];
const PRESETS={Clean:CLEAN,SMC:['st','ob','fvg','liq','pda'],ICT:['st','ob','fvg','ict','ses','fib','pda'],Wyckoff:['wy','sr','vp'],Classic:['sr','tl','pt','ema','vwap'],All:ALLK},NAME_OF={};GROUPS.forEach(([g,l])=>l.forEach(([k,n])=>{NAME_OF[k]=n;}));
function counts(){const A=S.A;if(!A)return {};return {st:Math.min(A.ev.length,3),sr:Math.min(A.sr.length,4),tl:A.tl.length,pt:(A.pat?1:0)+A.hs.length+A.cp.length,ob:A.ob.length+A.brk.length,fvg:A.fvg.length+A.ifvg.length+A.bpr.length,liq:A.liq.length,pda:1,ict:(A.crt?1:0)+(A.nyx?1:0),fib:A.fib?1:0,wy:A.wy?1+A.wy.ev.length:0,pd:A.pd?1:0};}
function syncLay(){const C=counts();document.querySelectorAll('#lay [data-l]').forEach(b=>{const k=b.dataset.l,n=C[k];b.classList.toggle('on',S.L[k]===1);b.classList.toggle('au',!!S.auto&&AUTOK.includes(k)&&S.L[k]===0);b.classList.toggle('off',S.L[k]===-1);b.classList.toggle('z',n===0);b.dataset.n=n==null?'':n;b.innerHTML=NAME_OF[k]+(n?'<small>'+n+'</small>':'');});}
function ui(){
  const gs={};S.assets.forEach(a=>(gs[a.g]=gs[a.g]||[]).push(a));
  $('#sym').innerHTML=Object.entries(gs).map(([g,l])=>'<optgroup label="'+g+'">'+l.map(a=>'<option value="'+a.s+'">'+a.n+'</option>').join('')+'</optgroup>').join('');
  $('#tf').innerHTML=TFS.map(t=>'<option>'+t+'</option>').join('');
  $('#ty').innerHTML=TYPES.map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('');$('#ty').value=S.type;
  $('#sym').onchange=e=>load(S.assets.find(a=>a.s===e.target.value),S.tf);
  $('#tf').onchange=e=>load(S.asset,e.target.value);
  $('#ty').onchange=e=>{S.type=e.target.value;save();render();chart.timeScale().fitContent();};
  $('#fs').onclick=()=>{$('#app').classList.toggle('fs');setTimeout(()=>window.dispatchEvent(new Event('resize')),50);};
  $('#lay').innerHTML='<button id="auto" class="'+(S.auto?'on':'')+'">✨ AI</button><button id="lbtn">☰ Layers</button><button id="bell" class="on">🔔</button><button id="fs2">⛶</button><div id="lp"><div id="pre">'+Object.keys(PRESETS).map(p=>'<button data-p="'+p+'">'+p+'</button>').join('')+'</div><div class="m" style="margin-top:6px;font-size:11px">Blue outline: the AI decides. Tap once to show all, twice to hide, three times to hand it back to the AI.</div>'+GROUPS.map(([g,l])=>'<h4>'+g+'</h4><div class="grp">'+l.map(([k,n])=>'<button data-l="'+k+'">'+n+'</button>').join('')+'</div>').join('')+'</div>';
  $('#lbtn').onclick=()=>$('#lay').classList.toggle('open');
  $('#auto').onclick=e=>{S.auto=!S.auto;e.target.classList.toggle('on',S.auto);syncLay();save();S.dirty++;};
  document.querySelectorAll('#lay [data-p]').forEach(b=>b.onclick=()=>{const nm=b.dataset.p,on=PRESETS[nm];ALLK.forEach(k=>{S.L[k]=nm==='Clean'?0:on.includes(k)?1:AUTOK.includes(k)?-1:0;});S.hl=null;syncLay();save();S.dirty++;});
  document.querySelectorAll('#lay [data-l]').forEach(b=>b.onclick=()=>{const k=b.dataset.l,cur=S.L[k];S.L[k]=AUTOK.includes(k)?(cur===0?1:cur===1?-1:0):(cur===1?0:1);syncLay();save();S.dirty++;if(S.L[k]===1&&b.dataset.n==='0'){msg('Nothing detected for '+NAME_OF[k]+' on '+S.tf+' right now. It appears when the market forms it.');setTimeout(()=>msg(S.asset.n+' · '+S.tf),4500);}});
  $('#fs2').onclick=$('#fs').onclick;$('#bell').onclick=e=>{alertOn=!alertOn;e.target.classList.toggle('on',alertOn);};syncLay();
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    const sh=$('#sheet'),same=b.classList.contains('on')&&sh.classList.contains('open');
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
    ['read','chat','scan','flow','bt','data'].forEach(n=>$('#t-'+n).hidden=n!==b.dataset.t);if(b.dataset.t==='scan'&&scanFor!==S.tf+S.asset.g)runScan();
    sh.classList.toggle('open',!same);setTimeout(()=>window.dispatchEvent(new Event('resize')),50);renderData();
  });
  const bt=$('#t-bt');if(!$('#btgo'))bt.innerHTML='<button id="btgo" class="on">Run backtest on the last ~1000 candles</button><div id="btout" style="margin-top:8px"></div>';$('#btgo').onclick=runBT;
  $('#go').onclick=()=>{const q=$('#q').value.trim();if(q){$('#q').value='';chat(q);}};
  $('#q').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
}
async function boot(){
  if(!window.LightweightCharts){msg('Chart library did not load (cdn.jsdelivr.net blocked?). Check your connection.');return;}
  window.addEventListener('error',e=>msg('Error: '+e.message));
  try{initChart();}catch(e){msg('Chart init failed: '+e.message);return;}
  S.assets=baseAssets(FALL);ui();
  const sv=JSON.parse(localStorage.getItem('qc_v2')||'{}').sym;
  load(S.assets.find(x=>x.s===sv)||S.assets.find(x=>x.s==='BTCUSDT'),TFS.includes(S.tf)?S.tf:'15m');tickers();
  registry().then(()=>{const c=S.asset&&S.asset.s;ui();$('#sym').value=c;$('#tf').value=S.tf;S.asset=S.assets.find(x=>x.s===c)||S.asset;tickers();}).catch(()=>{});
  setTimeout(autoScan,6000);setInterval(autoScan,90000);
}
boot();
return {ask,S};
})();
