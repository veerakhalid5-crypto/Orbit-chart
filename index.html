        ctx.fillStyle = isSup ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
        ctx.font = '600 10px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText(`${isSup ? 'SUP' : 'RES'} ${fmtPrice(s.price)} (${s.count}×)`, 8, y - 4);
      });
    }

    // Fibonacci
    if (STATE.layers.fib && a.fib) {
      a.fib.levels.forEach(l => {
        const y = yOf(l.p);
        if (y == null) return;
        ctx.strokeStyle = 'rgba(184,141,255,0.45)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(rect.width - 60, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(184,141,255,0.9)';
        ctx.font = '500 9px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText(`${(l.r*100).toFixed(1)}% ${fmtPrice(l.p)}`, rect.width - 55, y + 3);
      });
    }

    // Premium/Discount
    if (STATE.layers.pd && a.pd) {
      const eqY = yOf(a.pd.mid);
      const hiY = yOf(a.pd.high);
      const loY = yOf(a.pd.low);
      if (eqY != null && hiY != null && loY != null) {
        ctx.fillStyle = 'rgba(255,61,90,0.04)';
        ctx.fillRect(0, hiY, rect.width, eqY - hiY);
        ctx.fillStyle = 'rgba(0,229,160,0.04)';
        ctx.fillRect(0, eqY, rect.width, loY - eqY);
        ctx.strokeStyle = 'rgba(255,181,71,0.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([8,6]);
        ctx.beginPath();
        ctx.moveTo(0, eqY);
        ctx.lineTo(rect.width - 60, eqY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,181,71,0.95)';
        ctx.font = '600 10px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText(`EQ ${fmtPrice(a.pd.mid)}`, 8, eqY - 4);
      }
    }

    // Order Blocks
    if (STATE.layers.ob) {
      a.ob.forEach(o => {
        const x1 = xOf(o.time);
        const x2 = rect.width - 60;
        if (x1 == null) return;
        const y1 = yOf(o.hi);
        const y2 = yOf(o.lo);
        if (y1 == null || y2 == null) return;
        const isBull = o.dir > 0;
        ctx.fillStyle = isBull ? 'rgba(0,229,160,0.10)' : 'rgba(255,61,90,0.10)';
        ctx.strokeStyle = isBull ? 'rgba(0,229,160,0.55)' : 'rgba(255,61,90,0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.rect(x1, y1, x2 - x1, y2 - y1);
        ctx.fill();
        ctx.stroke();
        // Label
        ctx.fillStyle = isBull ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
        ctx.font = '600 9.5px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText(`${isBull ? 'OB+' : 'OB-'} Q${o.quality}`, x1 + 4, y1 + 11);
      });
    }

    // FVGs
    if (STATE.layers.fvg) {
      a.fvg.forEach(f => {
        const x1 = xOf(f.time);
        if (x1 == null) return;
        const x2 = rect.width - 60;
        const y1 = yOf(f.hi);
        const y2 = yOf(f.lo);
        if (y1 == null || y2 == null) return;
        const isBull = f.dir > 0;
        ctx.fillStyle = isBull ? 'rgba(91,154,255,0.10)' : 'rgba(255,181,71,0.10)';
        ctx.strokeStyle = isBull ? 'rgba(91,154,255,0.5)' : 'rgba(255,181,71,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(x1, y1, x2 - x1, y2 - y1);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = isBull ? 'rgba(91,154,255,0.95)' : 'rgba(255,181,71,0.95)';
        ctx.font = '600 9px "JetBrains Mono"';
        ctx.textAlign = 'left';
        ctx.fillText(isBull ? 'FVG+' : 'FVG-', x1 + 4, y1 + 10);
      });
    }

    // Trendlines
    if (STATE.layers.trendlines) {
      a.trendlines.forEach(tl => {
        const x1 = xOf(tl.a.t);
        const x2 = xOf(candles[candles.length-1].time);
        if (x1 == null || x2 == null) return;
        const y1 = yOf(tl.a.v);
        const y2 = yOf(tl.now);
        if (y1 == null || y2 == null) return;
        ctx.strokeStyle = tl.isSupport ? 'rgba(0,229,160,0.7)' : 'rgba(255,61,90,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      });
    }

    // Liquidity pools
    if (STATE.layers.liq) {
      a.liq.forEach(l => {
        const y = yOf(l.price);
        if (y == null) return;
        ctx.strokeStyle = l.kind === 'high' ? 'rgba(255,61,90,0.6)' : 'rgba(0,229,160,0.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2,3]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(rect.width - 60, y);
        ctx.stroke();
        ctx.setLineDash([]);
        // small marker
        const markX = rect.width - 66;
        ctx.fillStyle = l.kind === 'high' ? 'rgba(255,61,90,0.9)' : 'rgba(0,229,160,0.9)';
        ctx.beginPath();
        ctx.arc(markX, y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(139,152,171,0.9)';
        ctx.font = '500 9px "JetBrains Mono"';
        ctx.textAlign = 'right';
        ctx.fillText(`LIQ ×${l.count}`, markX - 6, y + 3);
      });
    }

    // Swing labels (HH/HL/LH/LL) + BOS/CHoCH markers
    if (STATE.layers.swings) {
      a.swings.sh.forEach((s, i) => {
        if (i === 0) return;
        const prev = a.swings.sh[i-1];
        const y = yOf(s.price);
        const x = xOf(s.time);
        if (y == null || x == null) return;
        const label = s.price > prev.price ? 'HH' : 'LH';
        ctx.fillStyle = label === 'HH' ? 'rgba(0,229,160,0.9)' : 'rgba(255,181,71,0.9)';
        ctx.font = '600 9px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y - 8);
      });
      a.swings.sl.forEach((s, i) => {
        if (i === 0) return;
        const prev = a.swings.sl[i-1];
        const y = yOf(s.price);
        const x = xOf(s.time);
        if (y == null || x == null) return;
        const label = s.price > prev.price ? 'HL' : 'LL';
        ctx.fillStyle = label === 'HL' ? 'rgba(91,154,255,0.9)' : 'rgba(255,61,90,0.9)';
        ctx.font = '600 9px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + 14);
      });
      // BOS/CHoCH
      a.structure.slice(-4).forEach(ev => {
        const x = xOf(ev.time);
        const y = yOf(ev.level);
        if (x == null || y == null) return;
        ctx.fillStyle = ev.dir > 0 ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
        ctx.font = '700 9.5px "JetBrains Mono"';
        ctx.textAlign = ev.dir > 0 ? 'left' : 'right';
        ctx.fillText(ev.kind, x + (ev.dir > 0 ? 6 : -6), y - 4);
        // small line
        ctx.strokeStyle = ev.dir > 0 ? 'rgba(0,229,160,0.5)' : 'rgba(255,61,90,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (ev.dir > 0 ? 30 : -30), y);
        ctx.stroke();
      });
    }

    // Patterns
    if (STATE.layers.patterns && a.patterns) {
      a.patterns.forEach(p => {
        if (!p.points || p.points.length < 2) return;
        ctx.strokeStyle = p.dir > 0 ? 'rgba(0,229,160,0.7)' : 'rgba(255,61,90,0.7)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5,3]);
        ctx.beginPath();
        let started = false;
        p.points.forEach(pt => {
          const x = xOf(pt.t), y = yOf(pt.v);
          if (x == null || y == null) return;
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        });
        if (started) ctx.stroke();
        ctx.setLineDash([]);
        // Label
        const firstPt = p.points[0];
        const xL = xOf(firstPt.t);
        const yL = yOf(firstPt.v);
        if (xL != null && yL != null) {
          ctx.fillStyle = p.dir > 0 ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
          ctx.font = '600 9.5px "JetBrains Mono"';
          ctx.textAlign = 'left';
          ctx.fillText(p.name, xL + 4, yL - 6);
        }
      });
    }

    // Last price dot
    const lastPrice = candles[candles.length-1].close;
    const lastY = yOf(lastPrice);
    if (lastY != null) {
      ctx.fillStyle = 'rgba(91,154,255,0.9)';
      ctx.beginPath();
      ctx.arc(rect.width - 60, lastY, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  };

        swings.sl = dedupeSwings(swings.sl, true);
        const structure = detectStructure(candles, swings);

        if (regime.kind.includes('up')) score += 30;
        if (regime.kind.includes('down')) score -= 30;
        const ob = detectOrderBlocks(candles, structure, atr);
        score += ob.length * 5;
        results.push({ asset, score, chg, regime, cur });
      } catch(e) {}
      el.innerHTML = `<div class="section-h">Scanning… ${i+1}/${picks.length}</div>` +

  const renderFlow = () => {
    const a = STATE.analysis;
    const el = $('#t-flow');
    if (!a) {
      el.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">Loading…</div>`;
      return;
    }
    const c = STATE.candles;
    // Compute volume delta approximation
    let buyVol = 0, sellVol = 0;
    for (const candle of c.slice(-20)) {
      const range = candle.high - candle.low || 1;
      const buyFrac = (candle.close - candle.low) / range;
      buyVol += candle.volume * buyFrac;
      sellVol += candle.volume * (1 - buyFrac);
    }
    const total = buyVol + sellVol;
    const buyPct = total ? buyVol / total * 100 : 50;
    const ratio = sellVol ? buyVol / sellVol : 0;

    // Order block imbalance
    const bullOBs = a.ob.filter(o => o.dir > 0).length;
    const bearOBs = a.ob.filter(o => o.dir < 0).length;
    const bullFVGs = a.fvg.filter(f => f.dir > 0).length;
    const bearFVGs = a.fvg.filter(f => f.dir < 0).length;

    const vp = a.vprofile;
    const price = a.price;
    let vpPos = 'inside';
    if (vp) {
      if (price > vp.vah) vpPos = 'above VAH';
      else if (price < vp.val) vpPos = 'below VAL';
      else vpPos = 'in value area';
    }

    el.innerHTML = `
      <div class="section-h">Order Flow · last 20 candles</div>
      <div class="kv-grid">
        <div class="kv-cell">
          <div class="k">Buy pressure</div>
          <div class="v up">${buyPct.toFixed(1)}%</div>
          <div class="s">delta ratio ${ratio.toFixed(2)}</div>
        </div>
        <div class="kv-cell">
          <div class="k">Sell pressure</div>
          <div class="v down">${(100 - buyPct).toFixed(1)}%</div>
          <div class="s">volume weighted</div>
        </div>
        <div class="kv-cell">
          <div class="k">Bull OB / FVG</div>
          <div class="v up">${bullOBs} / ${bullFVGs}</div>
          <div class="s">untested</div>
        </div>
        <div class="kv-cell">
          <div class="k">Bear OB / FVG</div>
          <div class="v down">${bearOBs} / ${bearFVGs}</div>
          <div class="s">untested</div>
        </div>
      </div>

      <div class="section-h">Volume Profile</div>
      ${vp ? `
        <div class="stat-block">
          <div class="row"><span class="k">POC</span><span class="v">${fmtPrice(vp.poc)}</span></div>
          <div class="row"><span class="k">Value Area High</span><span class="v">${fmtPrice(vp.vah)}</span></div>
          <div class="row"><span class="k">Value Area Low</span><span class="v">${fmtPrice(vp.val)}</span></div>
          <div class="row"><span class="k">Price position</span><span class="v ${vpPos === 'above VAH' ? 'up' : vpPos === 'below VAL' ? 'down' : ''}">${vpPos}</span></div>
        </div>
      ` : ''}

      <div class="section-h">Session Flow</div>
      <div class="stat-block">
        <div class="row"><span class="k">Active session</span><span class="v">${a.sessions.length ? a.sessions[a.sessions.length-1].name : 'None'}</span></div>
        <div class="row"><span class="k">Recent sessions</span><span class="v" style="font-size:11px;">${a.sessions.slice(-3).map(s => s.name).join(' · ') || '—'}</span></div>
      </div>
    `;
  };

  // ============================================================
  // STATS
  // ============================================================
  const renderStats = () => {
    const a = STATE.analysis;
    const el = $('#t-stats');
    if (!a) { el.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">Loading…</div>`; return; }
    const c = STATE.candles;
    const price = a.price;

    // Volatility stats
    const returns = [];
    for (let i = 1; i < c.length; i++) returns.push((c[i].close - c[i-1].close) / c[i-1].close);
    const meanRet = returns.reduce((s,r) => s+r, 0) / returns.length;
    const variance = returns.reduce((s,r) => s + (r-meanRet)**2, 0) / returns.length;
    const vol = Math.sqrt(variance) * Math.sqrt(365 * 24 * 60 / (TF_SEC[STATE.tf]/60)) * 100;

    // RSI
    const curRSI = a.rsi[c.length-1];

    // Position calc
    const equity = STATE.equity;
    const risk = STATE.risk;
    const riskAmt = equity * risk / 100;
    const stopDist = a.atr * 1.5;
    const stopPct = stopDist / price;
    const positionSize = riskAmt / stopPct;
    const qty = positionSize / price;

    el.innerHTML = `
      <div class="stat-block">
        <h4>Market Volatility</h4>
        <div class="row"><span class="k">ATR (14)</span><span class="v">${fmtPrice(a.atr)}</span></div>
        <div class="row"><span class="k">ATR %</span><span class="v">${(a.atr/price*100).toFixed(2)}%</span></div>
        <div class="row"><span class="k">Annualized vol</span><span class="v">${vol.toFixed(1)}%</span></div>
        <div class="row"><span class="k">Regime</span><span class="v ${a.regime.kind.includes('up') ? 'up' : a.regime.kind.includes('down') ? 'down' : ''}">${a.regime.kind}</span></div>
      </div>

      <div class="stat-block">
        <h4>Momentum</h4>
        <div class="row"><span class="k">RSI (14)</span><span class="v ${curRSI > 70 ? 'down' : curRSI < 30 ? 'up' : ''}">${curRSI?.toFixed(1) || '—'}</span></div>
        <div class="row"><span class="k">RSI state</span><span class="v">${curRSI > 70 ? 'Overbought' : curRSI < 30 ? 'Oversold' : 'Neutral'}</span></div>
        <div class="row"><span class="k">EMA 20</span><span class="v">${fmtPrice(a.ema20[c.length-1])}</span></div>
        <div class="row"><span class="k">EMA 50</span><span class="v">${fmtPrice(a.ema50[c.length-1])}</span></div>
        <div class="row"><span class="k">EMA 200</span><span class="v">${fmtPrice(a.ema200[c.length-1])}</span></div>
      </div>

      <div class="stat-block">
        <h4>Position Size Calculator</h4>
        <div class="calc-input">
          <label>Account equity ($)</label>
          <input type="number" id="calc-eq" value="${equity}" step="100">
        </div>
        <div class="calc-input">
          <label>Risk per trade (%)</label>
          <input type="number" id="calc-risk" value="${risk}" step="0.1">
        </div>
        <div class="row"><span class="k">Risk amount</span><span class="v">$${riskAmt.toFixed(2)}</span></div>
        <div class="row"><span class="k">Suggested stop (1.5 ATR)</span><span class="v">${fmtPrice(price - stopDist)}</span></div>
        <div class="row"><span class="k">Stop distance</span><span class="v">${(stopPct*100).toFixed(2)}%</span></div>
        <div class="row"><span class="k">Position size</span><span class="v">$${positionSize.toFixed(0)}</span></div>
        <div class="row"><span class="k">Quantity</span><span class="v">${qty.toFixed(4)}</span></div>
      </div>
    `;

    $('#calc-eq')?.addEventListener('input', e => { STATE.equity = +e.target.value; save(); renderStats(); });
    $('#calc-risk')?.addEventListener('input', e => { STATE.risk = +e.target.value; save(); renderStats(); });
  };

  // ============================================================
  // DATA
  // ============================================================
  const renderData = () => {
    const el = $('#t-data');
    const c = STATE.candles;
    if (!c.length) { el.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">No data</div>`; return; }
    const rows = c.slice(-30).reverse().map(candle => {
      const chg = (candle.close - candle.open) / candle.open * 100;
      const cls = chg >= 0 ? 'up' : 'down';
      return `<tr>
        <td>${fmtDT(candle.time)}</td>
        <td>${fmtPrice(candle.open)}</td>
        <td>${fmtPrice(candle.high)}</td>
        <td>${fmtPrice(candle.low)}</td>
        <td>${fmtPrice(candle.close)}</td>
        <td class="${cls}">${fmtPct(chg)}</td>
        <td>${fmtVol(candle.volume)}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `
      <div class="section-h">${STATE.asset.n} · ${STATE.tf} · ${c.length} candles</div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead><tr><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg</th><th>Vol</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="section-h" style="margin-top:12px;">Data Source</div>
      <div style="font-size:11px;color:var(--text-mute);line-height:1.5;">${STATE.src}<br>Endpoint: ${STATE.asset.fut ? 'fapi.binance.com' : 'api.binance.com'}</div>
      <div style="margin-top:10px;">
        <button class="chat-suggest" id="export-csv">Export CSV</button>
      </div>
    `;
    $('#export-csv')?.addEventListener('click', () => {
      const csv = 'time,open,high,low,close,volume\n' + c.map(x =>
        [x.time, x.open, x.high, x.low, x.close, x.volume].join(',')
      ).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${STATE.asset.s}-${STATE.tf}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('CSV exported', 'ok');
    });
  };

  // ============================================================
  // CHAT
  // ============================================================
  const chatLog = (role, text) => {
    const el = $('#chatlog');
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = text;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    STATE.log.unshift({ role, text, time: Date.now() });
    save();
  };

  const parseCommand = (text) => {
    const t = text.toLowerCase().trim();
    const out = {};

    // Asset
    for (const [alias, sym] of Object.entries(ALIASES)) {
      if (t.includes(alias)) { out.symbol = sym; break; }
    }
    if (!out.symbol) {
      const m = t.match(/\b([a-z]{2,6})\b/g) || [];
      for (const w of m) {
        const cand = w.toUpperCase() + 'USDT';
        if (STATE.assets.find(a => a.s === cand)) { out.symbol = cand; break; }
      }
    }

    // Timeframe
    const tfMatch = t.match(/\b(1m|3m|5m|15m|30m|1h|2h|4h|6h|8h|12h|1d|3d|1w|1M)\b/i);
    if (tfMatch) out.tf = tfMatch[1];

    // Layer toggles
    if (/\b(show|enable|turn on|display)\b/.test(t) || /\b(order block|ob|fvg|fair value|imbalance)\b/.test(t)) {
      out.layers = [];
      if (/order block|ob\b/.test(t)) out.layers.push('ob');
      if (/fvg|fair value|imbalance/.test(t)) out.layers.push('fvg');
      if (/support|resistance|s\/r/.test(t)) out.layers.push('sr');
      if (/trend|trendline/.test(t)) out.layers.push('trendlines');
      if (/swing/.test(t)) out.layers.push('swings');
      if (/liq|liquidity/.test(t)) out.layers.push('liq');
      if (/fib|fibonacci/.test(t)) out.layers.push('fib');
      if (/session|killzone/.test(t)) out.layers.push('sessions');
    }

    // Bias
    if (/\bbullish|bull\b/.test(t)) out.filter = 'bullish';
    if (/\bbearish|bear\b/.test(t)) out.filter = 'bearish';

    // Actions
    if (/\b(clear|reset|hide all|remove all)\b/.test(t)) out.action = 'clear';
    if (/\bscan\b/.test(t)) out.action = 'scan';
    if (/\b(analysis|setup|read|what.*setup|what.*outlook)\b/.test(t)) out.action = 'read';
    if (/\blong|buy\b/.test(t)) out.action = 'long';
    if (/\bshort|sell\b/.test(t)) out.action = 'short';
    const riskM = t.match(/(?:risk|size)\s*(\d+(?:\.\d+)?)\s*%/);
    if (riskM) out.risk = +riskM[1];

    return out;
  };

  const runCommand = async (text) => {
    chatLog('user', escapeHTML(text));
    const cmd = parseCommand(text);

    try {
      if (cmd.symbol) {
        const asset = STATE.assets.find(a => a.s === cmd.symbol);
        if (asset) {
          if (cmd.tf) STATE.tf = cmd.tf;
          await setAsset(asset);
          chatLog('bot', `Loaded <b>${asset.n} (${asset.s})</b> on <code>${STATE.tf}</code>.`);
        }
      } else if (cmd.tf && !cmd.symbol) {
        STATE.tf = cmd.tf;
        await loadData();
        chatLog('bot', `Timeframe set to <code>${cmd.tf}</code>.`);
      }

      if (cmd.action === 'clear') {
        Object.keys(STATE.layers).forEach(k => STATE.layers[k] = 0);
        document.querySelectorAll('#lp [data-layer]').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.layer-chip').forEach(b => b.classList.remove('on'));
        addIndicators(); drawOverlay(); save();
        chatLog('bot', 'All overlay layers cleared.');
        return;
      }

      if (cmd.layers && cmd.layers.length) {
        cmd.layers.forEach(l => STATE.layers[l] = 1);
        document.querySelectorAll('#lp [data-layer]').forEach(b => b.classList.toggle('on', !!STATE.layers[b.dataset.layer]));
        document.querySelectorAll('.layer-chip').forEach(b => b.classList.toggle('on', !!STATE.layers[b.dataset.layer]));
        addIndicators(); drawOverlay(); save();
        chatLog('bot', `Enabled: ${cmd.layers.map(l => l.toUpperCase()).join(', ')}.`);
      }

      if (cmd.action === 'read' && STATE.analysis) {
        const a = STATE.analysis;
        chatLog('bot',
          `<b>${STATE.asset.n} · ${STATE.tf}</b><br>` +
          `Bias: <b>${a.bias}</b> (score ${a.score > 0 ? '+' : ''}${a.score})<br>` +
          `Regime: ${a.regime.kind}<br>` +
          `ATR: ${fmtPrice(a.atr)} · RSI: ${a.rsi[STATE.candles.length-1]?.toFixed(1)}<br>` +
          `Nearest support: ${a.nearestSup ? fmtPrice(a.nearestSup.price) : '—'}<br>` +
          `Nearest resistance: ${a.nearestRes ? fmtPrice(a.nearestRes.price) : '—'}`
        );
      }

      if (cmd.action === 'scan') {
        switchTab('scan');
        chatLog('bot', `Scanning ${STATE.assets.filter(a => a.group === 'Crypto Top 50').length} crypto pairs on ${STATE.tf}…`);
      }

      if (cmd.action === 'long' || cmd.action === 'short') {
        const a = STATE.analysis;
        if (!a) { chatLog('bot', 'Load a chart first.'); return; }
        const isLong = cmd.action === 'long';
        const entry = a.price;
        const stop = isLong ? entry - a.atr * 1.5 : entry + a.atr * 1.5;
        const target = isLong ? entry + a.atr * 3 : entry - a.atr * 3;
        const rr = 2;
        chatLog('bot',
          `<b>${isLong ? 'LONG' : 'SHORT'} ${STATE.asset.n}</b><br>` +
          `Entry: ${fmtPrice(entry)}<br>` +
          `Stop: ${fmtPrice(stop)}<br>` +
          `Target: ${fmtPrice(target)} (${rr}R)<br>` +
          `Risk: ${cmd.risk || STATE.risk}% = $${((cmd.risk || STATE.risk) / 100 * STATE.equity).toFixed(0)}`
        );
      }

      if (!cmd.symbol && !cmd.tf && !cmd.layers && !cmd.action) {
        chatLog('bot', `I can: change symbols/timeframes, toggle layers, run analysis, scan markets, or size trades.<br><br>Try: <code>show order blocks on gold 4h</code>, <code>scan crypto 15m</code>, <code>what's the setup on BTC 1h</code>.`);
      }
    } catch (e) {
      chatLog('bot', `Error: ${escapeHTML(e.message)}`);
    }
  };

  // ============================================================
  // WEBSOCKET LIVE
  // ============================================================
  const connectWS = () => {
    if (STATE.ws) { try { STATE.ws.close(); } catch(e) {} }
    if (!STATE.asset) return;
    const stream = STATE.asset.s.toLowerCase() + '@kline_' + STATE.tf;
    const url = (STATE.asset.fut ? 'wss://fstream.binance.com/ws/' : 'wss://stream.binance.com:9443/ws/') + stream;
    try {
      const ws = new WebSocket(url);
      STATE.ws = ws;
      ws.onopen = () => { $('#dot').className = 'live'; };
      ws.onclose = () => { $('#dot').className = ''; };
      ws.onerror = () => { $('#dot').className = 'err'; };
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          const k = d.k;
          if (!k) return;
          const candle = {
            time: Math.floor(k.t / 1000),
            open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v
          };
          const last = STATE.candles[STATE.candles.length-1];
          if (last && candle.time === last.time) {
            STATE.candles[STATE.candles.length-1] = candle;
          } else if (!last || candle.time > last.time) {
            STATE.candles.push(candle);
            if (STATE.candles.length > 500) STATE.candles.shift();
          }
          if (STATE.series) {
            try { STATE.series.update(candle); } catch(err) {}
          }
          const chg = (candle.close - candle.open) / candle.open * 100;
          updatePriceHeader(candle.close, chg);
        } catch(e) {}
      };
    } catch (e) {}
  };

  // ============================================================
  // MAIN LOADERS
  // ============================================================
  const setAsset = async (asset) => {
    STATE.asset = asset;
    $('#sym').value = asset.s;
    await loadData();
  };

  const loadData = async () => {
    if (!STATE.asset) return;
    STATE.loading = true;
    $('#dot').className = 'loading';
    $('#skeleton').classList.add('show');
    msg(`loading ${STATE.asset.s} ${STATE.tf}…`);

    try {
      const candles = await fetchKlines(STATE.asset, STATE.tf, 500);
      STATE.candles = candles;
      STATE.analysis = analyze(candles, STATE.tf);

      // HTF analysis
      const htf = HTF_MAP[STATE.tf];
      if (htf && htf !== STATE.tf) {
        try {
          STATE.htf = await fetchKlines(STATE.asset, htf, 200);
          STATE.htfAnalysis = analyze(STATE.htf, htf);
        } catch(e) {}
      }

      buildSeries();
      renderRead();
      renderFlow();
      renderStats();
      renderData();

      const last = candles[candles.length-1];
      const prev = candles[candles.length-2];
      const chg = prev ? (last.close - prev.close) / prev.close * 100 : 0;
      updatePriceHeader(last.close, chg);

      msg(`${STATE.asset.s} · ${STATE.tf} · ${candles.length} bars · ${new Date().toLocaleTimeString()}`);
      $('#dot').className = 'live';
      connectWS();
      save();
    } catch(e) {
      msg('load error: ' + e.message);
      $('#dot').className = 'err';
      toast('Failed: ' + e.message, 'err');
    } finally {
      STATE.loading = false;
      $('#skeleton').classList.remove('show');
    }
  };

  // ============================================================
  // TABS
  // ============================================================
  const switchTab = (name) => {
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    ['read','chat','scan','flow','stats','data'].forEach(t => {
      const el = $('#t-' + t);
      if (el) el.hidden = t !== name;
    });
    if (name === 'flow') renderFlow();
    if (name === 'stats') renderStats();
    if (name === 'data') renderData();
    if (name === 'scan') renderScan();
    if (name === 'read') renderRead();
  };

  // ============================================================
  // EVENTS
  // ============================================================
  const bindEvents = () => {
    $('#sym').addEventListener('change', async (e) => {
      const s = e.target.value;
      const asset = STATE.assets.find(a => a.s === s);
      if (asset) await setAsset(asset);
    });
    $('#tf').addEventListener('change', async (e) => {
      STATE.tf = e.target.value;
      await loadData();
    });
    $('#ty').addEventListener('change', (e) => {
      STATE.chartType = e.target.value;
      buildSeries();
      save();
    });
    $('#fs').addEventListener('click', () => {
      document.documentElement.classList.toggle('fs');
      setTimeout(() => {
        if (STATE.chart) {
          const r = $('#cw').getBoundingClientRect();
          STATE.chart.applyOptions({ width: r.width, height: r.height });
        }
        drawOverlay();
      }, 50);
    });
    $('#layers-btn').addEventListener('click', () => {
      $('#lp').classList.toggle('open');
    });
    $$('#tabs button').forEach(b => {
      b.addEventListener('click', () => switchTab(b.dataset.tab));
    });
    $('#go').addEventListener('click', () => {
      const q = $('#q').value.trim();
      if (q) { $('#q').value = ''; runCommand(q); }
    });
    $('#q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { $('#go').click(); }
    });
    $$('.chat-suggest').forEach(b => {
      b.addEventListener('click', () => runCommand(b.textContent));
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, select, textarea')) return;
      const tfs = { '1':'1m','2':'5m','3':'15m','4':'1h','5':'4h','6':'1d' };
      if (tfs[e.key]) {
        STATE.tf = tfs[e.key];
        $('#tf').value = STATE.tf;
        loadData();
      }
      if (e.key === 'f' || e.key === 'F') $('#fs').click();
      if (e.key === 'l' || e.key === 'L') $('#layers-btn').click();
      if (e.key === 'Escape') $('#lp').classList.remove('open');
    });

    // Click outside layer panel
    document.addEventListener('click', (e) => {
      const lp = $('#lp');
      const btn = $('#layers-btn');
      if (!lp.classList.contains('open')) return;
      if (lp.contains(e.target) || btn.contains(e.target)) return;
      lp.classList.remove('open');
    });

    // Window resize
    window.addEventListener('resize', () => {
      if (STATE.chart) {
        const r = $('#cw').getBoundingClientRect();
        STATE.chart.applyOptions({ width: r.width, height: r.height });
      }
      drawOverlay();
    });
  };

  // ============================================================
  // INIT
  // ============================================================
  const init = async () => {
    msg('fetching symbols…');
    try {
      await fetchSymbols();
    } catch(e) {
      toast('Symbol fetch failed, using fallback', 'warn');
    }

    buildTFSelect();
    buildTypeSelect();
    buildSymbolSelect();
    buildLayerChips();
    buildLayerPanel();
    initChart();

    // Pick initial asset
    let asset = null;
    if (STATE._savedAsset) {
      asset = STATE.assets.find(a => a.s === STATE._savedAsset);
    }
    if (!asset) asset = STATE.assets.find(a => a.s === 'BTCUSDT') || STATE.assets[0];
    STATE.asset = asset;
    $('#sym').value = asset.s;

    bindEvents();
    buildTicker();

    await loadData();

    chatLog('bot',
      `Welcome to <b>QCity Terminal</b>.<br>` +
      `Loaded <b>${asset.n} (${asset.s})</b> on <code>${STATE.tf}</code>.<br>` +
      `<br>Ask me anything — <code>show order blocks on gold 4h</code>, <code>scan crypto 15m</code>, <code>what's the setup on BTC</code>.`
    );

    msg('ready');
  };

  // Boot
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
