<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institutional Trading Chart · SMC Pro</title>
  <!-- Lightweight Charts Standalone (CDN) -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    /* ------------------------------------------------------------
       RESET & GLOBAL
    ------------------------------------------------------------ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #131a2a;
      --bg-panel: #1a2335;
      --text-primary: #d1d4dc;
      --text-secondary: #8b95a8;
      --accent-green: #26a69a;
      --accent-red: #ef5350;
      --accent-blue: #2962ff;
      --accent-yellow: #ffd700;
      --border-color: #2a3450;
    }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); }

    /* ------------------------------------------------------------
       LAYOUT
    ------------------------------------------------------------ */
    .app { display: flex; height: 100vh; width: 100vw; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 20px;
    }
    .sidebar h1 { font-size: 1.1rem; font-weight: 600; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .sidebar h1 span { color: var(--accent-blue); }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); font-weight: 600; }

    .symbol-select, .timeframe-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .symbol-select button, .timeframe-buttons button {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .symbol-select button.active, .timeframe-buttons button.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }
    .symbol-select button:hover, .timeframe-buttons button:hover { border-color: var(--accent-blue); color: #fff; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
    .toggle-row span { font-size: 0.8rem; color: var(--text-primary); }
    .toggle-switch {
      position: relative; width: 36px; height: 20px;
      background: var(--bg-panel); border-radius: 10px;
      border: 1px solid var(--border-color);
      cursor: pointer; transition: background 0.2s;
    }
    .toggle-switch.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .toggle-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-secondary); transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch.active::after { transform: translateX(16px); background: #fff; }

    /* Main chart area */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; min-height: 0; }
    .chart-container {
      flex: 1;
      position: relative;
      min-height: 0;    /* critical for flex child */
      width: 100%;
      height: 100%;
    }
    /* Ensure the chart canvas fills the container */
    .chart-container canvas { display: block; }

    /* Status bar */
    .status-bar {
      height: 28px; background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex; align-items: center; padding: 0 16px;
      gap: 20px; font-size: 0.7rem; color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }
    .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .dot.red { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
    .dot.yellow { background: var(--accent-yellow); box-shadow: 0 0 6px var(--accent-yellow); }

    /* Overlay legend */
    .legend {
      position: absolute; top: 12px; left: 12px;
      display: flex; gap: 12px; flex-wrap: wrap;
      pointer-events: none; z-index: 10;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.65rem; color: var(--text-secondary); background: rgba(10,14,23,0.7); padding: 2px 8px; border-radius: 4px; backdrop-filter: blur(4px); }
    .legend-item .swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* Toast / error */
    .toast {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: var(--bg-panel); border: 1px solid var(--accent-red);
      color: var(--text-primary); padding: 10px 20px; border-radius: 8px;
      font-size: 0.8rem; z-index: 100; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 200px; min-width: 200px; padding: 12px; }
      .symbol-select button, .timeframe-buttons button { padding: 4px 8px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar">
    <h1>⚡ SMC <span>Pro</span></h1>

    <!-- Symbol selector -->
    <div class="control-group">
      <label>Symbol</label>
      <div class="symbol-select" id="symbolSelect">
        <button data-symbol="BTCUSDT" class="active">BTC/USDT</button>
        <button data-symbol="ETHUSDT">ETH/USDT</button>
        <button data-symbol="SOLUSDT">SOL/USDT</button>
        <button data-symbol="BNBUSDT">BNB/USDT</button>
        <button data-symbol="XRPUSDT">XRP/USDT</button>
      </div>
    </div>

    <!-- Timeframe -->
    <div class="control-group">
      <label>Timeframe</label>
      <div class="timeframe-buttons" id="timeframeSelect">
        <button data-interval="1m" class="active">1m</button>
        <button data-interval="5m">5m</button>
        <button data-interval="15m">15m</button>
        <button data-interval="1h">1h</button>
        <button data-interval="4h">4h</button>
        <button data-interval="1d">1d</button>
      </div>
    </div>

    <!-- SMC Overlays -->
    <div class="control-group">
      <label>Smart Money Concepts</label>
      <div class="toggle-row">
        <span>Fair Value Gaps</span>
        <div class="toggle-switch active" data-overlay="fvg" id="toggleFVG"></div>
      </div>
      <div class="toggle-row">
        <span>Order Blocks</span>
        <div class="toggle-switch active" data-overlay="ob" id="toggleOB"></div>
      </div>
      <div class="toggle-row">
        <span>Break of Structure</span>
        <div class="toggle-switch active" data-overlay="bos" id="toggleBOS"></div>
      </div>
      <div class="toggle-row">
        <span>Liquidity Sweeps</span>
        <div class="toggle-switch active" data-overlay="sweep" id="toggleSweep"></div>
      </div>
      <div class="toggle-row">
        <span>Trendlines</span>
        <div class="toggle-switch active" data-overlay="trendline" id="toggleTrendline"></div>
      </div>
    </div>

    <!-- Legend -->
    <div class="control-group" style="margin-top:auto;">
      <label>Legend</label>
      <div style="display:flex; flex-direction:column; gap:6px; font-size:0.7rem; color:var(--text-secondary);">
        <div><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#26a69a;margin-right:6px;vertical-align:middle;"></span> Bullish FVG / OB</div>
        <div><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#ef5350;margin-right:6px;vertical-align:middle;"></span> Bearish FVG / OB</div>
        <div><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#ffd700;margin-right:6px;vertical-align:middle;"></span> BOS / Liquidity</div>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN CHART ==================== -->
  <div class="main">
    <div class="chart-container" id="chartContainer">
      <!-- Chart injected here -->
      <div class="legend" id="legend"></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="status-bar">
      <span><span class="dot yellow" id="connDot"></span><span id="connText">Connecting…</span></span>
      <span id="priceDisplay">—</span>
      <span id="changeDisplay">—</span>
      <span id="volumeDisplay">—</span>
      <span style="margin-left:auto;" id="lastUpdate">—</span>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================
 *  INSTITUTIONAL TRADING CHART · SMC PRO
 *  Single-file implementation using Lightweight Charts v4
 *  Fixes: container sizing, hex colors, symbol-switch reset,
 *         async init race, setData sequencing.
 * ============================================================
 */
(function() {
  'use strict';

  // ---------- CONFIG ----------
  const BINANCE_REST = 'https://api.binance.com/api/v3/klines';
  const BINANCE_WS = 'wss://stream.binance.com:9443/ws';
  const MAX_BARS = 500;

  // ---------- STATE ----------
  const state = {
    symbol: 'BTCUSDT',
    interval: '1m',
    chart: null,
    candleSeries: null,
    volumeSeries: null,
    // Overlay series (SMC)
    overlaySeries: [],       // array of { series, type }
    // Toggles
    overlays: { fvg: true, ob: true, bos: true, sweep: true, trendline: true },
    // Data
    bars: [],
    // WebSocket
    ws: null,
    // Init generation guard
    initId: 0,
    // Abort controller for REST fetch
    abortController: null,
    // Markers array (for BOS/sweep)
    markers: [],
  };

  // ---------- DOM REFS ----------
  const container = document.getElementById('chartContainer');
  const symbolSelect = document.getElementById('symbolSelect');
  const timeframeSelect = document.getElementById('timeframeSelect');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const priceDisplay = document.getElementById('priceDisplay');
  const changeDisplay = document.getElementById('changeDisplay');
  const volumeDisplay = document.getElementById('volumeDisplay');
  const lastUpdate = document.getElementById('lastUpdate');
  const toastEl = document.getElementById('toast');

  // ---------- UTILS ----------
  function showToast(msg, isError = true) {
    toastEl.textContent = msg;
    toastEl.style.borderColor = isError ? 'var(--accent-red)' : 'var(--accent-green)';
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 4000);
  }

  function fmtPrice(p) {
    if (p >= 1000) return p.toFixed(2);
    if (p >= 1) return p.toFixed(4);
    return p.toFixed(6);
  }

  function fmtVolume(v) {
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(2) + 'K';
    return v.toFixed(2);
  }

  // ---------- CHART INITIALISATION (FIXED) ----------
  function createChart() {
    // Guard: ensure container has dimensions
    if (container.clientWidth === 0 || container.clientHeight === 0) {
      console.warn('Chart container has zero dimensions – retrying in rAF');
      requestAnimationFrame(createChart);
      return null;
    }

    const chart = LightweightCharts.createChart(container, {
      // FIX 1: explicit width/height fallback + autoSize
      width: container.clientWidth,
      height: container.clientHeight || 400,
      autoSize: true,   // uses ResizeObserver internally
      layout: {
        background: { color: '#0a0e17' },   // HEX only – no oklch/lab
        textColor: '#d1d4dc',
        fontSize: 11,
        fontFamily: "'JetBrains Mono', monospace",
      },
      grid: {
        vertLines: { color: 'rgba(42,52,80,0.3)' },
        horzLines: { color: 'rgba(42,52,80,0.3)' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2962ff' },
        horzLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2962ff' },
      },
      rightPriceScale: {
        borderColor: '#2a3450',
        scaleMargins: { top: 0.1, bottom: 0.2 },
      },
      timeScale: {
        borderColor: '#2a3450',
        timeVisible: true,
        secondsVisible: false,
        barSpacing: 8,
        rightOffset: 5,
      },
      handleScale: {
        axisPressedMouseMove: true,
        mouseWheel: true,
        pinch: true,
      },
      handleScroll: {
        mouseWheel: true,
        pressedMouseMove: true,
        horzTouchDrag: true,
        vertTouchDrag: true,
      },
    });

    // FIX 2: ResizeObserver fallback (in addition to autoSize)
    const ro = new ResizeObserver(entries => {
      if (!entries.length || !chart) return;
      const { width, height } = entries[0].contentRect;
      if (width > 0 && height > 0) {
        chart.applyOptions({ width, height });
      }
    });
    ro.observe(container);

    // Store the observer for cleanup
    chart._resizeObserver = ro;

    return chart;
  }

  // ---------- DATA FETCHING ----------
  async function fetchKlines(symbol, interval, limit = MAX_BARS) {
    const url = `${BINANCE_REST}?symbol=${symbol}&interval=${interval}&limit=${limit}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    return raw.map(k => ({
      time: Math.floor(k[0] / 1000), // open time in seconds
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      volume: parseFloat(k[5]),
    }));
  }

  // ---------- WEBSOCKET ----------
  function connectWebSocket(symbol, interval) {
    if (state.ws) {
      state.ws.onclose = null;
      state.ws.close();
      state.ws = null;
    }

    const stream = `${symbol.toLowerCase()}@kline_${interval}`;
    const ws = new WebSocket(`${BINANCE_WS}/${stream}`);
    state.ws = ws;

    ws.onopen = () => {
      connDot.className = 'dot green';
      connText.textContent = 'Live · WebSocket';
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.e !== 'kline') return;
        const k = msg.k;
        const bar = {
          time: Math.floor(k.t / 1000),
          open: parseFloat(k.o),
          high: parseFloat(k.h),
          low: parseFloat(k.l),
          close: parseFloat(k.c),
          volume: parseFloat(k.v),
        };

        // Update candle series
        if (state.candleSeries) {
          state.candleSeries.update(bar);
        }

        // Update volume series
        if (state.volumeSeries) {
          state.volumeSeries.update({
            time: bar.time,
            value: bar.volume,
            color: bar.close >= bar.open ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
          });
        }

        // Update state bars (replace last or append)
        const lastIdx = state.bars.length - 1;
        if (lastIdx >= 0 && state.bars[lastIdx].time === bar.time) {
          state.bars[lastIdx] = bar;
        } else if (lastIdx < 0 || bar.time > state.bars[lastIdx].time) {
          state.bars.push(bar);
          if (state.bars.length > MAX_BARS + 50) state.bars.shift();
        }

        // Update dashboard
        updateDashboard(bar);
        lastUpdate.textContent = new Date().toLocaleTimeString();

        // Re-run SMC detection on each new bar (debounced lightly)
        scheduleSMCUpdate();

      } catch (e) {
        console.warn('WS parse error', e);
      }
    };

    ws.onerror = () => {
      connDot.className = 'dot red';
      connText.textContent = 'Connection error';
    };

    ws.onclose = () => {
      connDot.className = 'dot yellow';
      connText.textContent = 'Reconnecting…';
      // Reconnect after 3s if still on same symbol/interval
      setTimeout(() => {
        if (state.ws === ws) connectWebSocket(state.symbol, state.interval);
      }, 3000);
    };
  }

  // ---------- DASHBOARD ----------
  function updateDashboard(bar) {
    priceDisplay.textContent = `$${fmtPrice(bar.close)}`;
    const prevClose = state.bars.length > 1 ? state.bars[state.bars.length - 2].close : bar.open;
    const change = ((bar.close - prevClose) / prevClose) * 100;
    changeDisplay.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
    changeDisplay.style.color = change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
    volumeDisplay.textContent = `Vol ${fmtVolume(bar.volume)}`;
  }

  // ---------- SMC ENGINE (Pure JS) ----------
  // Detect swing highs/lows using fractal method (lookback=2)
  function detectSwings(bars, lookback = 2) {
    const swings = [];
    for (let i = lookback; i < bars.length - lookback; i++) {
      let isHigh = true, isLow = true;
      for (let j = 1; j <= lookback; j++) {
        if (bars[i].high <= bars[i - j].high || bars[i].high <= bars[i + j].high) isHigh = false;
        if (bars[i].low >= bars[i - j].low || bars[i].low >= bars[i + j].low) isLow = false;
      }
      if (isHigh) swings.push({ index: i, type: 'high', price: bars[i].high, time: bars[i].time });
      if (isLow) swings.push({ index: i, type: 'low', price: bars[i].low, time: bars[i].time });
    }
    return swings;
  }

  // Break of Structure: close beyond previous swing high/low
  function detectBOS(bars, swings) {
    const events = [];
    for (let i = 1; i < swings.length; i++) {
      const prev = swings[i - 1];
      const curr = swings[i];
      if (curr.type === 'high' && curr.price > prev.price) {
        // Look for a candle after curr that closes above curr.price
        for (let j = curr.index + 1; j < Math.min(curr.index + 10, bars.length); j++) {
          if (bars[j].close > curr.price) {
            events.push({
              type: 'BOS',
              direction: 'bullish',
              time: bars[j].time,
              price: curr.price,
              index: j,
            });
            break;
          }
        }
      }
      if (curr.type === 'low' && curr.price < prev.price) {
        for (let j = curr.index + 1; j < Math.min(curr.index + 10, bars.length); j++) {
          if (bars[j].close < curr.price) {
            events.push({
              type: 'BOS',
              direction: 'bearish',
              time: bars[j].time,
              price: curr.price,
              index: j,
            });
            break;
          }
        }
      }
    }
    return events;
  }

  // Fair Value Gap: 3-candle imbalance
  function detectFVG(bars) {
    const gaps = [];
    for (let i = 2; i < bars.length; i++) {
      const a = bars[i - 2], b = bars[i - 1], c = bars[i];
      // Bullish FVG: low of candle i > high of candle i-2
      if (c.low > a.high) {
        gaps.push({
          type: 'FVG',
          direction: 'bullish',
          top: c.low,
          bottom: a.high,
          time: a.time,
          index: i - 1,
        });
      }
      // Bearish FVG: high of candle i < low of candle i-2
      if (c.high < a.low) {
        gaps.push({
          type: 'FVG',
          direction: 'bearish',
          top: a.low,
          bottom: c.high,
          time: a.time,
          index: i - 1,
        });
      }
    }
    return gaps;
  }

  // Order Block: last opposite candle before an impulsive move
  function detectOrderBlocks(bars, swings) {
    const obs = [];
    for (let i = 1; i < swings.length; i++) {
      const swing = swings[i];
      // Bullish OB: last bearish candle before a swing high that breaks structure
      if (swing.type === 'high') {
        // Search backwards from swing for last bearish candle
        for (let j = swing.index - 1; j >= Math.max(0, swing.index - 20); j--) {
          if (bars[j].close < bars[j].open) {
            // Check if the move from this candle to swing high is significant
            const move = swing.price - bars[j].low;
            if (move > 0) {
              obs.push({
                type: 'OB',
                direction: 'bullish',
                top: Math.max(bars[j].open, bars[j].close),
                bottom: bars[j].low,
                time: bars[j].time,
                index: j,
              });
            }
            break;
          }
        }
      }
      // Bearish OB: last bullish candle before a swing low that breaks structure
      if (swing.type === 'low') {
        for (let j = swing.index - 1; j >= Math.max(0, swing.index - 20); j--) {
          if (bars[j].close > bars[j].open) {
            const move = bars[j].high - swing.price;
            if (move > 0) {
              obs.push({
                type: 'OB',
                direction: 'bearish',
                top: bars[j].high,
                bottom: Math.min(bars[j].open, bars[j].close),
                time: bars[j].time,
                index: j,
              });
            }
            break;
          }
        }
      }
    }
    return obs;
  }

  // Liquidity sweep: price wicks beyond a swing high/low but closes back inside
  function detectLiquiditySweeps(bars, swings) {
    const sweeps = [];
    for (const swing of swings) {
      for (let j = swing.index + 1; j < Math.min(swing.index + 15, bars.length); j++) {
        if (swing.type === 'high') {
          // Wick above swing high but close below it
          if (bars[j].high > swing.price && bars[j].close < swing.price) {
            sweeps.push({
              type: 'SWEEP',
              direction: 'bearish',
              time: bars[j].time,
              price: swing.price,
              index: j,
            });
          }
        }
        if (swing.type === 'low') {
          // Wick below swing low but close above it
          if (bars[j].low < swing.price && bars[j].close > swing.price) {
            sweeps.push({
              type: 'SWEEP',
              direction: 'bullish',
              time: bars[j].time,
              price: swing.price,
              index: j,
            });
          }
        }
      }
    }
    return sweeps;
  }

  // Trendline detection: linear regression on swing points
  function detectTrendlines(bars, swings) {
    // Separate highs and lows, take last 6 of each
    const highs = swings.filter(s => s.type === 'high').slice(-6);
    const lows = swings.filter(s => s.type === 'low').slice(-6);

    function fitLine(points) {
      if (points.length < 2) return null;
      const n = points.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (const p of points) {
        sumX += p.index;
        sumY += p.price;
        sumXY += p.index * p.price;
        sumX2 += p.index * p.index;
      }
      const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept, points };
    }

    return {
      resistance: fitLine(highs),
      support: fitLine(lows),
    };
  }

  // ---------- SMC RENDERING ----------
  function clearOverlays() {
    for (const item of state.overlaySeries) {
      try { state.chart.removeSeries(item.series); } catch(e) {}
    }
    state.overlaySeries = [];
    state.markers = [];
    if (state.candleSeries) {
      state.candleSeries.setMarkers([]);
    }
  }

  function addLineOverlay(points, color, lineWidth = 1, lineStyle = LightweightCharts.LineStyle.Dotted) {
    if (!state.chart || points.length === 0) return null;
    const series = state.chart.addLineSeries({
      color,
      lineWidth,
      lineStyle,
      crosshairMarkerVisible: false,
      lastValueVisible: false,
      priceLineVisible: false,
    });
    series.setData(points);
    state.overlaySeries.push({ series, type: 'line' });
    return series;
  }

  function renderSMC() {
    if (!state.chart || !state.candleSeries) return;

    // Remove old overlays
    clearOverlays();

    const bars = state.bars;
    if (bars.length < 10) return;

    // Run detection
    const swings = detectSwings(bars);
    const fvgs = detectFVG(bars);
    const obs = detectOrderBlocks(bars, swings);
    const bosEvents = detectBOS(bars, swings);
    const sweeps = detectLiquiditySweeps(bars, swings);
    const trendlines = detectTrendlines(bars, swings);

    const markers = [];

    // --- FVG overlays ---
    if (state.overlays.fvg) {
      for (const fvg of fvgs.slice(-8)) {
        const color = fvg.direction === 'bullish' ? 'rgba(38,166,154,0.15)' : 'rgba(239,83,80,0.15)';
        const borderColor = fvg.direction === 'bullish' ? 'rgba(38,166,154,0.6)' : 'rgba(239,83,80,0.6)';
        // Draw two lines: top and bottom, and a fill using area series is not trivial;
        // We'll use a line series for top and bottom, and optionally a baseline.
        // For simplicity, draw top and bottom as dotted lines.
        const topData = [{ time: fvg.time, value: fvg.top }, { time: bars[bars.length - 1].time, value: fvg.top }];
        const botData = [{ time: fvg.time, value: fvg.bottom }, { time: bars[bars.length - 1].time, value: fvg.bottom }];
        addLineOverlay(topData, borderColor, 1, LightweightCharts.LineStyle.Dotted);
        addLineOverlay(botData, borderColor, 1, LightweightCharts.LineStyle.Dotted);
      }
    }

    // --- Order Block overlays ---
    if (state.overlays.ob) {
      for (const ob of obs.slice(-6)) {
        const color = ob.direction === 'bullish' ? 'rgba(38,166,154,0.6)' : 'rgba(239,83,80,0.6)';
        const topData = [{ time: ob.time, value: ob.top }, { time: bars[bars.length - 1].time, value: ob.top }];
        const botData = [{ time: ob.time, value: ob.bottom }, { time: bars[bars.length - 1].time, value: ob.bottom }];
        addLineOverlay(topData, color, 2, LightweightCharts.LineStyle.Solid);
        addLineOverlay(botData, color, 2, LightweightCharts.LineStyle.Solid);
      }
    }

    // --- BOS markers ---
    if (state.overlays.bos) {
      for (const bos of bosEvents.slice(-5)) {
        markers.push({
          time: bos.time,
          position: bos.direction === 'bullish' ? 'belowBar' : 'aboveBar',
          color: bos.direction === 'bullish' ? '#26a69a' : '#ef5350',
          shape: bos.direction === 'bullish' ? 'arrowUp' : 'arrowDown',
          text: `BOS ${bos.direction === 'bullish' ? '↑' : '↓'}`,
        });
      }
    }

    // --- Liquidity sweep markers ---
    if (state.overlays.sweep) {
      for (const sw of sweeps.slice(-5)) {
        markers.push({
          time: sw.time,
          position: sw.direction === 'bullish' ? 'belowBar' : 'aboveBar',
          color: '#ffd700',
          shape: 'circle',
          text: 'Sweep',
        });
      }
    }

    // --- Trendlines ---
    if (state.overlays.trendline) {
      if (trendlines.resistance && trendlines.resistance.points.length >= 2) {
        const pts = trendlines.resistance.points;
        const start = pts[0].index;
        const end = bars.length - 1;
        const lineData = [
          { time: bars[start].time, value: trendlines.resistance.slope * start + trendlines.resistance.intercept },
          { time: bars[end].time, value: trendlines.resistance.slope * end + trendlines.resistance.intercept },
        ];
        addLineOverlay(lineData, '#ff9800', 2, LightweightCharts.LineStyle.Solid);
      }
      if (trendlines.support && trendlines.support.points.length >= 2) {
        const pts = trendlines.support.points;
        const start = pts[0].index;
        const end = bars.length - 1;
        const lineData = [
          { time: bars[start].time, value: trendlines.support.slope * start + trendlines.support.intercept },
          { time: bars[end].time, value: trendlines.support.slope * end + trendlines.support.intercept },
        ];
        addLineOverlay(lineData, '#4caf50', 2, LightweightCharts.LineStyle.Solid);
      }
    }

    // Apply markers
    if (state.candleSeries && markers.length) {
      // Sort markers by time (Lightweight Charts requires chronological order)
      markers.sort((a, b) => a.time - b.time);
      state.candleSeries.setMarkers(markers);
    }
  }

  // Debounced SMC update
  let smcTimer = null;
  function scheduleSMCUpdate() {
    clearTimeout(smcTimer);
    smcTimer = setTimeout(() => {
      requestAnimationFrame(renderSMC);
    }, 300);
  }

  // ---------- SYMBOL / TIMEFRAME SWITCH (FIXED) ----------
  async function switchMarket(symbol, interval) {
    // 1. Invalidate any in-flight init
    state.initId++;
    const myId = state.initId;

    // 2. Cancel pending REST fetch
    if (state.abortController) {
      state.abortController.abort();
      state.abortController = null;
    }

    // 3. Close WebSocket
    if (state.ws) {
      state.ws.onclose = null;
      state.ws.close();
      state.ws = null;
    }

    // 4. Clear chart data & overlays
    clearOverlays();
    if (state.candleSeries) {
      state.candleSeries.setData([]);   // FIX: never leave stale data
    }
    if (state.volumeSeries) {
      state.volumeSeries.setData([]);
    }
    state.bars = [];
    state.symbol = symbol;
    state.interval = interval;

    // 5. Update UI active states
    document.querySelectorAll('#symbolSelect button').forEach(b => {
      b.classList.toggle('active', b.dataset.symbol === symbol);
    });
    document.querySelectorAll('#timeframeSelect button').forEach(b => {
      b.classList.toggle('active', b.dataset.interval === interval);
    });

    // 6. Show loading
    connDot.className = 'dot yellow';
    connText.textContent = 'Loading…';

    // 7. Fetch historical data
    const ac = new AbortController();
    state.abortController = ac;

    try {
      const bars = await fetchKlines(symbol, interval, MAX_BARS);
      if (myId !== state.initId) return; // stale response

      if (!bars.length) {
        showToast('No data returned for this symbol.');
        return;
      }

      state.bars = bars;

      // 8. Ensure chart exists (create if needed)
      if (!state.chart) {
        state.chart = createChart();
        if (!state.chart) return; // will retry via rAF
      }

      // 9. Create fresh candle series (avoids setData sequencing bug)
      // Remove old series if any
      if (state.candleSeries) {
        try { state.chart.removeSeries(state.candleSeries); } catch(e) {}
      }
      if (state.volumeSeries) {
        try { state.chart.removeSeries(state.volumeSeries); } catch(e) {}
      }

      // Create candlestick series
      state.candleSeries = state.chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderUpColor: '#26a69a',
        borderDownColor: '#ef5350',
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
      });
      state.candleSeries.setData(bars);

      // Create volume series (overlay at bottom 20%)
      state.volumeSeries = state.chart.addHistogramSeries({
        color: '#26a69a',
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume',
      });
      state.volumeSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 },
      });
      state.volumeSeries.setData(bars.map(b => ({
        time: b.time,
        value: b.volume,
        color: b.close >= b.open ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
      })));

      // 10. Fit content
      state.chart.timeScale().fitContent();

      // 11. Update dashboard
      updateDashboard(bars[bars.length - 1]);

      // 12. Run SMC detection
      renderSMC();

      // 13. Connect live WebSocket
      connectWebSocket(symbol, interval);

      connDot.className = 'dot green';
      connText.textContent = 'Live · WebSocket';

    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error(err);
      showToast(`Failed to load ${symbol}: ${err.message}`);
      connDot.className = 'dot red';
      connText.textContent = 'Load error';
    }
  }

  // ---------- EVENT LISTENERS ----------
  function bindUI() {
    // Symbol buttons
    symbolSelect.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const sym = btn.dataset.symbol;
      if (sym === state.symbol) return;
      switchMarket(sym, state.interval);
    });

    // Timeframe buttons
    timeframeSelect.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const int = btn.dataset.interval;
      if (int === state.interval) return;
      switchMarket(state.symbol, int);
    });

    // Overlay toggles
    document.querySelectorAll('.toggle-switch').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const overlay = toggle.dataset.overlay;
        state.overlays[overlay] = !state.overlays[overlay];
        toggle.classList.toggle('active', state.overlays[overlay]);
        renderSMC();
      });
    });
  }

  // ---------- BOOTSTRAP ----------
  function init() {
    bindUI();

    // Initial chart creation with retry if container not sized yet
    function tryInit() {
      if (container.clientWidth === 0 || container.clientHeight === 0) {
        requestAnimationFrame(tryInit);
        return;
      }
      state.chart = createChart();
      if (!state.chart) {
        requestAnimationFrame(tryInit);
        return;
      }
      // Load default market
      switchMarket('BTCUSDT', '1m');
    }

    // Use rAF + setTimeout to allow layout to settle
    requestAnimationFrame(() => requestAnimationFrame(tryInit));
    setTimeout(tryInit, 500); // belt-and-braces fallback
  }

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ---------- CLEANUP ON UNLOAD ----------
  window.addEventListener('beforeunload', () => {
    if (state.ws) state.ws.close();
    if (state.chart) {
      if (state.chart._resizeObserver) state.chart._resizeObserver.disconnect();
      state.chart.remove();
    }
  });

})();
</script>
