  const renderStats = () => {
    const a = STATE.analysis;
    const el = $('#t-stats');
    if (!a) { el.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">Loading…</div>`; return; }
    const c = STATE.candles;
    const price = a.price;
    const returns = [];
    for (let i = 1; i < c.length; i++) returns.push((c[i].close - c[i-1].close) / c[i-1].close);
    const meanRet = returns.reduce((s,r) => s+r, 0) / returns.length;
    const variance = returns.reduce((s,r) => s + (r-meanRet)**2, 0) / returns.length;
    const vol = Math.sqrt(variance) * Math.sqrt(365*24*60/(TF_SEC[STATE.tf]/60)) * 100;
    const curRSI = a.rsi[c.length-1];
    const equity = STATE.equity;
    const risk = STATE.risk;
    const riskAmt = equity * risk / 100;
    const stopDist = a.atr * 1.5;
    const stopPct = stopDist / price;
    const positionSize = riskAmt / stopPct;
    const qty = positionSize / price;

    const fi = STATE.futuresInfo;
    const futuresBlock = fi ? `
      <div class="stat-block">
        <h4>Futures Data</h4>
        <div class="row"><span class="k">Funding rate</span><span class="v ${fi.fundingPct >= 0 ? 'up' : 'down'}">${fi.fundingPct.toFixed(4)}%</span></div>
        <div class="row"><span class="k">Next funding</span><span class="v">${fmtTime(fi.nextFundingTime/1000)}</span></div>
        <div class="row"><span class="k">Mark price</span><span class="v">${fmtPrice(fi.markPrice)}</span></div>
        <div class="row"><span class="k">Open interest</span><span class="v">${fmtVol(fi.openInterest)}</span></div>
      </div>
    ` : '';

    el.innerHTML = `
      ${futuresBlock}
      <div class="stat-block">
        <h4>Market Volatility</h4>
        <div class="row"><span class="k">ATR (14)</span><span class="v">${fmtPrice(a.atr)}</span></div>
        <div class="row"><span class="k">ATR %</span><span class="v">${(a.atr/price*100).toFixed(2)}%</span></div>
        <div class="row"><span class="k">Annualized vol</span><span class="v">${vol.toFixed(1)}%</span></div>
        <div class="row"><span class="k">Regime</span><span class="v ${a.regime.kind.includes('up') ? 'up' : a.regime.kind.includes('down') ? 'down' : ''}">${a.regime.kind}</span></div>
      </div>
      <div class="stat-block">
        <h4>Momentum</h4>
        <div class="row"><span class="k">RSI (14)</span><span class="v ${curRSI > 70 ? 'down' : curRSI < 30 ? 'up' : ''}">${curRSI?.toFixed(1) || '—'}</span></div>
        <div class="row"><span class="k">EMA 20</span><span class="v">${fmtPrice(a.ema20[c.length-1])}</span></div>
        <div class="row"><span class="k">EMA 50</span><span class="v">${fmtPrice(a.ema50[c.length-1])}</span></div>
        <div class="row"><span class="k">EMA 200</span><span class="v">${fmtPrice(a.ema200[c.length-1])}</span></div>
      </div>
      <div class="stat-block">
        <h4>Position Size Calculator</h4>
        <div class="calc-input"><label>Account equity ($)</label><input type="number" id="calc-eq" value="${equity}" step="100"></div>
        <div class="calc-input"><label>Risk per trade (%)</label><input type="number" id="calc-risk" value="${risk}" step="0.1"></div>
        <div class="row"><span class="k">Risk amount</span><span class="v">$${riskAmt.toFixed(2)}</span></div>
        <div class="row"><span class="k">Stop (1.5 ATR)</span><span class="v">${fmtPrice(price - stopDist)}</span></div>
        <div class="row"><span class="k">Stop distance</span><span class="v">${(stopPct*100).toFixed(2)}%</span></div>
        <div class="row"><span class="k">Position size</span><span class="v">$${positionSize.toFixed(0)}</span></div>
        <div class="row"><span class="k">Quantity</span><span class="v">${qty.toFixed(4)}</span></div>
      </div>
    `;
    $('#calc-eq')?.addEventListener('input', e => { STATE.equity = +e.target.value; save(); renderStats(); });
    $('#calc-risk')?.addEventListener('input', e => { STATE.risk = +e.target.value; save(); renderStats(); });
  };

  // ================================================================
  // DATA
  // ================================================================
  const renderData = () => {
    const el = $('#t-data');
    const c = STATE.candles;
    if (!c.length) { el.innerHTML = `<div style="color:var(--text-mute);text-align:center;padding:20px;">No data</div>`; return; }
    const rows = c.slice(-30).reverse().map(candle => {
      const chg = (candle.close - candle.open) / candle.open * 100;
      return `<tr>
        <td>${fmtDT(candle.time)}</td>
        <td>${fmtPrice(candle.open)}</td>
        <td>${fmtPrice(candle.high)}</td>
        <td>${fmtPrice(candle.low)}</td>
        <td>${fmtPrice(candle.close)}</td>
        <td class="${chg >= 0 ? 'up' : 'down'}">${fmtPct(chg)}</td>
        <td>${fmtVol(candle.volume)}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `
      <div class="section-h">${STATE.asset.n} · ${STATE.tf} · ${c.length} candles</div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead><tr><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg</th><th>Vol</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="section-h" style="margin-top:12px;">Data Source</div>
      <div style="font-size:11px;color:var(--text-mute);line-height:1.5;">${STATE.src}<br>Endpoint: ${STATE.asset.fut ? 'fapi.binance.com' : 'api.binance.com'}</div>
      <div style="margin-top:10px;"><button class="chat-suggest" id="export-csv">Export CSV</button></div>
    `;
    $('#export-csv')?.addEventListener('click', () => {
      const csv = 'time,open,high,low,close,volume\n' + c.map(x => [x.time,x.open,x.high,x.low,x.close,x.volume].join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${STATE.asset.s}-${STATE.tf}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('CSV exported', 'ok');
    });
  };

  // ================================================================
  // CHAT
  // ================================================================
  const chatLog = (role, text) => {
    const el = $('#chatlog');
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = text;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    STATE.log.unshift({role, text, time:Date.now()});
    save();
  };
  const parseCommand = (text) => {
    const t = text.toLowerCase().trim();
    const out = {};
    for (const [alias, sym] of Object.entries(ALIASES)) {
      if (t.includes(alias)) { out.symbol = sym; break; }
    }
    if (!out.symbol) {
      const words = t.match(/\b([a-z]{2,6})\b/g) || [];
      for (const w of words) {
        const cand = w.toUpperCase() + 'USDT';
        if (STATE.assets.find(a => a.s === cand)) { out.symbol = cand; break; }
      }
    }
    const tfM = t.match(/\b(1m|3m|5m|15m|30m|1h|2h|4h|6h|8h|12h|1d|3d|1w)\b/);
    if (tfM) out.tf = tfM[1];
    if (/\b(show|enable|turn on|display|add)\b/.test(t) || /\b(order block|ob|fvg|fair value|imbalance|sweep|pdh|pwh)\b/.test(t)) {
      out.layers = [];
      if (/order block|ob\b/.test(t)) out.layers.push('ob');
      if (/fvg|fair value|imbalance/.test(t)) out.layers.push('fvg');
      if (/sweep/.test(t)) out.layers.push('sweeps');
      if (/equal|eqh|eql/.test(t)) out.layers.push('eqhl');
      if (/support|resistance|s\/r/.test(t)) out.layers.push('sr');
      if (/trend|trendline/.test(t)) out.layers.push('trendlines');
      if (/bos|choch|structure/.test(t)) out.layers.push('bos');
      if (/liq|liquidity/.test(t)) out.layers.push('liq');
      if (/fib|fibonacci/.test(t)) out.layers.push('fib');
      if (/session|killzone/.test(t)) out.layers.push('sessions');
      if (/pdh|pdl|pwh|pwl|prev/.test(t)) out.layers.push('pdhPdl');
    }
    if (/\b(clear|reset|hide all|remove all)\b/.test(t)) out.action = 'clear';
    if (/\bscan\b/.test(t)) out.action = 'scan';
    if (/\b(analysis|setup|read|what.*setup|what.*outlook|tell me)\b/.test(t)) out.action = 'read';
    if (/\blong|buy\b/.test(t)) out.action = 'long';
    if (/\bshort|sell\b/.test(t)) out.action = 'short';
    if (/\bsnapshot|screenshot|save.*png\b/.test(t)) out.action = 'snapshot';
    const riskM = t.match(/(?:risk|size)\s*(\d+(?:\.\d+)?)\s*%/);
    if (riskM) out.risk = +riskM[1];
    return out;
  };
  const runCommand = async (text) => {
    chatLog('user', escapeHTML(text));
    const cmd = parseCommand(text);
    try {
      if (cmd.symbol) {
        const asset = STATE.assets.find(a => a.s === cmd.symbol);
        if (asset) {
          if (cmd.tf) STATE.tf = cmd.tf;
          await setAsset(asset);
          chatLog('bot', `Loaded <b>${asset.n} (${asset.s})</b> on <code>${STATE.tf}</code>.`);
        }
      } else if (cmd.tf) {
        STATE.tf = cmd.tf;
        $('#tf').value = STATE.tf;
        await loadData();
        chatLog('bot', `Timeframe set to <code>${cmd.tf}</code>.`);
      }
      if (cmd.action === 'clear') {
        Object.keys(STATE.layers).forEach(k => STATE.layers[k] = 0);
        syncLayerUI(); buildSeries(); save();
        chatLog('bot', 'All overlay layers cleared.');
        return;
      }
      if (cmd.layers && cmd.layers.length) {
        cmd.layers.forEach(l => STATE.layers[l] = 1);
        syncLayerUI(); buildSeries(); save();
        chatLog('bot', `Enabled: ${cmd.layers.map(l => l.toUpperCase()).join(', ')}.`);
      }
      if (cmd.action === 'snapshot') {
        $('#snapshot-btn').click();
        chatLog('bot', 'Screenshot saved.');
      }
      if (cmd.action === 'read' && STATE.analysis) {
        const a = STATE.analysis;
        chatLog('bot',
          `<b>${STATE.asset.n} · ${STATE.tf}</b><br>` +
          `Bias: <b>${a.bias}</b> (score ${a.score > 0 ? '+' : ''}${a.score})<br>` +
          `Structure: ${a.structure.state}<br>` +
          `Regime: ${a.regime.kind}<br>` +
          `ATR: ${fmtPrice(a.atr)} · RSI: ${a.rsi[STATE.candles.length-1]?.toFixed(1)}<br>` +
          `Support: ${a.nearestSup ? fmtPrice(a.nearestSup.price) : '—'}<br>` +
          `Resistance: ${a.nearestRes ? fmtPrice(a.nearestRes.price) : '—'}`
        );
      }
      if (cmd.action === 'scan') {
        switchTab('scan');
        chatLog('bot', `Scanning ${STATE.assets.filter(a => a.group === 'Crypto Top 50').length} crypto pairs on ${STATE.tf}…`);
      }
      if (cmd.action === 'long' || cmd.action === 'short') {
        const a = STATE.analysis;
        if (!a) { chatLog('bot', 'Load a chart first.'); return; }
        const isLong = cmd.action === 'long';
        const entry = a.price;
        const stop = isLong ? entry - a.atr*1.5 : entry + a.atr*1.5;
        const target = isLong ? entry + a.atr*3 : entry - a.atr*3;
        chatLog('bot',
          `<b>${isLong ? 'LONG' : 'SHORT'} ${STATE.asset.n}</b><br>` +
          `Entry: ${fmtPrice(entry)}<br>Stop: ${fmtPrice(stop)}<br>Target: ${fmtPrice(target)} (2R)<br>` +
          `Risk: ${cmd.risk || STATE.risk}% = $${((cmd.risk || STATE.risk) / 100 * STATE.equity).toFixed(0)}`
        );
      }
      if (!cmd.symbol && !cmd.tf && !cmd.layers && !cmd.action) {
        chatLog('bot', `Try: <code>show order blocks on gold 4h</code>, <code>scan crypto 15m</code>, <code>what's the setup on BTC 1h</code>.`);
      }
    } catch(e) {
      chatLog('bot', `Error: ${escapeHTML(e.message)}`);
    }
  };

  // ================================================================
  // WEBSOCKET
  // ================================================================
  const connectWS = () => {
    if (STATE.ws) { try { STATE.ws.close(); } catch(e) {} STATE.ws = null; }
    if (!STATE.asset) return;
    const stream = STATE.asset.s.toLowerCase() + '@kline_' + STATE.tf;
    const url = (STATE.asset.fut ? 'wss://fstream.binance.com/ws/' : 'wss://stream.binance.com:9443/ws/') + stream;
    try {
      const ws = new WebSocket(url);
      STATE.ws = ws;
      ws.onopen = () => { if (STATE.marketStatus !== 'closed') $('#dot').className = 'live'; };
      ws.onclose = () => { if (!$('#dot').classList.contains('closed')) $('#dot').className = ''; };
      ws.onerror = () => { $('#dot').className = 'err'; };
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          const k = d.k;
          if (!k) return;
          const candle = {
            time: Math.floor(k.t/1000),
            open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v
          };
          const last = STATE.candles[STATE.candles.length-1];
          if (last && candle.time === last.time) STATE.candles[STATE.candles.length-1] = candle;
          else if (!last || candle.time > last.time) {
            STATE.candles.push(candle);
            if (STATE.candles.length > 500) STATE.candles.shift();
          }
          if (STATE.series) { try { STATE.series.update(candle); } catch(err) {} }
          if (STATE.volSeries) {
            try {
              STATE.volSeries.update({
                time: candle.time, value: candle.volume,
                color: candle.close >= candle.open ? 'rgba(0,229,160,0.35)' : 'rgba(255,61,90,0.35)'
              });
            } catch(err) {}
          }
          const chg = (candle.close - candle.open) / candle.open * 100;
          updatePriceHeader(candle.close, chg);
        } catch(e) {}
      };
    } catch(e) {}
  };

  // ================================================================
  // LOAD (race-safe)
  // ================================================================
  let loadToken = 0;
  const setAsset = async (asset) => {
    STATE.asset = asset;
    $('#sym').value = asset.s;
    await loadData();
  };
  const loadData = async () => {
    if (!STATE.asset) return;
    const myToken = ++loadToken;
    // Close existing WS
    if (STATE.ws) { try { STATE.ws.close(); } catch(e) {} STATE.ws = null; }

    STATE.loading = true;
    $('#dot').className = 'loading';
    $('#skeleton').classList.add('show');
    msg(`loading ${STATE.asset.s} ${STATE.tf}…`);

    try {
      const candles = await fetchKlines(STATE.asset, STATE.tf, 500);
      if (myToken !== loadToken) return; // stale load
      STATE.candles = candles;
      STATE.analysis = analyze(candles, STATE.tf);

      // HTF analysis
      const htf = HTF_MAP[STATE.tf];
      if (htf && htf !== STATE.tf) {
        try {
          STATE.htf = await fetchKlines(STATE.asset, htf, 200);
          if (myToken !== loadToken) return;
          STATE.htfAnalysis = analyze(STATE.htf, htf);
        } catch(e) {}
      } else {
        STATE.htfAnalysis = null;
      }

      // Futures info
      if (STATE.asset.fut) {
        STATE.futuresInfo = await fetchFuturesInfo(STATE.asset);
        if (myToken !== loadToken) return;
      } else {
        STATE.futuresInfo = null;
      }

      buildSeries();
      renderRead();
      renderFlow();
      renderStats();
      renderData();
      updateHTFBadge();

      const last = candles[candles.length-1];
      const prev = candles[candles.length-2];
      const chg = prev ? (last.close - prev.close) / prev.close * 100 : 0;
      updatePriceHeader(last.close, chg);
      msg(`${STATE.asset.s} · ${STATE.tf} · ${candles.length} bars`);

      // Double rAF: ensure container settled before sizing + fitting
      requestAnimationFrame(() => {
        if (myToken !== loadToken) return;
        if (STATE._sizeAll) STATE._sizeAll();
        requestAnimationFrame(() => {
          if (myToken !== loadToken) return;
          // Set visible range: show last 150 bars + right offset
          try {
            const len = STATE.candles.length;
            const from = Math.max(0, len - 150);
            STATE.chart.timeScale().setVisibleLogicalRange({ from, to: len + 4 });
          } catch(e) {
            try { STATE.chart.timeScale().fitContent(); } catch(e) {}
          }
          drawOverlay();
        });
      });

      checkMarketStatus();
      connectWS();
      save();
    } catch(e) {
      if (myToken !== loadToken) return;
      msg('load error: ' + e.message);
      $('#dot').className = 'err';
      toast('Failed: ' + e.message, 'err');
    } finally {
      if (myToken === loadToken) {
        STATE.loading = false;
        $('#skeleton').classList.remove('show');
      }
    }
  };

  const switchTab = (name) => {
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    ['read','chat','scan','flow','stats','data'].forEach(t => {
      const el = $('#t-' + t);
      if (el) el.hidden = t !== name;
    });
    if (name === 'flow') renderFlow();
    if (name === 'stats') renderStats();
    if (name === 'data') renderData();
    if (name === 'scan') renderScan();
    if (name === 'read') renderRead();
    // Force chart resize after tab change
    setTimeout(() => { if (STATE._sizeAll) STATE._sizeAll(); }, 80);
  };

  // ================================================================
  // EVENTS
  // ================================================================
  const bindEvents = () => {
    $('#sym').addEventListener('change', async (e) => {
      const asset = STATE.assets.find(a => a.s === e.target.value);
      if (asset) await setAsset(asset);
    });
    $('#tf').addEventListener('change', async (e) => {
      STATE.tf = e.target.value;
      await loadData();
    });
    $('#ty').addEventListener('change', (e) => {
      STATE.chartType = e.target.value;
      buildSeries();
      setTimeout(() => {
        try {
          const len = STATE.candles.length;
          STATE.chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, len-150), to: len+4 });
        } catch(err) {}
        drawOverlay();
      }, 50);
      save();
    });
    $('#fs').addEventListener('click', toggleFullscreen);
    $('#fs-exit').addEventListener('click', toggleFullscreen);
    $('#layers-btn').addEventListener('click', () => $('#lp').classList.toggle('open'));
    $$('#tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    $('#go').addEventListener('click', () => {
      const q = $('#q').value.trim();
      if (q) { $('#q').value = ''; runCommand(q); }
    });
    $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
    $$('.chat-suggest').forEach(b => b.addEventListener('click', () => runCommand(b.textContent)));

    // Zoom controls
    $('#zoom-in').addEventListener('click', () => {
      const ts = STATE.chart.timeScale();
      const r = ts.getVisibleLogicalRange();
      if (!r) return;
      const mid = (r.from + r.to) / 2;
      const half = (r.to - r.from) / 4;
      ts.setVisibleLogicalRange({from: mid - half, to: mid + half});
      setTimeout(drawOverlay, 60);
    });
    $('#zoom-out').addEventListener('click', () => {
      const ts = STATE.chart.timeScale();
      const r = ts.getVisibleLogicalRange();
      if (!r) return;
      const mid = (r.from + r.to) / 2;
      const half = (r.to - r.from) * 1.5 / 2;
      ts.setVisibleLogicalRange({from: mid - half, to: mid + half});
      setTimeout(drawOverlay, 60);
    });
    $('#zoom-reset').addEventListener('click', () => {
      try {
        const len = STATE.candles.length;
        STATE.chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, len-150), to: len+4 });
      } catch(e) {}
      setTimeout(drawOverlay, 50);
    });
    $('#scroll-latest').addEventListener('click', () => {
      try { STATE.chart.timeScale().scrollToRealTime(); } catch(e) {}
      setTimeout(drawOverlay, 100);
    });
    $('#snapshot-btn').addEventListener('click', () => {
      if (!STATE.chart) return;
      try {
        const canvas = STATE.chart.takeScreenshot();
        canvas.toBlob(blob => {
          const a = document.createElement('a');
          const url = URL.createObjectURL(blob);
          a.href = url;
          a.download = `${STATE.asset.s}-${STATE.tf}-${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast('Screenshot saved', 'ok');
        });
      } catch(e) {
        toast('Screenshot failed: ' + e.message, 'err');
      }
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, select, textarea')) return;
      const tfs = {'1':'1m','2':'5m','3':'15m','4':'1h','5':'4h','6':'1d'};
      if (tfs[e.key]) {
        STATE.tf = tfs[e.key];
        $('#tf').value = STATE.tf;
        loadData();
      }
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
      if (e.key === 'l' || e.key === 'L') $('#layers-btn').click();
      if (e.key === 'r' || e.key === 'R') $('#zoom-reset').click();
      if (e.key === '+' || e.key === '=') $('#zoom-in').click();
      if (e.key === '-') $('#zoom-out').click();
      if (e.key === 's' || e.key === 'S') $('#snapshot-btn').click();
      if (e.key === 'Escape') {
        if (document.documentElement.classList.contains('fs')) {
          e.preventDefault();
          toggleFullscreen();
        } else {
          $('#lp').classList.remove('open');
        }
      }
    });

    document.addEventListener('click', (e) => {
      const lp = $('#lp'), btn = $('#layers-btn');
      if (!lp.classList.contains('open')) return;
      if (lp.contains(e.target) || btn.contains(e.target)) return;
      lp.classList.remove('open');
    });

    // Window resize / orientation
    window.addEventListener('resize', () => { if (STATE._sizeAll) STATE._sizeAll(); });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => { if (STATE._sizeAll) STATE._sizeAll(); }, 250);
    });
  };

  // ================================================================
  // INIT
  // ================================================================
  const init = async () => {
    msg('fetching symbols…');
    try { await fetchSymbols(); }
    catch(e) { toast('Symbol fetch failed', 'warn'); }

    buildTFSelect();
    buildTypeSelect();
    buildSymbolSelect();
    buildLayerChips();
    buildLayerPanel();
    initChart();

    let asset = null;
    if (STATE._savedAsset) asset = STATE.assets.find(a => a.s === STATE._savedAsset);
    if (!asset) asset = STATE.assets.find(a => a.s === 'BTCUSDT') || STATE.assets[0];
    STATE.asset = asset;
    $('#sym').value = asset.s;

    bindEvents();
    buildTicker();
    await loadData();

    chatLog('bot',
      `Welcome to <b>QCity Terminal</b>.<br>` +
      `Loaded <b>${asset.n} (${asset.s})</b> on <code>${STATE.tf}</code>.<br><br>` +
      `Try: <code>show order blocks on gold 4h</code>, <code>scan crypto 15m</code>, <code>what's the setup on BTC</code>.`
    );

    setInterval(checkMarketStatus, 30000);
    msg('ready');
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
