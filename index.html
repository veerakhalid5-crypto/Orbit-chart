<script>
"use strict";
(() => {
  // ================================================================
  // CONSTANTS
  // ================================================================
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const TFS = ['1m','3m','5m','15m','30m','1h','2h','4h','6h','8h','12h','1d','3d','1w','1M'];
  const TF_SEC = {'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,
    '6h':21600,'8h':28800,'12h':43200,'1d':86400,'3d':259200,'1w':604800,'1M':2592000};
  const HTF_MAP = {'1m':'15m','3m':'1h','5m':'1h','15m':'4h','30m':'4h','1h':'1d','2h':'1d',
    '4h':'1d','6h':'3d','8h':'3d','12h':'1w','1d':'1w','3d':'1w','1w':'1M','1M':'1M'};
  const CHART_TYPES = [
    {key:'candle',label:'Candles'},{key:'bars',label:'OHLC Bars'},{key:'line',label:'Line'},
    {key:'area',label:'Area'},{key:'baseline',label:'Baseline'},{key:'ha',label:'Heikin Ashi'},
    {key:'renko',label:'Renko'}
  ];
  const SPOT_HOSTS = ['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com'];
  const FUT_HOSTS  = ['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com'];
  const COMMODITIES = [['XAUUSDT','Gold'],['XAGUSDT','Silver'],['CLUSDT','WTI Crude'],['BZUSDT','Brent'],['NATGASUSDT','Nat Gas']];
  const TOKENIZED = [['PAXGUSDT','PAXG'],['XAUTUSDT','XAUT']];
  const FALLBACK_TOP = ['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','AVAX','TRX','LINK','TON','DOT','MATIC','SHIB','LTC','BCH','UNI','ATOM','XLM','ETC','FIL','HBAR','ICP','ARB','OP','APT','SUI','INJ','SEI','TIA','RUNE','NEAR','AAVE','GRT','IMX','LDO','STX','RNDR','FET','WLD','PEPE','WIF','BONK','JUP','PYTH','ONDO','ENA','W','STRK','BLUR'];
  const STABLES = new Set(['usdt','usdc','fdusd','dai','tusd','usde','usds','usdd','pyusd','susde','usd0','steth','wsteth','weth','wbtc','weeth','wbeth','cbbtc','bsc-usd','leo']);
  const ALIASES = {
    gold:'XAUUSDT',silver:'XAGUSDT',oil:'CLUSDT',wti:'CLUSDT',brent:'BZUSDT',gas:'NATGASUSDT',natgas:'NATGASUSDT',
    btc:'BTCUSDT',bitcoin:'BTCUSDT',eth:'ETHUSDT',ethereum:'ETHUSDT',sol:'SOLUSDT',solana:'SOLUSDT',
    xrp:'XRPUSDT',bnb:'BNBUSDT',doge:'DOGEUSDT',ada:'ADAUSDT',avax:'AVAXUSDT',link:'LINKUSDT'
  };

  const STATE = {
    asset:null, assets:[], tf:'15m', chartType:'candle',
    candles:[], htf:[], analysis:null, htfAnalysis:null, futuresInfo:null,
    chart:null, series:null, volSeries:null, indSeries:{}, overlay:null, overlayCtx:null,
    _sizeAll:null, _ro:null,
    ws:null, log:[], equity:10000, risk:1, src:'',
    layers:{
      // Structure
      swings:1, swingLabels:1, bos:1, sr:1, trendlines:0,
      // Institutional
      ob:1, fvg:1, sweeps:1, eqhl:1, idm:1, breakers:1,
      // Levels
      pdhPdl:1, sessionHL:1,
      // Context
      liq:0, pd:0, sessions:0, fib:0, wyckoff:0,
      // Indicators
      ema:0, vwap:0, bb:0, supertrend:0, vprofile:0, volPanel:1, volSpikes:1,
      // Patterns
      patterns:0
    },
    loading:false, lastUpdate:0, price:null, change:null,
    marketStatus:'unknown', staleCandles:false
  };

  try {
    const s = JSON.parse(localStorage.getItem('qcity_v5') || '{}');
    if (s.tf) STATE.tf = s.tf;
    if (s.chartType) STATE.chartType = s.chartType;
    if (s.layers) Object.assign(STATE.layers, s.layers);
    if (s.equity) STATE.equity = s.equity;
    if (s.risk) STATE.risk = s.risk;
    if (s.asset) STATE._savedAsset = s.asset;
    STATE.log = JSON.parse(localStorage.getItem('qcity_log') || '[]');
  } catch(e) {}

  const save = () => {
    try {
      localStorage.setItem('qcity_v5', JSON.stringify({
        tf:STATE.tf, chartType:STATE.chartType, layers:STATE.layers,
        equity:STATE.equity, risk:STATE.risk, asset:STATE.asset?STATE.asset.s:null
      }));
      localStorage.setItem('qcity_log', JSON.stringify(STATE.log.slice(0,40)));
    } catch(e) {}
  };

  // ================================================================
  // UTILS
  // ================================================================
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const fmtPrice = n => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n);
    if (a >= 10000) return n.toLocaleString('en-US',{maximumFractionDigits:0});
    if (a >= 100) return n.toFixed(2);
    if (a >= 1) return n.toFixed(3);
    if (a >= 0.01) return n.toFixed(4);
    return n.toPrecision(4);
  };
  const fmtVol = n => {
    if (!isFinite(n)) return '—';
    if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
    if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return n.toFixed(0);
  };
  const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const fmtTime = t => new Date(t*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  const fmtDT = t => new Date(t*1000).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const toast = (msg, kind='') => {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 2600);
  };
  const msg = t => { $('#msg').textContent = t; };

  // ================================================================
  // DATA
  // ================================================================
  const withTimeout = (url, ms = 7000) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, {signal:ctrl.signal}).finally(() => clearTimeout(t));
  };

  const jsonGet = async (hosts, path) => {
    let lastErr = null;
    for (const h of hosts) {
      try {
        const r = await withTimeout(h + path);
        if (r.ok) return await r.json();
        lastErr = new Error('HTTP ' + r.status);
      } catch(e) { lastErr = e; }
    }
    throw lastErr || new Error('All hosts failed');
  };

  const fetchKlines = async (asset, tf, limit = 500) => {
    const hosts = asset.fut ? FUT_HOSTS : SPOT_HOSTS;
    const path = (asset.fut ? '/fapi/v1/klines?' : '/api/v3/klines?') + `symbol=${asset.s}&interval=${tf}&limit=${limit}`;
    const raw = await jsonGet(hosts, path);
    if (!Array.isArray(raw) || !raw.length) throw new Error('No data for ' + asset.s);
    return raw.map(k => ({
      time: Math.floor(k[0]/1000),
      open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5]
    }));
  };

  const fetchTicker = async (asset) => {
    const hosts = asset.fut ? FUT_HOSTS : SPOT_HOSTS;
    const path = (asset.fut ? '/fapi/v1/ticker/24hr?' : '/api/v3/ticker/24hr?') + `symbol=${asset.s}`;
    try { return await jsonGet(hosts, path); } catch(e) { return null; }
  };

  const fetchFuturesInfo = async (asset) => {
    if (!asset.fut) return null;
    try {
      const [premium, oi] = await Promise.all([
        jsonGet(FUT_HOSTS, `/fapi/v1/premiumIndex?symbol=${asset.s}`),
        jsonGet(FUT_HOSTS, `/fapi/v1/openInterest?symbol=${asset.s}`)
      ]);
      return {
        fundingPct: parseFloat(premium.lastFundingRate) * 100,
        markPrice: parseFloat(premium.markPrice),
        nextFundingTime: premium.nextFundingTime,
        openInterest: parseFloat(oi.openInterest)
      };
    } catch(e) { return null; }
  };

  const fetchSymbols = async () => {
    const assets = [];
    COMMODITIES.forEach(([s,n]) => assets.push({
      s, n, fut:true, group:'Commodities',
      info:'Binance TradFi perpetual — tracks underlying commodity. Pauses on weekends.'
    }));
    TOKENIZED.forEach(([s,n]) => assets.push({
      s, n, fut:false, group:'Tokenized Gold',
      info:'Gold-backed token on Binance spot — 24/7, tracks spot gold loosely.'
    }));
    let top = null;
    try {
      const [coins, prices] = await Promise.all([
        withTimeout('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100').then(r => r.json()),
        jsonGet(SPOT_HOSTS, '/api/v3/ticker/price')
      ]);
      const avail = new Set(prices.map(p => p.symbol));
      const seen = new Set();
      top = [];
      for (const c of coins) {
        const sym = c.symbol.toUpperCase();
        if (STABLES.has(c.symbol) || seen.has(sym) || !avail.has(sym+'USDT')) continue;
        seen.add(sym); top.push(sym);
        if (top.length === 50) break;
      }
    } catch(e) {}
    const useTop = top && top.length >= 20;
    STATE.src = useTop ? 'Market-cap ranking (CoinGecko) × Binance pairs' : 'Fallback universe';
    (useTop ? top : FALLBACK_TOP).forEach(sym => assets.push({
      s:sym+'USDT', n:sym, fut:false, group:'Crypto Top 50', info:'Binance spot pair — 24/7'
    }));
    STATE.assets = assets;
  };

  // ================================================================
  // INDICATORS
  // ================================================================
  const computeATR = (candles, period = 14) => {
    if (candles.length < 2) return 0;
    const trs = [];
    for (let i = 1; i < candles.length; i++) {
      const c = candles[i], p = candles[i-1];
      trs.push(Math.max(c.high-c.low, Math.abs(c.high-p.close), Math.abs(c.low-p.close)));
    }
    const n = Math.min(period, trs.length);
    return trs.slice(-n).reduce((a,b) => a+b, 0) / n;
  };
  const computeEMA = (vals, period) => {
    if (!vals.length) return [];
    const k = 2/(period+1);
    const out = [vals[0]];
    for (let i = 1; i < vals.length; i++) out.push(vals[i]*k + out[i-1]*(1-k));
    return out;
  };
  const computeRSI = (candles, period = 14) => {
    const out = new Array(candles.length).fill(null);
    if (candles.length < period + 1) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= period; i++) {
      const d = candles[i].close - candles[i-1].close;
      if (d >= 0) g += d; else l -= d;
    }
    let ag = g/period, al = l/period;
    out[period] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
    for (let i = period+1; i < candles.length; i++) {
      const d = candles[i].close - candles[i-1].close;
      ag = (ag*(period-1) + Math.max(d,0)) / period;
      al = (al*(period-1) + Math.max(-d,0)) / period;
      out[i] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
    }
    return out;
  };
  const computeBollinger = (candles, period = 20, mult = 2) => {
    const u = [], m = [], l = [];
    for (let i = 0; i < candles.length; i++) {
      if (i < period-1) { u.push(null); m.push(null); l.push(null); continue; }
      const s = candles.slice(i-period+1, i+1).map(c => c.close);
      const mean = s.reduce((a,b) => a+b, 0) / period;
      const sd = Math.sqrt(s.reduce((a,b) => a + (b-mean)**2, 0) / period);
      m.push(mean); u.push(mean + mult*sd); l.push(mean - mult*sd);
    }
    return {upper:u, middle:m, lower:l};
  };
  const computeVWAP = (candles) => {
    const out = [];
    let pv = 0, v = 0, day = null;
    for (const c of candles) {
      const d = Math.floor(c.time/86400);
      if (d !== day) { pv = 0; v = 0; day = d; }
      const tp = (c.high + c.low + c.close) / 3;
      pv += tp*c.volume; v += c.volume;
      out.push(v ? pv/v : c.close);
    }
    return out;
  };
  const computeSupertrend = (candles, period = 10, mult = 3) => {
    if (candles.length < period+2) return {line:[], dir:[]};
    const atr = [];
    let prev = 0;
    for (let i = 0; i < candles.length; i++) {
      const tr = i === 0 ? candles[0].high - candles[0].low
        : Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close));
      if (i < period) atr.push(tr);
      else if (i === period) { prev = atr.reduce((a,b) => a+b, 0)/period; atr.push(prev); }
      else { prev = (prev*(period-1) + tr)/period; atr.push(prev); }
    }
    const line = new Array(candles.length).fill(null);
    const dir = new Array(candles.length).fill(0);
    let pub = null, plb = null, trend = 1;
    for (let i = period; i < candles.length; i++) {
      const hl2 = (candles[i].high + candles[i].low)/2;
      let ub = hl2 + mult*atr[i], lb = hl2 - mult*atr[i];
      if (pub !== null && ub > pub && candles[i-1].close <= pub) ub = pub;
      if (plb !== null && lb < plb && candles[i-1].close >= plb) lb = plb;
      if (candles[i].close > (pub ?? ub)) trend = 1;
      else if (candles[i].close < (plb ?? lb)) trend = -1;
      line[i] = trend === 1 ? lb : ub;
      dir[i] = trend;
      pub = ub; plb = lb;
    }
    return {line, dir};
  };

  // ================================================================
  // SWINGS
  // ================================================================
  const detectSwings = (candles, k = 3) => {
    const sh = [], sl = [];
    for (let i = k; i < candles.length - k; i++) {
      let isH = true, isL = true;
      for (let j = i-k; j <= i+k; j++) {
        if (j === i) continue;
        if (candles[j].high >= candles[i].high) isH = false;
        if (candles[j].low  <= candles[i].low)  isL = false;
      }
      if (isH) sh.push({p:i, price:candles[i].high, time:candles[i].time});
      if (isL) sl.push({p:i, price:candles[i].low,  time:candles[i].time});
    }
    return {sh, sl};
  };
  const dedupeSwings = (swings, ascending) => {
    const out = [];
    for (const s of swings) {
      const last = out[out.length-1];
      if (last && s.p - last.p < 4) {
        if (ascending ? s.price < last.price : s.price > last.price) out[out.length-1] = s;
      } else out.push(s);
    }
    return out;
  };
  const significantSwings = (swings, atr, n, count = 8) => {
    const out = [];
    for (const s of swings) {
      const last = out[out.length-1];
      if (!last || (s.p - last.p >= 6 && Math.abs(s.price - last.price) >= atr*0.35)) {
        out.push(s);
      } else if (last && Math.abs(s.price - last.price) > Math.abs(last.price - (out[out.length-2]?.price || 0))) {
        out[out.length-1] = s;
      }
    }
    return out.filter(s => n-1-s.p <= 200).slice(-count);
  };

  // ================================================================
  // STRUCTURE
  // ================================================================
  const detectStructure = (candles, swings) => {
    const events = [];
    let trend = 0;
    let lastH = null, lastL = null;
    const shIdx = new Map(swings.sh.map(s => [s.p, s]));
    const slIdx = new Map(swings.sl.map(s => [s.p, s]));
    for (let i = 0; i < candles.length; i++) {
      if (shIdx.has(i)) {
        const s = shIdx.get(i);
        if (lastH && candles[i].close > lastH.price) {
          events.push({i, time:candles[i].time, kind: trend >= 0 ? 'BOS' : 'CHoCH',
            dir: 1, level:lastH.price, fromTime:lastH.time});
          trend = 1;
        }
        lastH = s;
      }
      if (slIdx.has(i)) {
        const s = slIdx.get(i);
        if (lastL && candles[i].close < lastL.price) {
          events.push({i, time:candles[i].time, kind: trend <= 0 ? 'BOS' : 'CHoCH',
            dir: -1, level:lastL.price, fromTime:lastL.time});
          trend = -1;
        }
        lastL = s;
      }
    }
    const last = events[events.length-1];
    let state = 'ranging';
    if (last) state = last.dir > 0 ? 'bullish' : 'bearish';
    const recentChoch = events.slice(-3).find(e => e.kind === 'CHoCH');
    if (recentChoch) state = recentChoch.dir > 0 ? 'bullish-reversal' : 'bearish-reversal';
    return {events, state, trend, lastEvent:last};
  };

  // ================================================================
  // ORDER BLOCKS
  // ================================================================
  const detectOrderBlocks = (candles, structureEvents, atr) => {
    const obs = [];
    const n = candles.length;
    structureEvents.slice(-8).forEach(ev => {
      for (let j = ev.i-1; j >= Math.max(0, ev.i-30); j--) {
        const x = candles[j];
        const isOpposite = ev.dir > 0 ? x.close < x.open : x.close > x.open;
        if (!isOpposite) continue;
        let mitigatedIdx = -1;
        for (let m = ev.i+1; m < n; m++) {
          if (ev.dir > 0 ? candles[m].close < x.low : candles[m].close > x.high) {
            mitigatedIdx = m; break;
          }
        }
        if (mitigatedIdx >= 0) break;
        let tests = 0;
        for (let m = ev.i+1; m < n; m++) {
          if (candles[m].low <= x.high && candles[m].high >= x.low) tests++;
        }
        const size = x.high - x.low;
        const volumeRatio = x.volume / (candles.slice(-50).reduce((a,c) => a+c.volume, 0)/50 || 1);
        const freshness = clamp(100 - (n-1-ev.i)*2, 20, 100);
        const quality = Math.round(clamp(
          30 + 20*Math.min(1.5, size/atr) + 15/(tests+1) + 15*Math.min(2, volumeRatio) + freshness*0.2, 30, 99));
        obs.push({
          dir: ev.dir, lo: x.low, hi: x.high, time: x.time, index: j,
          quality, tests, size, evTime: ev.time, volumeRatio, freshness,
          bias: ev.dir > 0 ? 'bullish' : 'bearish'
        });
        break;
      }
    });
    return obs.slice(-5);
  };

  const detectBreakers = (candles, structureEvents, atr) => {
    const breakers = [];
    const n = candles.length;
    structureEvents.slice(-10).forEach(ev => {
      for (let j = ev.i-1; j >= Math.max(0, ev.i-30); j--) {
        const x = candles[j];
        const isOpposite = ev.dir > 0 ? x.close < x.open : x.close > x.open;
        if (!isOpposite) continue;
        let breachIdx = -1;
        for (let m = ev.i+1; m < n; m++) {
          if (ev.dir > 0 ? candles[m].close < x.low : candles[m].close > x.high) {
            breachIdx = m; break;
          }
        }
        if (breachIdx < 0) break;
        let retested = false;
        for (let m = breachIdx+2; m < n; m++) {
          if (ev.dir > 0) {
            if (candles[m].high >= x.low - atr*0.3 && candles[m].high <= x.high + atr*0.3 && candles[m].close < x.low) {
              retested = true; break;
            }
          } else {
            if (candles[m].low <= x.high + atr*0.3 && candles[m].low >= x.low - atr*0.3 && candles[m].close > x.high) {
              retested = true; break;
            }
          }
        }
        if (retested) breakers.push({dir: ev.dir, lo: x.low, hi: x.high, time: x.time, breachTime: candles[breachIdx].time});
        break;
      }
    });
    return breakers.slice(-3);
  };

  const detectFVG = (candles, atr) => {
    const out = [];
    const n = candles.length;
    for (let i = 2; i < n; i++) {
      const a = candles[i-2], b = candles[i];
      let z = null;
      if (a.high < b.low) z = {dir:1, lo:a.high, hi:b.low, time:candles[i-1].time, idx:i-1};
      else if (a.low > b.high) z = {dir:-1, lo:b.high, hi:a.low, time:candles[i-1].time, idx:i-1};
      if (!z) continue;
      const size = z.hi - z.lo;
      if (size < atr*0.3) continue;
      let mitigated = false;
      for (let j = i+1; j < n; j++) {
        if (z.dir > 0 ? candles[j].low <= z.lo : candles[j].high >= z.hi) { mitigated = true; break; }
      }
      if (!mitigated) out.push({...z, size});
    }
    return out.slice(-4);
  };

  const detectSweeps = (candles, swings, atr) => {
    const sweeps = [];
    const n = candles.length;
    swings.sh.slice(-12).forEach(s => {
      for (let i = s.p+1; i < n; i++) {
        const c = candles[i];
        if (c.high > s.price + atr*0.15 && c.close < s.price && c.close < c.open) {
          sweeps.push({dir:-1, swingType:'high', price:s.price, wick:c.high, time:c.time, swingTime:s.time, swingP:s.p});
          break;
        }
      }
    });
    swings.sl.slice(-12).forEach(s => {
      for (let i = s.p+1; i < n; i++) {
        const c = candles[i];
        if (c.low < s.price - atr*0.15 && c.close > s.price && c.close > c.open) {
          sweeps.push({dir:1, swingType:'low', price:s.price, wick:c.low, time:c.time, swingTime:s.time, swingP:s.p});
          break;
        }
      }
    });
    return sweeps.sort((a,b) => b.time - a.time).slice(0, 4);
  };

  const detectEqualLevels = (candles, swings, atr) => {
    const eqh = [], eql = [];
    const hi = swings.sh.slice(-10);
    const lo = swings.sl.slice(-10);
    for (let i = 0; i < hi.length-1; i++) {
      for (let j = i+1; j < hi.length; j++) {
        if (Math.abs(hi[i].price - hi[j].price) < atr*0.15 && hi[j].p - hi[i].p >= 3) {
          const maxP = Math.max(hi[i].price, hi[j].price);
          const swept = candles.slice(hi[j].p+1).some(c => c.high > maxP + atr*0.15);
          eqh.push({price:(hi[i].price+hi[j].price)/2, time1:hi[i].time, time2:hi[j].time, p1:hi[i].p, p2:hi[j].p, swept});
        }
      }
    }
    for (let i = 0; i < lo.length-1; i++) {
      for (let j = i+1; j < lo.length; j++) {
        if (Math.abs(lo[i].price - lo[j].price) < atr*0.15 && lo[j].p - lo[i].p >= 3) {
          const minP = Math.min(lo[i].price, lo[j].price);
          const swept = candles.slice(lo[j].p+1).some(c => c.low < minP - atr*0.15);
          eql.push({price:(lo[i].price+lo[j].price)/2, time1:lo[i].time, time2:lo[j].time, p1:lo[i].p, p2:lo[j].p, swept});
        }
      }
    }
    return {eqh:eqh.filter(e => !e.swept).slice(-3), eql:eql.filter(e => !e.swept).slice(-3)};
  };

  const detectInducement = (candles, swings, structure, atr) => {
    const idms = [];
    structure.slice(-3).forEach(ev => {
      const start = Math.max(0, ev.i-20);
      for (let i = start; i < ev.i-3; i++) {
        const c = candles[i];
        const priorHighs = swings.sh.filter(s => s.p < i && s.p > i-15);
        for (const ph of priorHighs) {
          if (c.high > ph.price + atr*0.2 && c.close < ph.price && ev.dir > 0) {
            idms.push({dir:1, price:ph.price, time:c.time, kind:'IDM+'});
            break;
          }
        }
        const priorLows = swings.sl.filter(s => s.p < i && s.p > i-15);
        for (const pl of priorLows) {
          if (c.low < pl.price - atr*0.2 && c.close > pl.price && ev.dir < 0) {
            idms.push({dir:-1, price:pl.price, time:c.time, kind:'IDM-'});
            break;
          }
        }
      }
    });
    return idms.slice(-3);
  };

  // ================================================================
  // PREVIOUS DAY / WEEK LEVELS (NEW)
  // ================================================================
  const detectPrevDayWeek = (candles) => {
    const out = {};
    if (candles.length < 30) return out;
    // Previous Day High/Low
    const days = {};
    candles.forEach(c => {
      const d = Math.floor(c.time / 86400);
      if (!days[d]) days[d] = { hi: -Infinity, lo: Infinity };
      days[d].hi = Math.max(days[d].hi, c.high);
      days[d].lo = Math.min(days[d].lo, c.low);
    });
    const today = Math.floor(candles[candles.length-1].time / 86400);
    const prevDayKeys = Object.keys(days).map(Number).filter(d => d < today).sort((a,b) => b-a);
    if (prevDayKeys.length > 0) {
      out.pdh = days[prevDayKeys[0]].hi;
      out.pdl = days[prevDayKeys[0]].lo;
    }
    // Previous Week High/Low (ISO-week aligned)
    const weeks = {};
    candles.forEach(c => {
      const w = Math.floor((c.time + 4*86400) / (7*86400));
      if (!weeks[w]) weeks[w] = { hi: -Infinity, lo: Infinity };
      weeks[w].hi = Math.max(weeks[w].hi, c.high);
      weeks[w].lo = Math.min(weeks[w].lo, c.low);
    });
    const curWeek = Math.floor((candles[candles.length-1].time + 4*86400) / (7*86400));
    const prevWeekKeys = Object.keys(weeks).map(Number).filter(w => w < curWeek).sort((a,b) => b-a);
    if (prevWeekKeys.length > 0) {
      out.pwh = weeks[prevWeekKeys[0]].hi;
      out.pwl = weeks[prevWeekKeys[0]].lo;
    }
    return out;
  };

  // ================================================================
  // SESSION HIGHS/LOWS (NEW)
  // ================================================================
  const getNYTime = (t) => {
    const d = new Date(t*1000);
    const parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
    const h = +(parts.find(p => p.type==='hour')?.value || 0) % 24;
    const m = +(parts.find(p => p.type==='minute')?.value || 0);
    return {h, m};
  };

  const detectSessionHL = (candles) => {
    const sessions = [];
    let cur = null;
    candles.forEach((c, i) => {
      const { h, m } = getNYTime(c.time);
      const hour = h + m/60;
      let name = null;
      if (hour >= 20 || hour < 2) name = 'Asia';
      else if (hour >= 2 && hour < 8) name = 'London';
      else if (hour >= 8 && hour < 17) name = 'NY';
      if (!cur || cur.name !== name) {
        if (cur && cur.hi !== -Infinity) sessions.push(cur);
        cur = name ? { name, hi: -Infinity, lo: Infinity, start: i, startTime: c.time, end: i, endTime: c.time } : null;
      }
      if (cur) {
        cur.hi = Math.max(cur.hi, c.high);
        cur.lo = Math.min(cur.lo, c.low);
        cur.end = i; cur.endTime = c.time;
      }
    });
    if (cur && cur.hi !== -Infinity) sessions.push(cur);
    const lastByType = {};
    sessions.forEach(s => { lastByType[s.name] = s; });
    return Object.values(lastByType);
  };

  const detectSessions = (candles) => {
    const sessions = [];
    let cur = null;
    candles.forEach((c, i) => {
      const {h, m} = getNYTime(c.time);
      const hour = h + m/60;
      let name = null, color = null;
      if (hour >= 20 && hour < 24) { name='Asia'; color='rgba(184,141,255,.06)'; }
      else if (hour >= 2 && hour < 5) { name='London KZ'; color='rgba(91,154,255,.09)'; }
      else if (hour >= 8.5 && hour < 11) { name='NY KZ'; color='rgba(0,229,160,.09)'; }
      if (name !== cur?.name) {
        if (cur) sessions.push({...cur, end:i-1, endTime:candles[i-1].time});
        cur = name ? {name, color, start:i, startTime:c.time} : null;
      }
      if (i === candles.length-1 && cur) sessions.push({...cur, end:i, endTime:c.time});
    });
    return sessions;
  };

  // ================================================================
  // S/R
  // ================================================================
  const detectSR = (candles, swings, atr) => {
    const all = [...swings.sh.map(s => ({...s, kind:'res'})), ...swings.sl.map(s => ({...s, kind:'sup'}))]
      .sort((a,b) => b.price - a.price);
    const clusters = [];
    const tol = atr*0.4;
    all.forEach(s => {
      const g = clusters.find(c => Math.abs(c.price - s.price) < tol);
      if (g) { g.sum += s.price; g.count++; g.price = g.sum/g.count; g.lastP = Math.max(g.lastP, s.p); }
      else clusters.push({price:s.price, sum:s.price, count:1, lastP:s.p});
    });
    const cur = candles[candles.length-1].close;
    return clusters.filter(c => c.count >= 2)
      .map(c => ({price:c.price, count:c.count, kind: c.price > cur ? 'resistance' : 'support',
        strength: clamp(30 + c.count*20, 30, 100)}))
      .sort((a,b) => b.strength - a.strength).slice(0, 6);
  };

  // ================================================================
  // TRENDLINES / LIQUIDITY / FIB / PD
  // ================================================================
  const detectTrendlines = (candles, swings, atr) => {
    const out = [];
    const tryLines = (pts, isSup) => {
      if (pts.length < 2) return;
      const slice = pts.slice(-8);
      let best = null;
      for (let i = 0; i < slice.length-1; i++) {
        for (let j = i+1; j < slice.length; j++) {
          const a = slice[i], b = slice[j];
          if (b.p - a.p < 10) continue;
          const slope = (b.price - a.price) / (b.p - a.p);
          if (Math.abs(slope) > 0.6*atr) continue;
          let touches = 0, violated = false;
          for (let k = a.p; k < candles.length; k++) {
            const lineY = a.price + slope*(k-a.p);
            const dist = isSup ? candles[k].close - lineY : lineY - candles[k].close;
            if (dist < -atr*0.3) { violated = true; break; }
            if (Math.abs(dist) < atr*0.3) touches++;
          }
          if (violated || touches < 3) continue;
          const score = touches*10 + (b.p - a.p);
          if (!best || score > best.score) {
            best = { a:{t:candles[a.p].time, v:a.price, p:a.p}, b:{t:candles[b.p].time, v:b.price, p:b.p},
              slope, touches, isSup, now: a.price + slope*(candles.length-1-a.p), score };
          }
        }
      }
      if (best) out.push(best);
    };
    tryLines(swings.sl, true);
    tryLines(swings.sh, false);
    return out;
  };

  const detectLiquidity = (candles, swings, atr) => {
    const pools = [];
    const push = (s, kind) => {
      const swept = candles.slice(s.p+1).some(c =>
        kind === 'high' ? c.high > s.price + atr*0.1 : c.low < s.price - atr*0.1);
      if (!swept) pools.push({price:s.price, kind, time:s.time, count:1});
    };
    swings.sh.slice(-8).forEach(s => push(s, 'high'));
    swings.sl.slice(-8).forEach(s => push(s, 'low'));
    const merged = [];
    pools.forEach(p => {
      const m = merged.find(x => Math.abs(x.price - p.price) < atr*0.3);
      if (m) { m.count++; m.price = (m.price*(m.count-1) + p.price)/m.count; }
      else merged.push(p);
    });
    return merged.sort((a,b) => b.count - a.count).slice(0, 5);
  };

  const detectFib = (candles, swings, atr) => {
    const lastH = swings.sh[swings.sh.length-1];
    const lastL = swings.sl[swings.sl.length-1];
    if (!lastH || !lastL) return null;
    if (Math.abs(lastH.price - lastL.price) < atr*2) return null;
    const down = lastL.p > lastH.p;
    const high = lastH.price, low = lastL.price, rng = high - low;
    const ret = r => down ? low + rng*r : high - rng*r;
    const ext = r => down ? low - rng*(r-1) : high + rng*(r-1);
    return {
      t0: candles[Math.min(lastH.p, lastL.p)].time,
      t1: candles[Math.max(lastH.p, lastL.p)].time,
      down, high, low,
      levels: [0.382, 0.5, 0.618, 0.705, 0.786].map(r => ({r, p:ret(r)})),
      golden: [ret(0.618), ret(0.65)],
      extensions: [1.272, 1.618, 2.0].map(r => ({r, p:ext(r)}))
    };
  };

  const detectPD = (candles, swings) => {
    const lastH = swings.sh[swings.sh.length-1];
    const lastL = swings.sl[swings.sl.length-1];
    if (!lastH || !lastL) return null;
    const high = Math.max(lastH.price, lastL.price);
    const low = Math.min(lastH.price, lastL.price);
    const mid = (high+low)/2;
    const cur = candles[candles.length-1].close;
    const pos = (cur-low)/(high-low);
    return { high, low, mid, cur, pos, zone: pos > 0.5 ? 'premium' : 'discount', eq: mid };
  };

  const computeVolumeProfile = (candles, bins = 40) => {
    const win = candles.slice(-200);
    if (!win.length) return null;
    let vlo = Infinity, vhi = -Infinity;
    win.forEach(c => { vlo = Math.min(vlo, c.low); vhi = Math.max(vhi, c.high); });
    const step = (vhi-vlo)/bins || 1;
    const profile = new Array(bins).fill(0);
    win.forEach(c => {
      const b = Math.min(bins-1, Math.floor(((c.high+c.low)/2-vlo)/step));
      profile[b] += c.volume;
    });
    const max = Math.max(...profile);
    const total = profile.reduce((a,b) => a+b, 0);
    let poc = profile.indexOf(max);
    let va = profile[poc], lo = poc, hi = poc;
    while (va < total*0.7 && (lo > 0 || hi < bins-1)) {
      const dv = lo > 0 ? profile[lo-1] : -1;
      const uv = hi < bins-1 ? profile[hi+1] : -1;
      if (uv >= dv) { hi++; va += uv; } else { lo--; va += dv; }
    }
    return { vlo, vhi, step, profile, max, poc: vlo + (poc+0.5)*step, vah: vlo + (hi+1)*step, val: vlo + lo*step };
  };

  const detectPatterns = (candles, swings, atr) => {
    const out = [];
    const {sh, sl} = swings;
    const cur = candles[candles.length-1].close;
    const n = candles.length;
    if (sh.length >= 3) {
      const [l, h, r] = sh.slice(-3);
      if (r.p > h.p && h.p > l.p && (n-1-r.p) < 150 && (h.p-l.p) > 4 && (r.p-h.p) > 4) {
        const neckline = Math.min(l.price, r.price);
        const headHeight = h.price - neckline;
        if (headHeight > atr*1.2 && Math.abs(l.price-r.price) < headHeight*0.8) {
          const broken = cur < neckline - atr*0.2;
          out.push({ name:'Head & Shoulders', dir:-1, status: broken ? 'confirmed' : 'forming',
            conf: clamp(60 + (broken?15:0) + (1-Math.abs(l.price-r.price)/headHeight)*20, 40, 95),
            points: [l,h,r].map(s => ({t:s.time, v:s.price})),
            target: neckline - headHeight, invalid: h.price });
        }
      }
    }
    if (sl.length >= 3) {
      const [l, h, r] = sl.slice(-3);
      if (r.p > h.p && h.p > l.p && (n-1-r.p) < 150 && (h.p-l.p) > 4 && (r.p-h.p) > 4) {
        const neckline = Math.max(l.price, r.price);
        const depth = neckline - h.price;
        if (depth > atr*1.2 && Math.abs(l.price-r.price) < depth*0.8) {
          const broken = cur > neckline + atr*0.2;
          out.push({ name:'Inverse H&S', dir:1, status: broken ? 'confirmed' : 'forming',
            conf: clamp(60 + (broken?15:0) + (1-Math.abs(l.price-r.price)/depth)*20, 40, 95),
            points: [l,h,r].map(s => ({t:s.time, v:s.price})),
            target: neckline + depth, invalid: h.price });
        }
      }
    }
    if (sh.length >= 2) {
      const [a, b] = sh.slice(-2);
      if (Math.abs(a.price-b.price) < atr*0.5 && b.p-a.p > 6 && (n-1-b.p) < 40) {
        const low = Math.min(...candles.slice(a.p,b.p+1).map(c => c.low));
        out.push({ name:'Double Top', dir:-1, status: cur < low ? 'confirmed' : 'forming',
          conf: clamp(55 + (1-Math.abs(a.price-b.price)/atr)*30, 40, 92),
          points: [a,b].map(s => ({t:s.time, v:s.price})),
          target: low-(a.price-low), invalid: Math.max(a.price,b.price) });
      }
    }
    if (sl.length >= 2) {
      const [a, b] = sl.slice(-2);
      if (Math.abs(a.price-b.price) < atr*0.5 && b.p-a.p > 6 && (n-1-b.p) < 40) {
        const high = Math.max(...candles.slice(a.p,b.p+1).map(c => c.high));
        out.push({ name:'Double Bottom', dir:1, status: cur > high ? 'confirmed' : 'forming',
          conf: clamp(55 + (1-Math.abs(a.price-b.price)/atr)*30, 40, 92),
          points: [a,b].map(s => ({t:s.time, v:s.price})),
          target: high+(high-a.price), invalid: Math.min(a.price,b.price) });
      }
    }
    return out.slice(0, 3);
  };

  const detectRegime = (candles, atr) => {
    const n = candles.length;
    const lb = Math.min(30, n-1);
    const net = Math.abs(candles[n-1].close - candles[n-1-lb].close);
    let path = 0;
    for (let i = n-lb; i < n; i++) path += Math.abs(candles[i].close - candles[i-1].close);
    const er = path ? net/path : 0;
    const ema50 = computeEMA(candles.map(c => c.close), 50);
    const slope = (ema50[n-1] - ema50[Math.max(0, n-11)]) / atr;
    let kind;
    if (er > 0.4) kind = candles[n-1].close > candles[n-1-lb].close ? 'Strong uptrend' : 'Strong downtrend';
    else if (er > 0.25) kind = slope > 0 ? 'Weak uptrend' : 'Weak downtrend';
    else kind = 'Range / consolidation';
    return {er, slope, kind};
  };

  const detectDivergence = (candles, swings, rsi) => {
    const out = [];
    const n = candles.length;
    const sh = swings.sh.slice(-3);
    const sl = swings.sl.slice(-3);
    for (let i = 1; i < sh.length; i++) {
      const a = sh[i-1], b = sh[i];
      if (n-1-b.p > 15 || rsi[a.p] == null || rsi[b.p] == null) continue;
      if (b.price > a.price && rsi[b.p] < rsi[a.p]-1) out.push({dir:-1, kind:'Regular bearish divergence'});
      else if (b.price < a.price && rsi[b.p] > rsi[a.p]+1) out.push({dir:-1, kind:'Hidden bearish divergence'});
    }
    for (let i = 1; i < sl.length; i++) {
      const a = sl[i-1], b = sl[i];
      if (n-1-b.p > 15 || rsi[a.p] == null || rsi[b.p] == null) continue;
      if (b.price < a.price && rsi[b.p] > rsi[a.p]+1) out.push({dir:1, kind:'Regular bullish divergence'});
      else if (b.price > a.price && rsi[b.p] < rsi[a.p]-1) out.push({dir:1, kind:'Hidden bullish divergence'});
    }
    return out.slice(-2);
  };

  // ================================================================
  // VOLUME SPIKES (NEW)
  // ================================================================
  const detectVolumeSpikes = (candles) => {
    const out = [];
    const n = candles.length;
    for (let i = 20; i < n; i++) {
      const avg = candles.slice(i-20, i).reduce((a,c) => a+c.volume, 0) / 20;
      if (candles[i].volume > avg * 2.5) {
        out.push({ time: candles[i].time, volume: candles[i].volume, avg, index: i });
      }
    }
    return out.slice(-30);
  };

  // ================================================================
  // MASTER ANALYSIS
  // ================================================================
  const analyze = (candles, tf) => {
    if (!candles || candles.length < 20) return null;
    const atr = computeATR(candles, 14);
    const rawSwings = detectSwings(candles, 3);
    rawSwings.sh = dedupeSwings(rawSwings.sh, false);
    rawSwings.sl = dedupeSwings(rawSwings.sl, true);
    const n = candles.length;
    const sigSh = significantSwings(rawSwings.sh, atr, n, 10);
    const sigSl = significantSwings(rawSwings.sl, atr, n, 10);
    const swings = {sh: rawSwings.sh, sl: rawSwings.sl, sigSh, sigSl};

    const structure = detectStructure(candles, rawSwings);
    const ob = detectOrderBlocks(candles, structure.events, atr);
    const breakers = detectBreakers(candles, structure.events, atr);
    const fvg = detectFVG(candles, atr);
    const sr = detectSR(candles, rawSwings, atr);
    const trendlines = detectTrendlines(candles, rawSwings, atr);
    const liq = detectLiquidity(candles, rawSwings, atr);
    const fib = detectFib(candles, rawSwings, atr);
    const pd = detectPD(candles, rawSwings);
    const sessions = detectSessions(candles);
    const sessionHL = detectSessionHL(candles);
    const prevDayWeek = detectPrevDayWeek(candles);
    const vprofile = computeVolumeProfile(candles);
    const patterns = detectPatterns(candles, rawSwings, atr);
    const regime = detectRegime(candles, atr);
    const rsi = computeRSI(candles);
    const divergence = detectDivergence(candles, rawSwings, rsi);
    const ema20 = computeEMA(candles.map(c => c.close), 20);
    const ema50 = computeEMA(candles.map(c => c.close), 50);
    const ema200 = computeEMA(candles.map(c => c.close), 200);
    const bb = computeBollinger(candles, 20, 2);
    const vwap = computeVWAP(candles);
    const supertrend = computeSupertrend(candles, 10, 3);
    const sweeps = detectSweeps(candles, rawSwings, atr);
    const equalLevels = detectEqualLevels(candles, rawSwings, atr);
    const inducements = detectInducement(candles, rawSwings, structure.events, atr);
    const volumeSpikes = detectVolumeSpikes(candles);

    // Bias scoring
    let score = 0;
    const reasons = [];
    const lastEv = structure.lastEvent;
    if (lastEv) {
      score += lastEv.dir * 20;
      reasons.push({dir:lastEv.dir, text:`${lastEv.kind} ${lastEv.dir > 0 ? 'up' : 'down'} to ${fmtPrice(lastEv.level)}`});
    }
    if (structure.state.includes('reversal')) score += structure.state.includes('bullish') ? 15 : -15;
    if (regime.kind.includes('uptrend')) { score += 25; reasons.push({dir:1, text:regime.kind}); }
    else if (regime.kind.includes('downtrend')) { score -= 25; reasons.push({dir:-1, text:regime.kind}); }
    else reasons.push({dir:0, text:'Range-bound — waiting for break'});

    const price = candles[n-1].close;
    if (pd) {
      if (pd.zone === 'discount') { score += 15; reasons.push({dir:1, text:`Discount zone (${(pd.pos*100).toFixed(0)}% of range)`}); }
      else { score -= 15; reasons.push({dir:-1, text:`Premium zone (${(pd.pos*100).toFixed(0)}% of range)`}); }
    }
    divergence.forEach(d => {
      score += d.dir * 18;
      reasons.push({dir:d.dir, text:d.kind});
    });
    const recentOB = ob[ob.length-1];
    if (recentOB) {
      score += recentOB.dir * 12;
      reasons.push({dir:recentOB.dir, text:`${recentOB.bias} OB @ ${fmtPrice(recentOB.lo)}–${fmtPrice(recentOB.hi)}`});
    }
    sweeps.forEach(sw => {
      score += sw.dir * 10;
      reasons.push({dir:sw.dir, text:`${sw.dir > 0 ? 'Bullish' : 'Bearish'} sweep @ ${fmtPrice(sw.price)}`});
    });

    const trendUp = ema20[n-1] > ema50[n-1];
    if (trendUp && price > ema20[n-1]) score += 10;
    else if (!trendUp && price < ema20[n-1]) score -= 10;
    const st = supertrend.dir[n-1];
    if (st === 1) score += 8;
    else if (st === -1) score -= 8;

    const bias = score > 20 ? 'Bullish' : score < -20 ? 'Bearish' : 'Neutral';
    const biasDir = score > 20 ? 1 : score < -20 ? -1 : 0;

    const nearestRes = sr.filter(s => s.price > price).sort((a,b) => a.price - b.price)[0];
    const nearestSup = sr.filter(s => s.price < price).sort((a,b) => b.price - a.price)[0];

    return {
      price, atr, swings, structure, ob, breakers, fvg, sr, trendlines, liq, fib, pd, sessions,
      sessionHL, prevDayWeek, vprofile, patterns, regime, rsi, divergence, ema20, ema50, ema200,
      bb, vwap, supertrend, sweeps, equalLevels, inducements, volumeSpikes,
      bias, biasDir, score, reasons, nearestRes, nearestSup, tf
    };
  };

  // ================================================================
  // TRANSFORMS
  // ================================================================
  const toHeikinAshi = (candles) => {
    const out = [];
    let prev = null;
    for (const c of candles) {
      const close = (c.open+c.high+c.low+c.close)/4;
      const open = prev ? (prev.open+prev.close)/2 : (c.open+c.close)/2;
      out.push({time:c.time, open, close, high:Math.max(c.high,open,close), low:Math.min(c.low,open,close)});
      prev = out[out.length-1];
    }
    return out;
  };
  const toRenko = (candles, atr) => {
    if (!candles.length) return [];
    if (!atr || atr <= 0) return candles.slice();
    const size = atr;
    let base = candles[0].close, dir = 0, last = 0;
    const out = [];
    for (const c of candles) {
      for (let guard = 0; guard < 50; guard++) {
        let o, cl;
        if (c.close >= base + (dir < 0 ? 2*size : size)) {
          o = dir < 0 ? base + size : base; cl = o + size; dir = 1;
        } else if (c.close <= base - (dir > 0 ? 2*size : size)) {
          o = dir > 0 ? base - size : base; cl = o - size; dir = -1;
        } else break;
        base = cl;
        last = Math.max(c.time, last+1);
        out.push({time:last, open:o, high:Math.max(o,cl), low:Math.min(o,cl), close:cl});
      }
    }
    return out.length ? out : candles.slice();
  };

  // ================================================================
  // CHART (FIXED)
  // ================================================================
  const chartOpts = () => ({
    layout: {
      background: {type:'solid', color:'#06070a'},
      textColor: '#8b98ab', fontSize: 11,
      fontFamily: "'JetBrains Mono', ui-monospace, monospace"
    },
    grid: {vertLines:{color:'rgba(29,38,52,0.5)'}, horzLines:{color:'rgba(29,38,52,0.5)'}},
    crosshair: {
      mode: 0,
      vertLine: {color:'rgba(91,154,255,0.6)', width:1, style:2, labelBackgroundColor:'#5b9aff'},
      horzLine: {color:'rgba(91,154,255,0.6)', width:1, style:2, labelBackgroundColor:'#5b9aff'}
    },
    timeScale: {
      borderColor: '#1d2634', timeVisible: true, secondsVisible: false,
      rightOffset: 4, barSpacing: 8, minBarSpacing: 2, maxBarSpacing: 60,
      shiftVisibleRangeOnNewBar: true
    },
    rightPriceScale: {
      borderColor: '#1d2634',
      scaleMargins: {top:0.06, bottom:0.24},
      autoScale: true
    },
    handleScroll: {mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:false},
    handleScale: {axisPressedMouseMove:true, mouseWheel:true, pinch:true}
  });

  const initChart = () => {
    const cw = $('#cw');
    if (STATE.chart) { try { STATE.chart.remove(); } catch(e) {} }

    // NO autoSize — explicit resize handles it reliably
    STATE.chart = LightweightCharts.createChart($('#ch'), chartOpts());
    STATE.indSeries = {};

    const canvas = $('#ov');
    STATE.overlay = canvas;
    STATE.overlayCtx = canvas.getContext('2d');

    const sizeAll = () => {
      if (!STATE.chart) return;
      const r = cw.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) {
        try { STATE.chart.applyOptions({ width: Math.floor(r.width), height: Math.floor(r.height) }); } catch(e) {}
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(r.width * dpr);
        canvas.height = Math.floor(r.height * dpr);
        canvas.style.width = r.width + 'px';
        canvas.style.height = r.height + 'px';
        STATE.overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawOverlay();
      }
    };
    STATE._sizeAll = sizeAll;

    if (STATE._ro) { try { STATE._ro.disconnect(); } catch(e) {} }
    STATE._ro = new ResizeObserver(sizeAll);
    STATE._ro.observe(cw);
    sizeAll();

    STATE.chart.subscribeCrosshairMove(updateLegend);
    STATE.chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
      requestAnimationFrame(drawOverlay);
    });
  };

  const updateLegend = (param) => {
    if (!param.time || !param.seriesData || !STATE.series) { $('#legend').classList.remove('show'); return; }
    const d = param.seriesData.get(STATE.series);
    if (!d) { $('#legend').classList.remove('show'); return; }
    if (d.open === undefined) {
      $('#legend').innerHTML = `<span class="c">Price</span><span class="v">${fmtPrice(d.close ?? d.value)}</span>`;
      $('#legend').classList.add('show');
      return;
    }
    const chg = d.open ? (d.close-d.open)/d.open*100 : 0;
    const cls = chg >= 0 ? 'up' : 'down';
    $('#legend').innerHTML =
      `<span class="o">O</span><span class="v">${fmtPrice(d.open)}</span>` +
      `<span class="h">H</span><span class="v">${fmtPrice(d.high)}</span>` +
      `<span class="l">L</span><span class="v">${fmtPrice(d.low)}</span>` +
      `<span class="c">C</span><span class="v">${fmtPrice(d.close)}</span>` +
      `<span class="sep">|</span>` +
      `<span class="chg ${cls}">${fmtPct(chg)}</span>`;
    $('#legend').classList.add('show');
  };

  const buildSeries = () => {
    if (!STATE.chart) return;
    // Remove old
    if (STATE.series) { try { STATE.chart.removeSeries(STATE.series); } catch(e) {} }
    if (STATE.volSeries) { try { STATE.chart.removeSeries(STATE.volSeries); } catch(e) {} }
    Object.values(STATE.indSeries).forEach(s => {
      if (s && typeof s === 'object' && !Array.isArray(s)) { try { STATE.chart.removeSeries(s); } catch(e) {} }
    });
    STATE.indSeries = {};
    STATE.series = null;
    STATE.volSeries = null;

    const type = STATE.chartType;
    const candles = STATE.candles;
    let series;
    if (type === 'candle' || type === 'ha' || type === 'renko') {
      series = STATE.chart.addCandlestickSeries({
        upColor:'#00e5a0', downColor:'#ff3d5a',
        borderUpColor:'#00e5a0', borderDownColor:'#ff3d5a',
        wickUpColor:'rgba(0,229,160,0.6)', wickDownColor:'rgba(255,61,90,0.6)'
      });
    } else if (type === 'bars') {
      series = STATE.chart.addBarSeries({upColor:'#00e5a0', downColor:'#ff3d5a', thinBars:false});
    } else if (type === 'line') {
      series = STATE.chart.addLineSeries({color:'#5b9aff', lineWidth:2, crosshairMarkerVisible:true,
        crosshairMarkerRadius:4, crosshairMarkerBorderColor:'#06070a', crosshairMarkerBackgroundColor:'#5b9aff'});
    } else if (type === 'area') {
      series = STATE.chart.addAreaSeries({lineColor:'#5b9aff', topColor:'rgba(91,154,255,0.35)',
        bottomColor:'rgba(91,154,255,0.02)', lineWidth:2});
    } else if (type === 'baseline') {
      series = STATE.chart.addBaselineSeries({
        baseValue:{type:'price', price: candles.length ? candles[0].close : 0},
        topLineColor:'#00e5a0', topFillColor1:'rgba(0,229,160,0.28)', topFillColor2:'rgba(0,229,160,0.02)',
        bottomLineColor:'#ff3d5a', bottomFillColor1:'rgba(255,61,90,0.02)', bottomFillColor2:'rgba(255,61,90,0.28)'
      });
    }
    STATE.series = series;

    let data = candles;
    if (type === 'ha') data = toHeikinAshi(candles);
    else if (type === 'renko') data = toRenko(candles, computeATR(candles, 14));

    if (type === 'line' || type === 'area' || type === 'baseline') {
      series.setData(data.map(c => ({time:c.time, value:c.close})));
    } else {
      series.setData(data);
      // Volume spike markers
      if (STATE.layers.volSpikes && STATE.analysis && STATE.analysis.volumeSpikes.length) {
        try {
          const spikes = new Set(STATE.analysis.volumeSpikes.map(s => s.time));
          series.setMarkers(data.filter(c => spikes.has(c.time)).map(c => ({
            time: c.time, position: 'belowBar', color: 'rgba(255,181,71,0.85)',
            shape: 'circle', text: 'V', size: 0.6
          })));
        } catch(e) {}
      }
    }

    // Volume subpanel
    if (STATE.layers.volPanel) {
      const vs = STATE.chart.addHistogramSeries({
        priceFormat: {type:'volume'}, priceScaleId: 'volume',
        priceLineVisible: false, lastValueVisible: false
      });
      try {
        STATE.chart.priceScale('volume').applyOptions({ scaleMargins: {top:0.8, bottom:0} });
      } catch(e) {}
      try {
        STATE.chart.priceScale('right').applyOptions({ scaleMargins: {top:0.06, bottom:0.24} });
      } catch(e) {}
      vs.setData(candles.map(c => ({
        time: c.time, value: c.volume,
        color: c.close >= c.open ? 'rgba(0,229,160,0.35)' : 'rgba(255,61,90,0.35)'
      })));
      STATE.volSeries = vs;
    } else {
      try { STATE.chart.priceScale('right').applyOptions({ scaleMargins: {top:0.06, bottom:0.24} }); } catch(e) {}
    }

    addIndicators();
    drawOverlay();
  };

  const addIndicators = () => {
    const candles = STATE.candles;
    if (!candles.length) return;
    ['ema20','ema50','ema200','bbUp','bbMid','bbLo','vwap','stUp','stDn'].forEach(k => {
      if (STATE.indSeries[k]) {
        try { STATE.chart.removeSeries(STATE.indSeries[k]); } catch(e) {}
        delete STATE.indSeries[k];
      }
    });

    if (STATE.layers.ema) {
      [20, 50, 200].forEach(p => {
        const ema = computeEMA(candles.map(c => c.close), p);
        const s = STATE.chart.addLineSeries({
          color: p === 20 ? 'rgba(0,217,229,0.8)' : p === 50 ? 'rgba(255,157,91,0.8)' : 'rgba(184,141,255,0.8)',
          lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false
        });
        s.setData(candles.map((c,i) => ({time:c.time, value:ema[i]})));
        STATE.indSeries['ema'+p] = s;
      });
    }
    if (STATE.layers.bb) {
      const bb = computeBollinger(candles);
      const up = STATE.chart.addLineSeries({color:'rgba(91,154,255,0.6)', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      const mid = STATE.chart.addLineSeries({color:'rgba(91,154,255,0.4)', lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      const lo = STATE.chart.addLineSeries({color:'rgba(91,154,255,0.6)', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      up.setData(candles.map((c,i) => bb.upper[i] != null ? {time:c.time, value:bb.upper[i]} : null).filter(Boolean));
      mid.setData(candles.map((c,i) => bb.middle[i] != null ? {time:c.time, value:bb.middle[i]} : null).filter(Boolean));
      lo.setData(candles.map((c,i) => bb.lower[i] != null ? {time:c.time, value:bb.lower[i]} : null).filter(Boolean));
      STATE.indSeries.bbUp = up; STATE.indSeries.bbMid = mid; STATE.indSeries.bbLo = lo;
    }
    if (STATE.layers.vwap) {
      const v = computeVWAP(candles);
      const s = STATE.chart.addLineSeries({color:'rgba(255,181,71,0.85)', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      s.setData(candles.map((c,i) => ({time:c.time, value:v[i]})));
      STATE.indSeries.vwap = s;
    }
    if (STATE.layers.supertrend) {
      const st = computeSupertrend(candles);
      const up = [], dn = [];
      candles.forEach((c,i) => {
        if (st.line[i] == null) return;
        if (st.dir[i] === 1) up.push({time:c.time, value:st.line[i]});
        else dn.push({time:c.time, value:st.line[i]});
      });
      const su = STATE.chart.addLineSeries({color:'rgba(0,229,160,0.7)', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      su.setData(up);
      STATE.indSeries.stUp = su;
      const sd = STATE.chart.addLineSeries({color:'rgba(255,61,90,0.7)', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      sd.setData(dn);
      STATE.indSeries.stDn = sd;
    }
  };

  // ================================================================
  // OVERLAY
  // ================================================================
  const drawOverlay = () => {
    if (!STATE.overlayCtx || !STATE.chart || !STATE.series || !STATE.analysis) return;
    const ctx = STATE.overlayCtx;
    const rect = STATE.overlay.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    ctx.clearRect(0, 0, rect.width, rect.height);

    const a = STATE.analysis;
    const candles = STATE.candles;
    const timeScale = STATE.chart.timeScale();
    const series = STATE.series;
    const xOf = t => timeScale.timeToCoordinate(t);
    const yOf = p => series.priceToCoordinate(p);
    const n = candles.length;

    // Sessions backgrounds
    if (STATE.layers.sessions) {
      a.sessions.forEach(s => {
        const x1 = xOf(s.startTime), x2 = xOf(s.endTime);
        if (x1 == null || x2 == null) return;
        ctx.fillStyle = s.color;
        ctx.fillRect(x1, 0, Math.max(1, x2-x1), rect.height);
      });
    }

    // Volume profile
    if (STATE.layers.vprofile && a.vprofile) {
      const vp = a.vprofile;
      const maxW = 80;
      vp.profile.forEach((v, i) => {
        const y1 = yOf(vp.vlo + i*vp.step);
        const y2 = yOf(vp.vlo + (i+1)*vp.step);
        if (y1 == null || y2 == null) return;
        const w = (v/vp.max)*maxW;
        const isPOC = i === vp.profile.indexOf(vp.max);
        ctx.fillStyle = isPOC ? 'rgba(255,157,91,0.55)' : 'rgba(91,154,255,0.22)';
        ctx.fillRect(rect.width - 12 - w, Math.min(y1,y2), w, Math.abs(y2-y1)-1);
      });
      const yPOC = yOf(vp.poc);
      if (yPOC != null) {
        ctx.strokeStyle = 'rgba(255,157,91,0.9)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(0, yPOC); ctx.lineTo(rect.width-12, yPOC); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,157,91,0.95)'; ctx.font = '600 10px "JetBrains Mono"';
        ctx.textAlign = 'right'; ctx.fillText('POC', rect.width-16, yPOC-3);
      }
    }

    // PDH/PDL/PWH/PWL — NEW
    if (STATE.layers.pdhPdl && a.prevDayWeek) {
      const dw = a.prevDayWeek;
      const drawLevel = (price, label, color, dash) => {
        if (price == null) return;
        const y = yOf(price);
        if (y == null) return;
        ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.setLineDash(dash || [6,4]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width-60, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color.replace('0.6', '0.95').replace('0.5', '0.95');
        ctx.font = '600 8.5px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(label, 6, y - 3);
      };
      drawLevel(dw.pdh, `PDH ${fmtPrice(dw.pdh)}`, 'rgba(255,157,91,0.7)', [7,3]);
      drawLevel(dw.pdl, `PDL ${fmtPrice(dw.pdl)}`, 'rgba(255,157,91,0.7)', [7,3]);
      drawLevel(dw.pwh, `PWH ${fmtPrice(dw.pwh)}`, 'rgba(184,141,255,0.7)', [3,3]);
      drawLevel(dw.pwl, `PWL ${fmtPrice(dw.pwl)}`, 'rgba(184,141,255,0.7)', [3,3]);
    }

    // Session H/L — NEW
    if (STATE.layers.sessionHL && a.sessionHL) {
      a.sessionHL.forEach(s => {
        const yH = yOf(s.hi), yL = yOf(s.lo);
        const x1 = xOf(s.startTime);
        if (yH == null || yL == null || x1 == null) return;
        const color = s.name === 'Asia' ? 'rgba(184,141,255,0.55)' : s.name === 'London' ? 'rgba(91,154,255,0.55)' : 'rgba(0,229,160,0.55)';
        ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
        ctx.beginPath(); ctx.moveTo(x1, yH); ctx.lineTo(rect.width-60, yH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x1, yL); ctx.lineTo(rect.width-60, yL); ctx.stroke();
        ctx.setLineDash([]);
        const brighter = color.replace('0.55', '0.95');
        ctx.fillStyle = brighter; ctx.font = '600 8px "JetBrains Mono"'; ctx.textAlign = 'right';
        ctx.fillText(`${s.name} H`, rect.width-64, yH-3);
        ctx.fillText(`${s.name} L`, rect.width-64, yL+9);
      });
    }

    // S/R
    if (STATE.layers.sr) {
      a.sr.forEach(s => {
        const y = yOf(s.price);
        if (y == null) return;
        const isSup = s.kind === 'support';
        ctx.strokeStyle = isSup ? 'rgba(0,229,160,0.4)' : 'rgba(255,61,90,0.4)';
        ctx.lineWidth = Math.max(1, s.strength/60);
        ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width-60, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = isSup ? 'rgba(0,229,160,0.9)' : 'rgba(255,61,90,0.9)';
        ctx.font = '600 9.5px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(`${isSup ? 'SUP' : 'RES'} ${fmtPrice(s.price)} ×${s.count}`, 8, y-4);
      });
    }

    // Fib
    if (STATE.layers.fib && a.fib) {
      a.fib.levels.forEach(l => {
        const y = yOf(l.p);
        if (y == null) return;
        ctx.strokeStyle = 'rgba(184,141,255,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width-60, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(184,141,255,0.9)'; ctx.font = '500 9px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(`${(l.r*100).toFixed(1)}% ${fmtPrice(l.p)}`, rect.width-55, y+3);
      });
    }

    // PD zones
    if (STATE.layers.pd && a.pd) {
      const eqY = yOf(a.pd.mid), hiY = yOf(a.pd.high), loY = yOf(a.pd.low);
      if (eqY != null && hiY != null && loY != null) {
        ctx.fillStyle = 'rgba(255,61,90,0.04)';
        ctx.fillRect(0, hiY, rect.width, eqY-hiY);
        ctx.fillStyle = 'rgba(0,229,160,0.04)';
        ctx.fillRect(0, eqY, rect.width, loY-eqY);
        ctx.strokeStyle = 'rgba(255,181,71,0.6)'; ctx.lineWidth = 1; ctx.setLineDash([8,6]);
        ctx.beginPath(); ctx.moveTo(0, eqY); ctx.lineTo(rect.width-60, eqY); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,181,71,0.95)'; ctx.font = '600 10px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(`EQ ${fmtPrice(a.pd.mid)}`, 8, eqY-4);
      }
    }

    // Order Blocks
    if (STATE.layers.ob) {
      a.ob.forEach(o => {
        const x1 = xOf(o.time);
        const x2 = rect.width - 60;
        if (x1 == null) return;
        const y1 = yOf(o.hi), y2 = yOf(o.lo);
        if (y1 == null || y2 == null) return;
        const isBull = o.dir > 0;
        ctx.fillStyle = isBull ? 'rgba(0,229,160,0.12)' : 'rgba(255,61,90,0.12)';
        ctx.strokeStyle = isBull ? 'rgba(0,229,160,0.65)' : 'rgba(255,61,90,0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(x1, y1, x2-x1, y2-y1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = isBull ? 'rgba(0,229,160,1)' : 'rgba(255,61,90,1)';
        ctx.font = '700 9.5px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(`${isBull ? 'OB+' : 'OB-'} Q${o.quality}`, x1+4, y1+11);
        const midY = yOf((o.hi+o.lo)/2);
        if (midY != null) {
          ctx.strokeStyle = isBull ? 'rgba(0,229,160,0.3)' : 'rgba(255,61,90,0.3)';
          ctx.lineWidth = 1; ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(x1, midY); ctx.lineTo(x2, midY); ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    // Breakers
    if (STATE.layers.breakers) {
      a.breakers.forEach(b => {
        const x1 = xOf(b.time);
        if (x1 == null) return;
        const x2 = rect.width - 60;
        const y1 = yOf(b.hi), y2 = yOf(b.lo);
        if (y1 == null || y2 == null) return;
        const isNowSup = b.dir < 0;
        ctx.strokeStyle = isNowSup ? 'rgba(0,229,160,0.55)' : 'rgba(255,61,90,0.55)';
        ctx.fillStyle = isNowSup ? 'rgba(0,229,160,0.06)' : 'rgba(255,61,90,0.06)';
        ctx.lineWidth = 1.5; ctx.setLineDash([8,4]);
        ctx.beginPath(); ctx.rect(x1, y1, x2-x1, y2-y1); ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = isNowSup ? 'rgba(0,229,160,0.9)' : 'rgba(255,61,90,0.9)';
        ctx.font = '600 9px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(isNowSup ? 'BRKR+' : 'BRKR-', x1+4, y2-4);
      });
    }

    // FVGs
    if (STATE.layers.fvg) {
      a.fvg.forEach(f => {
        const x1 = xOf(f.time);
        if (x1 == null) return;
        const x2 = rect.width - 60;
        const y1 = yOf(f.hi), y2 = yOf(f.lo);
        if (y1 == null || y2 == null) return;
        const isBull = f.dir > 0;
        ctx.fillStyle = isBull ? 'rgba(91,154,255,0.10)' : 'rgba(255,181,71,0.10)';
        ctx.strokeStyle = isBull ? 'rgba(91,154,255,0.5)' : 'rgba(255,181,71,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.rect(x1, y1, x2-x1, y2-y1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = isBull ? 'rgba(91,154,255,0.95)' : 'rgba(255,181,71,0.95)';
        ctx.font = '600 9px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(isBull ? 'FVG+' : 'FVG-', x1+4, y1+10);
      });
    }

    // Trendlines
    if (STATE.layers.trendlines) {
      a.trendlines.forEach(tl => {
        const x1 = xOf(tl.a.t);
        const x2 = xOf(candles[candles.length-1].time);
        if (x1 == null || x2 == null) return;
        const y1 = yOf(tl.a.v), y2 = yOf(tl.now);
        if (y1 == null || y2 == null) return;
        ctx.strokeStyle = tl.isSup ? 'rgba(0,229,160,0.7)' : 'rgba(255,61,90,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      });
    }

    // Liquidity pools
    if (STATE.layers.liq) {
      a.liq.forEach(l => {
        const y = yOf(l.price);
        if (y == null) return;
        ctx.strokeStyle = l.kind === 'high' ? 'rgba(255,61,90,0.55)' : 'rgba(0,229,160,0.55)';
        ctx.lineWidth = 1; ctx.setLineDash([2,3]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width-60, y); ctx.stroke();
        ctx.setLineDash([]);
        const mx = rect.width - 66;
        ctx.fillStyle = l.kind === 'high' ? 'rgba(255,61,90,0.9)' : 'rgba(0,229,160,0.9)';
        ctx.beginPath(); ctx.arc(mx, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(139,152,171,0.9)'; ctx.font = '500 9px "JetBrains Mono"'; ctx.textAlign = 'right';
        ctx.fillText(`LIQ ×${l.count}`, mx-6, y+3);
      });
    }

    // Sweeps
    if (STATE.layers.sweeps) {
      a.sweeps.forEach(sw => {
        const x = xOf(sw.time);
        const y = yOf(sw.wick);
        if (x == null || y == null) return;
        const color = sw.dir > 0 ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
        const ySwing = yOf(sw.price);
        ctx.fillStyle = color;
        if (sw.dir > 0) {
          ctx.beginPath(); ctx.moveTo(x, y-2); ctx.lineTo(x-5, y+6); ctx.lineTo(x+5, y+6); ctx.closePath(); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(x, y+2); ctx.lineTo(x-5, y-6); ctx.lineTo(x+5, y-6); ctx.closePath(); ctx.fill();
        }
        if (ySwing != null) {
          ctx.strokeStyle = color.replace('0.95', '0.4'); ctx.lineWidth = 1; ctx.setLineDash([2,3]);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, ySwing); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.fillStyle = color; ctx.font = '700 8.5px "JetBrains Mono"'; ctx.textAlign = 'center';
        ctx.fillText(sw.dir > 0 ? 'SWEEP+' : 'SWEEP-', x, sw.dir > 0 ? y+18 : y-12);
      });
    }

    // Equal H/L
    if (STATE.layers.eqhl) {
      const drawEQ = (eq, kind) => {
        const y = yOf(eq.price);
        const x1 = xOf(eq.time1), x2 = xOf(eq.time2);
        if (y == null || x1 == null || x2 == null) return;
        const color = kind === 'eqh' ? 'rgba(255,61,90,0.7)' : 'rgba(0,229,160,0.7)';
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([2,4]);
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(rect.width-60, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x1, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x2, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.font = '700 8.5px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText(kind === 'eqh' ? 'EQH' : 'EQL', Math.max(x1, x2)+6, y-4);
      };
      a.equalLevels.eqh.forEach(e => drawEQ(e, 'eqh'));
      a.equalLevels.eql.forEach(e => drawEQ(e, 'eql'));
    }

    // Inducement
    if (STATE.layers.idm) {
      a.inducements.forEach(idm => {
        const x = xOf(idm.time), y = yOf(idm.price);
        if (x == null || y == null) return;
        ctx.fillStyle = 'rgba(255,181,71,0.95)';
        ctx.font = '700 8.5px "JetBrains Mono"'; ctx.textAlign = 'center';
        ctx.fillText('IDM', x, idm.dir > 0 ? y+12 : y-6);
        ctx.strokeStyle = 'rgba(255,181,71,0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.stroke();
      });
    }

    // Swing labels (significant only)
    if (STATE.layers.swingLabels) {
      const recentSigSh = a.swings.sigSh.filter(s => n-1-s.p <= 100);
      const recentSigSl = a.swings.sigSl.filter(s => n-1-s.p <= 100);
      const drawLabel = (swing, prev, kind) => {
        if (!prev) return;
        const x = xOf(swing.time), y = yOf(swing.price);
        if (x == null || y == null) return;
        let label, color;
        if (kind === 'high') {
          if (swing.price > prev.price) { label = 'HH'; color = 'rgba(255,181,71,0.9)'; }
          else { label = 'LH'; color = 'rgba(184,141,255,0.9)'; }
        } else {
          if (swing.price > prev.price) { label = 'HL'; color = 'rgba(91,154,255,0.9)'; }
          else { label = 'LL'; color = 'rgba(255,61,90,0.9)'; }
        }
        ctx.fillStyle = color; ctx.font = '700 9px "JetBrains Mono"'; ctx.textAlign = 'center';
        ctx.fillText(label, x, kind === 'high' ? y-8 : y+14);
      };
      recentSigSh.forEach((s, i) => drawLabel(s, i > 0 ? recentSigSh[i-1] : null, 'high'));
      recentSigSl.forEach((s, i) => drawLabel(s, i > 0 ? recentSigSl[i-1] : null, 'low'));
    }

    // BOS / CHoCH
    if (STATE.layers.bos) {
      a.structure.events.slice(-5).forEach(ev => {
        const x = xOf(ev.time), y = yOf(ev.level);
        if (x == null || y == null) return;
        const isBull = ev.dir > 0;
        const color = ev.kind === 'CHoCH' ? 'rgba(255,181,71,0.95)'
          : (isBull ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)');
        ctx.fillStyle = color; ctx.font = '700 9.5px "JetBrains Mono"';
        ctx.textAlign = isBull ? 'left' : 'right';
        ctx.fillText(ev.kind, x + (isBull ? 6 : -6), y - 4);
        ctx.strokeStyle = color.replace('0.95', '0.5'); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (isBull ? 28 : -28), y); ctx.stroke();
      });
    }

    // Patterns
    if (STATE.layers.patterns) {
      a.patterns.forEach(p => {
        if (!p.points || p.points.length < 2) return;
        ctx.strokeStyle = p.dir > 0 ? 'rgba(0,229,160,0.7)' : 'rgba(255,61,90,0.7)';
        ctx.lineWidth = 1.5; ctx.setLineDash([5,3]);
        ctx.beginPath();
        let started = false;
        p.points.forEach(pt => {
          const x = xOf(pt.t), y = yOf(pt.v);
          if (x == null || y == null) return;
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        });
        if (started) ctx.stroke();
        ctx.setLineDash([]);
        const first = p.points[0];
        const xL = xOf(first.t), yL = yOf(first.v);
        if (xL != null && yL != null) {
          ctx.fillStyle = p.dir > 0 ? 'rgba(0,229,160,0.95)' : 'rgba(255,61,90,0.95)';
          ctx.font = '600 9.5px "JetBrains Mono"'; ctx.textAlign = 'left';
          ctx.fillText(p.name, xL+4, yL-6);
        }
      });
    }

    // Last price dot
    const lastPrice = candles[candles.length-1].close;
    const lastY = yOf(lastPrice);
    if (lastY != null) {
      ctx.fillStyle = 'rgba(91,154,255,0.9)';
      ctx.beginPath(); ctx.arc(rect.width - 60, lastY, 4, 0, Math.PI*2); ctx.fill();
    }
  };

  // ================================================================
  // MARKET STATUS
  // ================================================================
  const checkMarketStatus = () => {
    const last = STATE.candles[STATE.candles.length-1];
    if (!last) { STATE.marketStatus = 'unknown'; return; }
    const now = Date.now()/1000;
    const gap = now - last.time;
    const expected = TF_SEC[STATE.tf];
    const banner = $('#mkt-banner');
    const bannerText = $('#mkt-banner-text');
    const dot = $('#dot');
    if (STATE.asset && STATE.asset.fut) {
      const dow = new Date().getUTCDay();
      const isWeekend = dow === 0 || dow === 6;
      if (isWeekend || gap > expected * 4) {
        STATE.marketStatus = 'closed';
        STATE.staleCandles = true;
        banner.classList.add('show');
        bannerText.textContent = isWeekend
          ? `${STATE.asset.n} market closed (weekend) — last data shown`
          : `Market stale — last update ${Math.round(gap/60)}min ago`;
        dot.className = 'closed';
        return;
      }
    }
    if (gap > expected * 10) {
      STATE.marketStatus = 'stale';
      STATE.staleCandles = true;
      banner.classList.add('show');
      bannerText.textContent = `Data stale — last update ${Math.round(gap/60)}min ago`;
      dot.className = 'closed';
    } else {
      STATE.marketStatus = 'live';
      STATE.staleCandles = false;
      banner.classList.remove('show');
      dot.className = 'live';
    }
  };

  // ================================================================
  // HTF BADGE
  // ================================================================
  const updateHTFBadge = () => {
    const el = $('#htf-badge');
    if (!el) return;
    const ha = STATE.htfAnalysis;
    if (!ha) { el.style.display = 'none'; return; }
    const htf = HTF_MAP[STATE.tf] || STATE.tf;
    el.style.display = 'inline-block';
    el.textContent = `${htf.toUpperCase()} ${ha.bias.charAt(0)}`;
    el.style.background = ha.bias === 'Bullish' ? 'rgba(0,229,160,.18)' : ha.bias === 'Bearish' ? 'rgba(255,61,90,.18)' : 'rgba(255,181,71,.18)';
    el.style.color = ha.bias === 'Bullish' ? 'var(--up)' : ha.bias === 'Bearish' ? 'var(--down)' : 'var(--warn)';
  };

  // ================================================================
  // FULLSCREEN TOGGLE (FIXED)
  // ================================================================
  const toggleFullscreen = () => {
    const entering = !document.documentElement.classList.contains('fs');
    document.documentElement.classList.toggle('fs');
    // Force resize after transition completes
    setTimeout(() => {
      if (STATE._sizeAll) STATE._sizeAll();
      if (entering) {
        try { STATE.chart.timeScale().fitContent(); } catch(e) {}
      }
      setTimeout(drawOverlay, 60);
    }, 120);
  };

  // ================================================================
  // UI BUILDERS
  // ================================================================
  const buildSymbolSelect = () => {
    const sel = $('#sym');
    sel.innerHTML = '';
    const groups = {};
    STATE.assets.forEach(a => {
      if (!groups[a.group]) groups[a.group] = [];
      groups[a.group].push(a);
    });
    Object.keys(groups).forEach(gName => {
      const og = document.createElement('optgroup');
      og.label = gName;
      groups[gName].forEach(a => {
        const o = document.createElement('option');
        o.value = a.s; o.textContent = a.n;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    if (STATE.asset) sel.value = STATE.asset.s;
  };
  const buildTFSelect = () => {
    $('#tf').innerHTML = TFS.map(tf => `<option value="${tf}">${tf}</option>`).join('');
    $('#tf').value = STATE.tf;
  };
  const buildTypeSelect = () => {
    $('#ty').innerHTML = CHART_TYPES.map(t => `<option value="${t.key}">${t.label}</option>`).join('');
    $('#ty').value = STATE.chartType;
  };
  const buildLayerChips = () => {
    const chips = [
      {k:'ob', l:'OB'}, {k:'fvg', l:'FVG'}, {k:'sweeps', l:'Sweep'},
      {k:'eqhl', l:'EQH/L'}, {k:'bos', l:'BOS'}, {k:'sr', l:'S/R'},
      {k:'pdhPdl', l:'PDH/PWH'}, {k:'swingLabels', l:'Swings'}
    ];
    $('#lay').innerHTML = chips.map(c =>
      `<button class="layer-chip${STATE.layers[c.k]?' on':''}" data-layer="${c.k}">${c.l}</button>`
    ).join('');
    $$('#lay .layer-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.layer;
        STATE.layers[k] = STATE.layers[k] ? 0 : 1;

        const swings = detectSwings(candles, 3);
        swings.sh = dedupeSwings(swings.sh, false);
        swings.sl = dedupeSwings(swings.sl, true);
        const structure = detectStructure(candles, swings);
        const regime = detectRegime(candles, atr);

        const chg = (cur - candles[candles.length-2].close) / candles[candles.length-2].close * 100;
        let score = 0;
        if (lastEv) score += lastEv.dir * 25;
        if (regime.kind.includes('up')) score += 30;
