<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<title>QCity Terminal · Advanced Chart Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   QCity Terminal — Design System
   ============================================================ */
:root {
  --bg: #06070a;
  --bg-2: #090b10;
  --surface: #0d1118;
  --surface-2: #141a24;
  --surface-3: #1a2230;
  --surface-4: #232d3f;
  --border: #1d2634;
  --border-2: #2a3648;
  --border-3: #3a4a61;
  --text: #e8ecf3;
  --text-dim: #8b98ab;
  --text-mute: #5d6b7f;
  --text-faint: #3d4855;

  --up: #00e5a0;
  --up-soft: rgba(0, 229, 160, 0.14);
  --up-glow: rgba(0, 229, 160, 0.35);
  --down: #ff3d5a;
  --down-soft: rgba(255, 61, 90, 0.14);
  --down-glow: rgba(255, 61, 90, 0.35);

  --accent: #5b9aff;
  --accent-2: #b88dff;
  --accent-3: #ff9d5b;
  --accent-4: #00d9e5;
  --accent-soft: rgba(91, 154, 255, 0.14);
  --warn: #ffb547;
  --success: #00e5a0;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow: 0 4px 18px rgba(0,0,0,0.45);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 24px rgba(91,154,255,0.25);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --fast: 150ms;
  --med: 260ms;
  --slow: 420ms;

  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --header-h: 44px;
  --ticker-h: 28px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 800px 500px at 20% -10%, rgba(91,154,255,0.06), transparent 60%),
    radial-gradient(ellipse 700px 400px at 100% 0%, rgba(184,141,255,0.04), transparent 55%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
}

/* ============================================================
   Top Bar
   ============================================================ */
#bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  padding-top: max(0px, env(safe-area-inset-top));
  height: calc(var(--header-h) + env(safe-area-inset-top));
  background: linear-gradient(180deg, rgba(13,17,24,0.98) 0%, rgba(13,17,24,0.92) 100%);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}

#bar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 12px;
  margin-right: 4px;
  border-right: 1px solid var(--border);
  height: 24px;
}
#bar .brand-logo {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 11px; color: #06101c;
  box-shadow: 0 0 16px rgba(91,154,255,0.4);
}
#bar .brand-name {
  font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  background: linear-gradient(90deg, var(--text) 0%, var(--text-dim) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

.pill-select {
  position: relative;
  display: flex;
  align-items: center;
}
.pill-select select {
  appearance: none;
  -webkit-appearance: none;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 26px 6px 10px;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  transition: all var(--fast) var(--ease);
  max-width: 130px;
  text-overflow: ellipsis;
}
.pill-select select:hover { border-color: var(--border-2); background: var(--surface-3); }
.pill-select select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pill-select::after {
  content: '';
  position: absolute;
  right: 9px; top: 50%;
  width: 6px; height: 6px;
  border-right: 1.5px solid var(--text-dim);
  border-bottom: 1.5px solid var(--text-dim);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
  transition: border-color var(--fast);
}
.pill-select:hover::after { border-color: var(--text); }
.pill-select#sym-wrap select { max-width: 160px; min-width: 110px; font-weight: 600; }

.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--fast) var(--ease);
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-3); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.icon-btn svg { width: 15px; height: 15px; }

#px {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 1px;
  padding-left: 12px;
  border-left: 1px solid var(--border);
  height: 30px;
  min-width: 110px;
  transition: color var(--fast);
}
#px .p-main {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
  line-height: 1;
  transition: color var(--fast);
}
#px .p-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-mute);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  display: flex;
  gap: 6px;
  align-items: center;
}
#px .p-change { font-weight: 600; }
#px.up .p-main { color: var(--up); }
#px.down .p-main { color: var(--down); }
#px.up .p-change { color: var(--up); }
#px.down .p-change { color: var(--down); }

/* ============================================================
   Ticker Strip
   ============================================================ */
#tk {
  display: flex;
  gap: 4px;
  padding: 3px 8px;
  height: var(--ticker-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
  position: relative;
  z-index: 15;
}
#tk::-webkit-scrollbar { display: none; }

.tk-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px;
  border-radius: 4px;
  background: var(--surface-2);
  white-space: nowrap;
  font-size: 11px;
  cursor: pointer;
  transition: all var(--fast) var(--ease);
  border: 1px solid transparent;
  font-family: var(--font-mono);
}
.tk-item:hover { background: var(--surface-3); border-color: var(--border-2); }
.tk-item .s { color: var(--text-dim); font-weight: 600; letter-spacing: 0.2px; }
.tk-item .p { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.tk-item .c { font-weight: 600; font-variant-numeric: tabular-nums; }
.tk-item .c.up { color: var(--up); }
.tk-item .c.down { color: var(--down); }

/* ============================================================
   Chart Area
   ============================================================ */
#cw {
  position: relative;
  flex: 1;
  min-height: 0;
  background: var(--bg);
}
#ch, #ov {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#ov {
  pointer-events: none;
  z-index: 4;
}

/* Layer controls overlay */
#lay {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 10;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  max-width: calc(100% - 80px);
}

.layer-chip {
  padding: 4px 9px;
  font-size: 10.5px;
  font-weight: 500;
  background: rgba(13,17,24,0.85);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 20px;
  cursor: pointer;
  transition: all var(--fast) var(--ease);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: var(--font-ui);
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.layer-chip:hover { color: var(--text); border-color: var(--border-2); background: rgba(20,26,36,0.95); }
.layer-chip.on {
  color: #06101c;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
  box-shadow: 0 0 12px rgba(91,154,255,0.4);
}
.layer-chip:active { transform: scale(0.94); }

/* Connection dot */
#dot {
  position: absolute;
  top: 12px;
  right: 74px;
  z-index: 10;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-mute);
  transition: all var(--med) var(--ease);
  box-shadow: 0 0 8px transparent;
}
#dot.live {
  background: var(--up);
  box-shadow: 0 0 8px var(--up-glow), 0 0 16px var(--up-glow);
  animation: pulse-dot 2s ease-in-out infinite;
}
#dot.err { background: var(--down); box-shadow: 0 0 8px var(--down-glow); }
#dot.loading { background: var(--warn); box-shadow: 0 0 8px rgba(255,181,71,0.4); }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Status message */
#msg {
  position: absolute;
  bottom: 8px;
  left: 10px;
  z-index: 10;
  font-size: 10.5px;
  color: var(--text-mute);
  background: rgba(6,7,10,0.85);
  padding: 3px 8px;
  border-radius: 4px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: var(--font-mono);
  pointer-events: none;
  transition: opacity var(--med);
  border: 1px solid var(--border);
  letter-spacing: 0.2px;
}
#msg.hidden { opacity: 0; }

/* OHLC legend */
#legend {
  position: absolute;
  top: 8px;
  right: 12px;
  z-index: 10;
  display: flex;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: rgba(6,7,10,0.7);
  padding: 4px 9px;
  border-radius: var(--radius-sm);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  opacity: 0;
  transition: opacity var(--fast);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#legend.show { opacity: 1; }
#legend .o, #legend .h, #legend .l, #legend .c { color: var(--text-dim); }
#legend .v { color: var(--text); font-weight: 500; }
#legend .sep { color: var(--text-faint); }
#legend .chg.up { color: var(--up); }
#legend .chg.down { color: var(--down); }

/* Loading skeleton */
#skeleton {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding: 40px 20px;
  gap: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--med);
}
#skeleton.show { opacity: 1; pointer-events: auto; }
.sk-bar {
  height: 12px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: sk-shimmer 1.4s ease-in-out infinite;
}
.sk-bar.lg { height: 22px; width: 40%; }
.sk-bar.md { width: 65%; }
.sk-bar.sm { width: 30%; }
.sk-bar.full { width: 100%; margin-top: 8px; height: 160px; }
@keyframes sk-shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* ============================================================
   Bottom Sheet
   ============================================================ */
#sheet {
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
  position: relative;
  z-index: 15;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

#tabs {
  display: flex;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
#tabs::-webkit-scrollbar { display: none; }

#tabs button {
  flex: 1;
  min-width: 62px;
  padding: 10px 8px;
  border: 0;
  background: none;
  color: var(--text-mute);
  font-family: var(--font-ui);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color var(--fast);
  letter-spacing: 0.2px;
  white-space: nowrap;
}
#tabs button:hover { color: var(--text-dim); }
#tabs button.on { color: var(--accent); font-weight: 600; }
#tabs button.on::after {
  content: '';
  position: absolute;
  bottom: 0; left: 15%; right: 15%;
  height: 2px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
  box-shadow: 0 0 12px var(--accent);
  animation: tab-underline var(--med) var(--ease);
}
@keyframes tab-underline {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
#tabs button .badge {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 9px;
  font-weight: 700;
  font-family: var(--font-mono);
}

#body {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  max-height: 44dvh;
  max-height: 44vh;
  display: none;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-4) transparent;
}
#body::-webkit-scrollbar { width: 6px; }
#body::-webkit-scrollbar-track { background: transparent; }
#body::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 3px; }
#body::-webkit-scrollbar-thumb:hover { background: var(--border-3); }

#sheet.open #body { display: block; }
#body > div { animation: fade-slide var(--med) var(--ease); }
@keyframes fade-slide {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* Read panel */
.read-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  padding: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent);
}
.read-head .bias {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1;
  font-family: var(--font-ui);
}
.read-head .bias.up { color: var(--up); }
.read-head .bias.down { color: var(--down); }
.read-head .bias.flat { color: var(--warn); }
.read-head .bias-sub {
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 4px;
  font-family: var(--font-mono);
  letter-spacing: 0.2px;
}

.kv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.kv-cell {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  transition: border-color var(--fast);
}
.kv-cell:hover { border-color: var(--border-2); }
.kv-cell .k {
  font-size: 10px;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
  margin-bottom: 3px;
}
.kv-cell .v {
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.2px;
}
.kv-cell .v.up { color: var(--up); }
.kv-cell .v.down { color: var(--down); }
.kv-cell .v.mute { color: var(--text-dim); }
.kv-cell .s {
  font-size: 9.5px;
  color: var(--text-mute);
  margin-top: 2px;
}

.section-h {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 14px 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-h::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.analysis-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  margin-bottom: 5px;
  transition: all var(--fast);
  font-size: 12px;
}
.analysis-row:hover { border-color: var(--border-2); background: var(--surface-3); }
.analysis-row .tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  font-family: var(--font-mono);
  flex-shrink: 0;
  margin-top: 1px;
}
.analysis-row .tag.up { background: var(--up-soft); color: var(--up); }
.analysis-row .tag.down { background: var(--down-soft); color: var(--down); }
.analysis-row .tag.neu { background: rgba(255,181,71,0.14); color: var(--warn); }
.analysis-row .tag.info { background: var(--accent-soft); color: var(--accent); }
.analysis-row .body { flex: 1; line-height: 1.45; color: var(--text-dim); }
.analysis-row .body b { color: var(--text); font-weight: 600; }
.analysis-row .meta {
  font-size: 10px;
  color: var(--text-mute);
  font-family: var(--font-mono);
  margin-top: 2px;
}

/* Chat */
#chatlog {
  max-height: 28dvh;
  max-height: 28vh;
  overflow-y: auto;
  padding: 4px 2px;
  scrollbar-width: thin;
}
#chatlog .msg {
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  line-height: 1.5;
  animation: fade-slide var(--med) var(--ease);
  font-size: 12.5px;
}
#chatlog .msg.user {
  background: var(--accent-soft);
  border: 1px solid rgba(91,154,255,0.25);
  margin-left: 20px;
  color: var(--text);
}
#chatlog .msg.bot {
  background: var(--surface-2);
  border: 1px solid var(--border);
  margin-right: 20px;
  color: var(--text-dim);
}
#chatlog .msg.bot b { color: var(--text); }
#chatlog .msg.bot code {
  background: var(--bg);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-3);
}
#chatlog .msg.sys {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-mute);
  font-size: 11px;
  font-style: italic;
  text-align: center;
}

#chatin {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
#chatin input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12.5px;
  outline: none;
  transition: all var(--fast);
}
#chatin input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#chatin input::placeholder { color: var(--text-mute); }
#chatin button {
  padding: 0 16px;
  background: var(--accent);
  color: #06101c;
  border: 0;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: all var(--fast);
  font-family: var(--font-ui);
}
#chatin button:hover { background: #7cb0ff; }
#chatin button:active { transform: scale(0.96); }

.chat-suggests {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.chat-suggest {
  padding: 4px 9px;
  font-size: 10.5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--fast);
  font-family: var(--font-ui);
}
.chat-suggest:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* Scan / Stats / Data / Flow */
.scan-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 5px;
  cursor: pointer;
  transition: all var(--fast);
  font-size: 12px;
}
.scan-row:hover { border-color: var(--border-2); background: var(--surface-3); }
.scan-row .sym {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text);
  min-width: 76px;
  font-size: 11.5px;
}
.scan-row .score-bar {
  flex: 1;
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  overflow: hidden;
  min-width: 30px;
}
.scan-row .score-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--up));
  transition: width var(--slow) var(--ease);
}
.scan-row .score-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  min-width: 28px;
  text-align: right;
}
.scan-row .chg {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  min-width: 55px;
  text-align: right;
}
.scan-row .chg.up { color: var(--up); }
.scan-row .chg.down { color: var(--down); }

.stat-block {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}
.stat-block h4 {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}
.stat-block .row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.stat-block .row:last-child { border-bottom: 0; }
.stat-block .row .k { color: var(--text-dim); }
.stat-block .row .v { font-family: var(--font-mono); font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.stat-block .row .v.up { color: var(--up); }
.stat-block .row .v.down { color: var(--down); }

.calc-input {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
}
.calc-input label {
  font-size: 10.5px;
  color: var(--text-mute);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.calc-input input, .calc-input select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  transition: all var(--fast);
}
.calc-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.flow-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.data-table-wrap {
  max-height: 32dvh;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  scrollbar-width: thin;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.data-table th {
  position: sticky;
  top: 0;
  background: var(--surface-3);
  padding: 6px 8px;
  text-align: right;
  color: var(--text-mute);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 5px 8px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
}
.data-table tr:hover td { background: var(--surface-2); }
.data-table td:first-child, .data-table th:first-child { text-align: left; }
.data-table td.up { color: var(--up); }
.data-table td.down { color: var(--down); }

/* Fullscreen mode */
.fs #bar, .fs #sheet, .fs #tk { display: none; }
.fs #cw { border-radius: 0; }

/* ============================================================
   Floating Panel (layer config)
   ============================================================ */
#lp {
  display: none;
  position: absolute;
  top: 44px;
  left: 8px;
  z-index: 30;
  background: rgba(13,17,24,0.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  padding: 12px;
  max-width: 340px;
  width: calc(100% - 16px);
  max-height: 70dvh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: panel-in var(--med) var(--ease);
}
#lp.open { display: block; }
@keyframes panel-in {
  from { opacity: 0; transform: translateY(-6px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
#lp h4 {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 10px 0 6px;
}
#lp h4:first-child { margin-top: 0; }
#lp .grp {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
#lp .grp button {
  padding: 5px 10px;
  font-size: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--fast);
  font-family: var(--font-ui);
  font-weight: 500;
}
#lp .grp button:hover { border-color: var(--border-2); color: var(--text); }
#lp .grp button.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #06101c;
  font-weight: 600;
}

/* ============================================================
   Toast Notifications
   ============================================================ */
#toasts {
  position: fixed;
  top: calc(var(--header-h) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  max-width: 90vw;
}
.toast {
  padding: 8px 14px;
  background: rgba(13,17,24,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text);
  box-shadow: var(--shadow-lg);
  animation: toast-in 320ms var(--ease-spring);
  border-left: 3px solid var(--accent);
  pointer-events: auto;
  max-width: 380px;
}
.toast.err { border-left-color: var(--down); }
.toast.ok { border-left-color: var(--up); }
.toast.warn { border-left-color: var(--warn); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(-12px) scale(0.94); }
  to { opacity: 1; transform: none; }
}
.toast.out { animation: toast-out 260ms var(--ease) forwards; }
@keyframes toast-out {
  to { opacity: 0; transform: translateY(-8px) scale(0.96); }
}

/* ============================================================
   Responsive tweaks
   ============================================================ */
@media (max-width: 480px) {
  #bar .brand-name { display: none; }
  #bar { gap: 5px; padding: 0 6px; }
  .pill-select select { padding: 5px 22px 5px 8px; font-size: 11.5px; }
  .pill-select#sym-wrap select { max-width: 120px; min-width: 90px; }
  #px { min-width: 90px; padding-left: 6px; }
  #px .p-main { font-size: 14px; }
  #lay { max-width: calc(100% - 60px); }
  .layer-chip { padding: 3px 7px; font-size: 10px; }
  #body { max-height: 50dvh; max-height: 50vh; }
}

@media (min-width: 900px) {
  #body { max-height: 36dvh; max-height: 36vh; }
  #chatlog { max-height: 22dvh; max-height: 22vh; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="bar">
    <div class="brand">
      <div class="brand-logo">Q</div>
      <div class="brand-name">QCITY</div>
    </div>
    <div class="pill-select" id="sym-wrap">
      <select id="sym" aria-label="Symbol"></select>
    </div>
    <div class="pill-select">
      <select id="tf" aria-label="Timeframe"></select>
    </div>
    <div class="pill-select">
      <select id="ty" aria-label="Chart type"></select>
    </div>
    <button class="icon-btn" id="layers-btn" title="Layers (L)" aria-label="Layers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 12 12 17 22 12"/>
        <polyline points="2 17 12 22 22 17"/>
      </svg>
    </button>
    <button class="icon-btn" id="fs" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
    <div id="px">
      <div class="p-main">—</div>
      <div class="p-sub"><span class="p-change">—</span></div>
    </div>
  </header>

  <!-- Ticker strip -->
  <div id="tk"></div>

  <!-- Chart container -->
  <div id="cw">
    <div id="ch"></div>
    <canvas id="ov"></canvas>
    <div id="lay"></div>
    <div id="legend"></div>
    <div id="dot"></div>
    <div id="msg">initializing…</div>
    <div id="skeleton">
      <div class="sk-bar lg"></div>
      <div class="sk-bar sm"></div>
      <div class="sk-bar full"></div>
      <div class="sk-bar full"></div>
    </div>
  </div>

  <!-- Floating layer panel -->
  <div id="lp"></div>

  <!-- Bottom sheet -->
  <section id="sheet" class="open">
    <nav id="tabs">
      <button data-tab="read" class="on">Read</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="scan">Scan</button>
      <button data-tab="flow">Flow</button>
      <button data-tab="stats">Stats</button>
      <button data-tab="data">Data</button>
    </nav>
    <div id="body">
      <div id="t-read"></div>
      <div id="t-chat" hidden>
        <div class="chat-suggests">
          <button class="chat-suggest">What's the setup on gold 4h?</button>
          <button class="chat-suggest">Scan crypto 15m</button>
          <button class="chat-suggest">Show order blocks on BTC</button>
        </div>
        <div id="chatlog"></div>
        <div id="chatin">
          <input id="q" placeholder="Ask anything…" autocomplete="off" spellcheck="false">
          <button id="go">Ask</button>
        </div>
      </div>
      <div id="t-scan" hidden></div>
      <div id="t-flow" hidden></div>
      <div id="t-stats" hidden></div>
      <div id="t-data" hidden></div>
    </div>
  </section>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";

(() => {
  // ============================================================
  // CONSTANTS
  // ============================================================
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const TFS = ['1m','3m','5m','15m','30m','1h','2h','4h','6h','8h','12h','1d','3d','1w','1M'];
  const TF_SEC = {
    '1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,
    '1h':3600,'2h':7200,'4h':14400,'6h':21600,'8h':28800,'12h':43200,
    '1d':86400,'3d':259200,'1w':604800,'1M':2592000
  };
  const HTF_MAP = {
    '1m':'15m','3m':'1h','5m':'1h','15m':'4h','30m':'4h',
    '1h':'1d','2h':'1d','4h':'1d','6h':'3d','8h':'3d','12h':'1w',
    '1d':'1w','3d':'1w','1w':'1M','1M':'1M'
  };
  const CHART_TYPES = [
    { key: 'candle', label: 'Candles' },
    { key: 'bars',   label: 'OHLC Bars' },
    { key: 'line',   label: 'Line' },
    { key: 'area',   label: 'Area' },
    { key: 'baseline', label: 'Baseline' },
    { key: 'ha',     label: 'Heikin Ashi' },
    { key: 'renko',  label: 'Renko' }
  ];
  const SPOT_HOSTS = ['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com'];
  const FUT_HOSTS  = ['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com'];
  const COMMODITIES = [['XAUUSDT','Gold'],['XAGUSDT','Silver'],['CLUSDT','WTI Crude'],['BZUSDT','Brent'],['NATGASUSDT','Nat Gas']];
  const TOKENIZED = [['PAXGUSDT','PAXG'],['XAUTUSDT','XAUT']];
  const FALLBACK_TOP = ['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','AVAX','TRX','LINK','TON','DOT','MATIC','SHIB','LTC','BCH','UNI','ATOM','XLM','ETC','FIL','HBAR','ICP','ARB','OP','APT','SUI','INJ','SEI','TIA','RUNE','NEAR','AAVE','GRT','IMX','LDO','STX','RNDR','FET','WLD','PEPE','WIF','BONK','JUP','PYTH','ONDO','ENA','W','STRK','BLUR'];
  const STABLES = new Set(['usdt','usdc','fdusd','dai','tusd','usde','usds','usdd','pyusd','susde','usd0','steth','wsteth','weth','wbtc','weeth','wbeth','cbbtc','bsc-usd','leo']);
  const ALIASES = {
    gold:'XAUUSDT', silver:'XAGUSDT', oil:'CLUSDT', wti:'CLUSDT', brent:'BZUSDT',
    gas:'NATGASUSDT', natgas:'NATGASUSDT',
    btc:'BTCUSDT', bitcoin:'BTCUSDT', eth:'ETHUSDT', ethereum:'ETHUSDT',
    sol:'SOLUSDT', solana:'SOLUSDT', xrp:'XRPUSDT', bnb:'BNBUSDT',
    doge:'DOGEUSDT', ada:'ADAUSDT', avax:'AVAXUSDT', link:'LINKUSDT'
  };

  const STATE = {
    asset: null,
    assets: [],
    tf: '15m',
    chartType: 'candle',
    candles: [],
    htf: [],
    analysis: null,
    htfAnalysis: null,
    chart: null,
    series: null,
    indSeries: {},
    overlay: null,
    overlayCtx: null,
    ws: null,
    log: [],
    equity: 10000,
    risk: 1,
    layers: {
      swings: 1, sr: 1, trendlines: 1, ob: 1, fvg: 1,
      liq: 0, pd: 0, ict: 0, sessions: 0, fib: 0, wyckoff: 0,
      ema: 0, vwap: 0, bb: 0, supertrend: 0, vprofile: 0, patterns: 0
    },
    src: '',
    loading: false,
    lastUpdate: 0,
    price: null,
    change: null
  };

  // ============================================================
  // STORAGE
  // ============================================================
  try {
    const s = JSON.parse(localStorage.getItem('qcity_v3') || '{}');
    if (s.tf) STATE.tf = s.tf;
    if (s.chartType) STATE.chartType = s.chartType;
    if (s.layers) Object.assign(STATE.layers, s.layers);
    if (s.equity) STATE.equity = s.equity;
    if (s.risk) STATE.risk = s.risk;
    if (s.asset) STATE._savedAsset = s.asset;
    STATE.log = JSON.parse(localStorage.getItem('qcity_log') || '[]');
  } catch(e) {}

  const save = () => {
    try {
      localStorage.setItem('qcity_v3', JSON.stringify({
        tf: STATE.tf, chartType: STATE.chartType, layers: STATE.layers,
        equity: STATE.equity, risk: STATE.risk,
        asset: STATE.asset ? STATE.asset.s : null
      }));
      localStorage.setItem('qcity_log', JSON.stringify(STATE.log.slice(0, 40)));
    } catch(e) {}
  };

  // ============================================================
  // UTILS
  // ============================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtPrice = n => {
    if (n == null || !isFinite(n)) return '—';
    const abs = Math.abs(n);
    if (abs >= 10000) return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (abs >= 100) return n.toFixed(2);
    if (abs >= 1) return n.toFixed(3);
    if (abs >= 0.01) return n.toFixed(4);
    return n.toPrecision(4);
  };
  const fmtVol = n => {
    if (!isFinite(n)) return '—';
    if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  };
  const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const fmtTime = t => new Date(t*1000).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
  const fmtDateShort = t => new Date(t*1000).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  const fmtDT = t => new Date(t*1000).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });

  const toast = (msg, kind = '') => {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 2600);
  };
  const msg = t => { $('#msg').textContent = t; };

  // ============================================================
  // DATA
  // ============================================================
  const withTimeout = (url, ms = 7000) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
  };

  const jsonGet = async (hosts, path) => {
    let lastErr = null;
    for (const h of hosts) {
      try {
        const r = await withTimeout(h + path);
        if (r.ok) return await r.json();
        lastErr = new Error('HTTP ' + r.status);
      } catch(e) { lastErr = e; }
    }
    throw lastErr || new Error('All hosts failed');
  };

  const fetchKlines = async (asset, tf, limit = 500) => {
    const hosts = asset.fut ? FUT_HOSTS : SPOT_HOSTS;
    const path = (asset.fut ? '/fapi/v1/klines?' : '/api/v3/klines?') +
      `symbol=${asset.s}&interval=${tf}&limit=${limit}`;
    const raw = await jsonGet(hosts, path);
    if (!Array.isArray(raw) || !raw.length) throw new Error('No data for ' + asset.s);
    return raw.map(k => ({
      time: Math.floor(k[0]/1000),
      open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5]
    }));
  };

  const fetchTicker = async (asset) => {
    const hosts = asset.fut ? FUT_HOSTS : SPOT_HOSTS;
    const path = (asset.fut ? '/fapi/v1/ticker/24hr?' : '/api/v3/ticker/24hr?') + `symbol=${asset.s}`;
    try { return await jsonGet(hosts, path); } catch(e) { return null; }
  };

  const fetchSymbols = async () => {
    const assets = [];
    COMMODITIES.forEach(([s,n]) => assets.push({
      s, n, fut: true, group: 'Commodities',
      info: 'Binance TradFi perpetual — tracks underlying commodity, not spot'
    }));
    TOKENIZED.forEach(([s,n]) => assets.push({
      s, n, fut: false, group: 'Tokenized Gold',
      info: 'Gold-backed token on Binance spot — not the same as XAU/USD'
    }));

    let top = null;
    try {
      const [coins, prices] = await Promise.all([
        withTimeout('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100').then(r => r.json()),
        jsonGet(SPOT_HOSTS, '/api/v3/ticker/price')
      ]);
      const available = new Set(prices.map(p => p.symbol));
      const seen = new Set();
      top = [];
      for (const c of coins) {
        const sym = c.symbol.toUpperCase();
        if (STABLES.has(c.symbol) || seen.has(sym) || !available.has(sym + 'USDT')) continue;
        seen.add(sym);
        top.push(sym);
        if (top.length === 50) break;
      }
    } catch(e) {}

    const useTop = top && top.length >= 20;
    STATE.src = useTop
      ? 'Market-cap ranking (CoinGecko) × Binance listed pairs'
      : 'Fallback universe — CoinGecko unreachable';

    (useTop ? top : FALLBACK_TOP).forEach(sym => assets.push({
      s: sym + 'USDT', n: sym, fut: false, group: 'Crypto Top 50', info: 'Binance spot pair'
    }));

    STATE.assets = assets;
  };

  // ============================================================
  // INDICATORS
  // ============================================================
  const computeATR = (candles, period = 14) => {
    if (candles.length < 2) return 0;
    const trs = [];
    for (let i = 1; i < candles.length; i++) {
      const c = candles[i], p = candles[i-1];
      trs.push(Math.max(c.high - c.low, Math.abs(c.high - p.close), Math.abs(c.low - p.close)));
    }
    const n = Math.min(period, trs.length);
    const slice = trs.slice(-n);
    return slice.reduce((a,b) => a+b, 0) / n;
  };

  const computeEMA = (values, period) => {
    if (!values.length) return [];
    const k = 2 / (period + 1);
    const out = new Array(values.length);
    let e = values[0];
    out[0] = e;
    for (let i = 1; i < values.length; i++) {
      e = values[i] * k + e * (1 - k);
      out[i] = e;
    }
    return out;
  };

  const computeRSI = (candles, period = 14) => {
    const out = new Array(candles.length).fill(null);
    if (candles.length < period + 1) return out;
    let gain = 0, loss = 0;
    for (let i = 1; i <= period; i++) {
      const d = candles[i].close - candles[i-1].close;
      if (d >= 0) gain += d; else loss -= d;
    }
    let ag = gain / period, al = loss / period;
    out[period] = al === 0 ? 100 : 100 - 100 / (1 + ag/al);
    for (let i = period + 1; i < candles.length; i++) {
      const d = candles[i].close - candles[i-1].close;
      ag = (ag * (period-1) + Math.max(d, 0)) / period;
      al = (al * (period-1) + Math.max(-d, 0)) / period;
      out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag/al);
    }
    return out;
  };

  const computeBollinger = (candles, period = 20, mult = 2) => {
    const upper = [], middle = [], lower = [];
    for (let i = 0; i < candles.length; i++) {
      if (i < period - 1) { upper.push(null); middle.push(null); lower.push(null); continue; }
      const slice = candles.slice(i - period + 1, i + 1).map(c => c.close);
      const mean = slice.reduce((a,b) => a+b, 0) / period;
      const variance = slice.reduce((a,b) => a + (b - mean)**2, 0) / period;
      const sd = Math.sqrt(variance);
      middle.push(mean);
      upper.push(mean + mult*sd);
      lower.push(mean - mult*sd);
    }
    return { upper, middle, lower };
  };

  const computeVWAP = (candles) => {
    const out = [];
    let cumPV = 0, cumV = 0, curDay = null;
    for (const c of candles) {
      const day = Math.floor(c.time / 86400);
      if (day !== curDay) { cumPV = 0; cumV = 0; curDay = day; }
      const tp = (c.high + c.low + c.close) / 3;
      cumPV += tp * c.volume;
      cumV += c.volume;
      out.push(cumV === 0 ? c.close : cumPV / cumV);
    }
    return out;
  };

  const computeSupertrend = (candles, period = 10, mult = 3) => {
    if (candles.length < period + 2) return { line: [], dir: [] };
    const atrs = [];
    let prevATR = 0;
    for (let i = 0; i < candles.length; i++) {
      const tr = i === 0
        ? candles[0].high - candles[0].low
        : Math.max(candles[i].high - candles[i].low,
                   Math.abs(candles[i].high - candles[i-1].close),
                   Math.abs(candles[i].low - candles[i-1].close));
      if (i < period) { atrs.push(tr); continue; }
      if (i === period) prevATR = atrs.slice(0, period).reduce((a,b) => a+b, 0) / period;
      else prevATR = (prevATR * (period-1) + tr) / period;
      atrs.push(prevATR);
    }
    const line = new Array(candles.length).fill(null);
    const dir = new Array(candles.length).fill(0);
    let prevUB = null, prevLB = null, trend = 1;
    for (let i = period; i < candles.length; i++) {
      const hl2 = (candles[i].high + candles[i].low) / 2;
      let ub = hl2 + mult * atrs[i];
      let lb = hl2 - mult * atrs[i];
      if (prevUB !== null && (ub < prevUB || candles[i-1].close > prevUB)) { /* keep */ }
      if (prevLB !== null && (lb > prevLB || candles[i-1].close < prevLB)) { /* keep */ }
      if (prevUB !== null && ub > prevUB && candles[i-1].close <= prevUB) ub = prevUB;
      if (prevLB !== null && lb < prevLB && candles[i-1].close >= prevLB) lb = prevLB;
      if (candles[i].close > (prevUB ?? ub)) trend = 1;
      else if (candles[i].close < (prevLB ?? lb)) trend = -1;
      line[i] = trend === 1 ? lb : ub;
      dir[i] = trend;
      prevUB = ub; prevLB = lb;
    }
    return { line, dir };
  };

  // ============================================================
  // SWING & STRUCTURE DETECTION
  // ============================================================
  const detectSwings = (candles, k = 3) => {
    const sh = [], sl = [];
    for (let i = k; i < candles.length - k; i++) {
      let isH = true, isL = true;
      for (let j = i - k; j <= i + k; j++) {
        if (j === i) continue;
        if (candles[j].high >= candles[i].high) isH = false;
        if (candles[j].low  <= candles[i].low)  isL = false;
      }
      if (isH) sh.push({ p: i, price: candles[i].high, time: candles[i].time });
      if (isL) sl.push({ p: i, price: candles[i].low,  time: candles[i].time });
    }
    return { sh, sl };
  };

  const dedupeSwings = (swings, ascending) => {
    const out = [];
    for (const s of swings) {
      const last = out[out.length - 1];
      if (last && s.p - last.p < 4) {
        if (ascending ? s.price < last.price : s.price > last.price) out[out.length - 1] = s;
      } else out.push(s);
    }
    return out;
  };

  // ============================================================
  // MARKET STRUCTURE (BOS / CHoCH)
  // ============================================================
  const detectStructure = (candles, swings) => {
    const { sh, sl } = swings;
    const events = [];
    let trend = 0;
    let lastH = null, lastL = null;
    const shIdx = new Map(sh.map((s, i) => [s.p, true]));
    const slIdx = new Map(sl.map((s, i) => [s.p, true]));

    for (let i = 0; i < candles.length; i++) {
      if (shIdx.has(i)) {
        const s = sh.find(x => x.p === i);
        if (lastH && candles[i].close > lastH.price) {
          events.push({ i, time: candles[i].time, kind: trend >= 0 ? 'BOS' : 'CHoCH', dir: 1, level: lastH.price, fromTime: lastH.time });
          trend = 1;
        }
        lastH = s;
      }
      if (slIdx.has(i)) {
        const s = sl.find(x => x.p === i);
        if (lastL && candles[i].close < lastL.price) {
          events.push({ i, time: candles[i].time, kind: trend <= 0 ? 'BOS' : 'CHoCH', dir: -1, level: lastL.price, fromTime: lastL.time });
          trend = -1;
        }
        lastL = s;
      }
    }
    return events;
  };

  // ============================================================
  // ORDER BLOCKS
  // ============================================================
  const detectOrderBlocks = (candles, structureEvents, atr) => {
    const obs = [];
    structureEvents.slice(-10).forEach(ev => {
      for (let j = ev.i - 1; j >= Math.max(0, ev.i - 30); j--) {
        const x = candles[j];
        const isBull = ev.dir > 0 ? x.close < x.open : x.close > x.open;
        if (!isBull) continue;
        // Check if not mitigated
        let mitigated = false;
        for (let m = ev.i + 1; m < candles.length; m++) {
          if (ev.dir > 0 ? candles[m].close < x.low : candles[m].close > x.high) { mitigated = true; break; }
        }
        if (!mitigated) {
          // Quality: how many times tested, size relative to ATR
          let tests = 0;
          for (let m = ev.i + 1; m < candles.length; m++) {
            if (candles[m].low <= x.high && candles[m].high >= x.low) tests++;
          }
          const size = x.high - x.low;
          const quality = Math.round(clamp(40 + 30 * (size/atr) + 15 / (tests+1), 30, 99));
          obs.push({
            dir: ev.dir, lo: x.low, hi: x.high, time: x.time, index: j,
            quality, tests, size, evTime: ev.time
          });
          break;
        } else {
          // Check if broken (failed) — maybe show as broken OB
          let lastTest = -1;
          for (let m = ev.i + 1; m < candles.length; m++) {
            if (ev.dir > 0 ? candles[m].close < x.low : candles[m].close > x.high) { lastTest = m; break; }
          }
          if (lastTest >= 0) {
            // Mark as broken but only if recent
            break;
          }
        }
      }
    });
    return obs.slice(-6);
  };

  // ============================================================
  // FAIR VALUE GAPS
  // ============================================================
  const detectFVG = (candles, atr) => {
    const out = [];
    for (let i = 2; i < candles.length; i++) {
      const a = candles[i-2], b = candles[i];
      let z = null;
      if (a.high < b.low) z = { dir: 1, lo: a.high, hi: b.low, time: candles[i-1].time, idx: i-1 };
      else if (a.low > b.high) z = { dir: -1, lo: b.high, hi: a.low, time: candles[i-1].time, idx: i-1 };
      if (!z) continue;
      const size = z.hi - z.lo;
      if (size < atr * 0.25) continue;
      // Check mitigation
      let mitigated = false;
      for (let j = i+1; j < candles.length; j++) {
        if (z.dir > 0 ? candles[j].low <= z.lo : candles[j].high >= z.hi) { mitigated = true; break; }
      }
      if (!mitigated) {
        out.push({ ...z, size });
      }
    }
    return out.slice(-5);
  };

  // ============================================================
  // SUPPORT / RESISTANCE
  // ============================================================
  const detectSR = (candles, swings, atr) => {
    const all = [...swings.sh.map(s => ({ ...s, kind: 'resistance' })),
                 ...swings.sl.map(s => ({ ...s, kind: 'support' }))]
      .sort((a,b) => b.price - a.price);
    const clusters = [];
    const tol = atr * 0.4;
    all.forEach(s => {
      const g = clusters.find(c => Math.abs(c.price - s.price) < tol);
      if (g) { g.sum += s.price; g.count++; g.price = g.sum / g.count; g.lastTouch = Math.max(g.lastTouch, s.p); }
      else clusters.push({ price: s.price, sum: s.price, count: 1, kind: s.kind, lastTouch: s.p });
    });
    const curPrice = candles[candles.length-1].close;
    return clusters
      .filter(c => c.count >= 2)
      .map(c => ({
        price: c.price, count: c.count,
        kind: c.price > curPrice ? 'resistance' : 'support',
        strength: clamp(30 + c.count * 20, 30, 100)
      }))
      .sort((a,b) => b.strength - a.strength)
      .slice(0, 6);
  };

  // ============================================================
  // TRENDLINES
  // ============================================================
  const detectTrendlines = (candles, swings, atr) => {
    const out = [];
    const tryLines = (pts, isSupport) => {
      if (pts.length < 2) return;
      const slice = pts.slice(-10);
      let best = null;
      for (let i = 0; i < slice.length - 1; i++) {
        for (let j = i + 1; j < slice.length; j++) {
          const a = slice[i], b = slice[j];
          if (b.p - a.p < 10) continue;
          const slope = (b.price - a.price) / (b.p - a.p);
          if (Math.abs(slope) > 0.6 * atr) continue;
          // Check that all candles respect the line
          let touches = 0, violated = false;
          for (let k = a.p; k < candles.length; k++) {
            const lineY = a.price + slope * (k - a.p);
            const dist = isSupport ? candles[k].close - lineY : lineY - candles[k].close;
            if (dist < -atr * 0.3) { violated = true; break; }
            if (Math.abs(dist) < atr * 0.3) touches++;
          }
          if (violated || touches < 3) continue;
          const score = touches * 10 + (b.p - a.p);
          if (!best || score > best.score) {
            best = {
              a: { t: candles[a.p].time, v: a.price, p: a.p },
              b: { t: candles[b.p].time, v: b.price, p: b.p },
              slope, touches, isSupport,
              now: a.price + slope * (candles.length - 1 - a.p),
              score
            };
          }
        }
      }
      if (best) out.push(best);
    };
    tryLines(swings.sl, true);
    tryLines(swings.sh, false);
    return out;
  };

  // ============================================================
  // LIQUIDITY POOLS
  // ============================================================
  const detectLiquidity = (candles, swings, atr) => {
    const pools = [];
    const push = (s, kind) => {
      const price = s.price;
      // Check if price hasn't swept it yet
      const swept = candles.slice(s.p + 1).some(c =>
        kind === 'high' ? c.high > price + atr * 0.1 : c.low < price - atr * 0.1
      );
      if (!swept) pools.push({ price, kind, time: s.time, count: 1 });
    };
    swings.sh.slice(-8).forEach(s => push(s, 'high'));
    swings.sl.slice(-8).forEach(s => push(s, 'low'));
    // Merge close pools
    const merged = [];
    pools.forEach(p => {
      const m = merged.find(x => Math.abs(x.price - p.price) < atr * 0.3);
      if (m) { m.count++; m.price = (m.price * (m.count-1) + p.price) / m.count; }
      else merged.push(p);
    });
    return merged.sort((a,b) => b.count - a.count).slice(0, 5);
  };

  // ============================================================
  // FIBONACCI RETRACEMENT
  // ============================================================
  const detectFib = (candles, swings, atr) => {
    const lastH = swings.sh[swings.sh.length-1];
    const lastL = swings.sl[swings.sl.length-1];
    if (!lastH || !lastL) return null;
    if (Math.abs(lastH.price - lastL.price) < atr * 2) return null;
    const down = lastL.p > lastH.p;
    const high = lastH.price, low = lastL.price;
    const range = high - low;
    const ret = r => down ? low + range * r : high - range * r;
    const ext = r => down ? low - range * (r - 1) : high + range * (r - 1);
    return {
      t0: candles[Math.min(lastH.p, lastL.p)].time,
      t1: candles[Math.max(lastH.p, lastL.p)].time,
      down, high, low,
      levels: [0.382, 0.5, 0.618, 0.705, 0.786].map(r => ({ r, p: ret(r) })),
      golden: [ret(0.618), ret(0.65)],
      extensions: [1.272, 1.618, 2.0].map(r => ({ r, p: ext(r) }))
    };
  };

  // ============================================================
  // PREMIUM / DISCOUNT
  // ============================================================
  const detectPD = (candles, swings) => {
    const lastH = swings.sh[swings.sh.length-1];
    const lastL = swings.sl[swings.sl.length-1];
    if (!lastH || !lastL) return null;
    const high = Math.max(lastH.price, lastL.price);
    const low = Math.min(lastH.price, lastL.price);
    const mid = (high + low) / 2;
    const cur = candles[candles.length-1].close;
    const pos = (cur - low) / (high - low);
    return {
      high, low, mid, cur, pos,
      zone: pos > 0.5 ? 'premium' : 'discount',
      eq: mid,
      levels: [
        { r: 0.0, p: low, label: '0%' },
        { r: 0.25, p: low + (high-low)*0.25, label: '25%' },
        { r: 0.5, p: mid, label: 'EQ' },
        { r: 0.75, p: low + (high-low)*0.75, label: '75%' },
        { r: 1.0, p: high, label: '100%' }
      ]
    };
  };

  // ============================================================
  // SESSIONS (ICT Killzones)
  // ============================================================
  const getNYTime = (t) => {
    const d = new Date(t * 1000);
    const nyStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
    const [datePart, timePart] = nyStr.split(', ');
    const [mo, dy, yr] = datePart.split('/');
    const [hh, mm] = timePart.split(':');
    return { y: +yr, mo: +mo, d: +dy, h: +hh % 24, m: +mm };
  };

  const detectSessions = (candles) => {
    const sessions = [];
    let currentSession = null;
    candles.forEach((c, i) => {
      const ny = getNYTime(c.time);
      const hour = ny.h + ny.m / 60;
      let name = null, color = null;
      if (hour >= 20 && hour < 24) { name = 'Asia'; color = 'rgba(184,141,255,0.06)'; }
      else if (hour >= 2 && hour < 5) { name = 'London KZ'; color = 'rgba(91,154,255,0.09)'; }
      else if (hour >= 8.5 && hour < 11) { name = 'NY KZ'; color = 'rgba(0,229,160,0.09)'; }
      else if (hour >= 3 && hour < 4) { name = 'Silver Bullet'; color = 'rgba(255,157,91,0.12)'; }

      if (name !== currentSession?.name) {
        if (currentSession) sessions.push({ ...currentSession, end: i - 1, endTime: candles[i-1].time });
        if (name) currentSession = { name, color, start: i, startTime: c.time };
        else currentSession = null;
      }
      if (i === candles.length - 1 && currentSession) {
        sessions.push({ ...currentSession, end: i, endTime: c.time });
      }
    });
    return sessions;
  };

  // ============================================================
  // VOLUME PROFILE
  // ============================================================
  const computeVolumeProfile = (candles, bins = 40) => {
    const win = candles.slice(-200);
    if (!win.length) return null;
    let vlo = Infinity, vhi = -Infinity;
    win.forEach(c => { vlo = Math.min(vlo, c.low); vhi = Math.max(vhi, c.high); });
    const step = (vhi - vlo) / bins || 1;
    const profile = new Array(bins).fill(0);
    win.forEach(c => {
      const b = Math.min(bins - 1, Math.floor(((c.high + c.low) / 2 - vlo) / step));
      profile[b] += c.volume;
    });
    const max = Math.max(...profile);
    const total = profile.reduce((a,b) => a+b, 0);
    // Value area (70%)
    let poc = profile.indexOf(max);
    let vaSum = profile[poc], lo = poc, hi = poc;
    while (vaSum < total * 0.7 && (lo > 0 || hi < bins-1)) {
      const downVal = lo > 0 ? profile[lo-1] : -1;
      const upVal = hi < bins-1 ? profile[hi+1] : -1;
      if (upVal >= downVal) { hi++; vaSum += upVal; }
      else { lo--; vaSum += downVal; }
    }
    return {
      vlo, vhi, step, profile, max,
      poc: vlo + (poc + 0.5) * step,
      vah: vlo + (hi + 1) * step,
      val: vlo + lo * step
    };
  };

  // ============================================================
  // PATTERNS
  // ============================================================
  const detectPatterns = (candles, swings, atr) => {
    const patterns = [];
    const { sh, sl } = swings;
    const cur = candles[candles.length-1].close;
    const n = candles.length;

    // Head & Shoulders / Inverse H&S
    if (sh.length >= 3) {
      const [l, h, r] = sh.slice(-3);
      if (r.p > h.p && h.p > l.p && (n - 1 - r.p) < 150 && (h.p - l.p) > 4 && (r.p - h.p) > 4) {
        const neckline = Math.min(l.price, r.price);
        const headHeight = h.price - neckline;
        if (headHeight > atr * 1.2 && Math.abs(l.price - r.price) < headHeight * 0.8) {
          const target = neckline - headHeight;
          const broken = cur < neckline - atr * 0.2;
          patterns.push({
            name: 'Head & Shoulders',
            dir: -1, status: broken ? 'confirmed' : 'forming',
            conf: clamp(60 + (broken ? 15 : 0) + (1 - Math.abs(l.price - r.price)/headHeight) * 20, 40, 95),
            points: [l, h, r].map(s => ({ t: s.time, v: s.price })),
            neckline: { lo, hi: neckline }, target, invalid: h.price
          });
        }
      }
    }
    if (sl.length >= 3) {
      const [l, h, r] = sl.slice(-3);
      if (r.p > h.p && h.p > l.p && (n - 1 - r.p) < 150 && (h.p - l.p) > 4 && (r.p - h.p) > 4) {
        const neckline = Math.max(l.price, r.price);
        const headDepth = neckline - h.price;
        if (headDepth > atr * 1.2 && Math.abs(l.price - r.price) < headDepth * 0.8) {
          const target = neckline + headDepth;
          const broken = cur > neckline + atr * 0.2;
          patterns.push({
            name: 'Inverse H&S',
            dir: 1, status: broken ? 'confirmed' : 'forming',
            conf: clamp(60 + (broken ? 15 : 0) + (1 - Math.abs(l.price - r.price)/headDepth) * 20, 40, 95),
            points: [l, h, r].map(s => ({ t: s.time, v: s.price })),
            neckline: { lo: neckline, hi: neckline }, target, invalid: h.price
          });
        }
      }
    }

    // Double top/bottom
    if (sh.length >= 2) {
      const [a, b] = sh.slice(-2);
      if (Math.abs(a.price - b.price) < atr * 0.5 && b.p - a.p > 6 && (n - 1 - b.p) < 40) {
        const low = Math.min(...candles.slice(a.p, b.p+1).map(c => c.low));
        const target = low - (a.price - low);
        patterns.push({
          name: 'Double Top', dir: -1, status: cur < low ? 'confirmed' : 'forming',
          conf: clamp(55 + (1 - Math.abs(a.price-b.price)/atr) * 30, 40, 92),
          points: [a, b].map(s => ({ t: s.time, v: s.price })),
          neckline: { lo: low, hi: low }, target, invalid: Math.max(a.price, b.price)
        });
      }
    }
    if (sl.length >= 2) {
      const [a, b] = sl.slice(-2);
      if (Math.abs(a.price - b.price) < atr * 0.5 && b.p - a.p > 6 && (n - 1 - b.p) < 40) {
        const high = Math.max(...candles.slice(a.p, b.p+1).map(c => c.high));
        const target = high + (high - a.price);
        patterns.push({
          name: 'Double Bottom', dir: 1, status: cur > high ? 'confirmed' : 'forming',
          conf: clamp(55 + (1 - Math.abs(a.price-b.price)/atr) * 30, 40, 92),
          points: [a, b].map(s => ({ t: s.time, v: s.price })),
          neckline: { lo: high, hi: high }, target, invalid: Math.min(a.price, b.price)
        });
      }
    }

    return patterns.slice(0, 3);
  };

  // ============================================================
  // WYCKOFF (simplified)
  // ============================================================
  const detectWyckoff = (candles, atr) => {
    if (candles.length < 80) return null;
    const last = candles.slice(-80);
    const hi = Math.max(...last.map(c => c.high));
    const lo = Math.min(...last.map(c => c.low));
    if (hi - lo < atr * 5) return null;
    const events = [];
    const avgVol = last.slice(0, 40).reduce((a,c) => a+c.volume, 0) / 40;
    last.forEach((c, i) => {
      const range = c.high - c.low;
      const vr = c.volume / avgVol;
      if (i > 5 && range > atr * 1.5 && vr > 1.6) {
        if (c.low < lo + atr * 0.6 && c.close > lo + atr * 0.5) events.push({ kind: 'Spring', i, price: c.low, dir: 1 });
        if (c.high > hi - atr * 0.6 && c.close < hi - atr * 0.5) events.push({ kind: 'Upthrust', i, price: c.high, dir: -1 });
      }
      if (c.close > hi - atr * 0.2 && vr > 1.3) events.push({ kind: 'SOS', i, price: c.high, dir: 1 });
      if (c.close < lo + atr * 0.2 && vr > 1.3) events.push({ kind: 'SOW', i, price: c.low, dir: -1 });
    });
    const bias = events.reduce((a,e) => a + e.dir, 0);
    return {
      range: { hi, lo },
      events: events.slice(-5),
      bias,
      phase: events.length === 0 ? 'B (building)' : bias > 0 ? 'C/D (markup setup)' : 'C/D (markdown setup)'
    };
  };

  // ============================================================
  // REGIME & TREND
  // ============================================================
  const detectRegime = (candles, atr) => {
    const n = candles.length;
    const lookback = Math.min(30, n-1);
    const net = Math.abs(candles[n-1].close - candles[n-1-lookback].close);
    let path = 0;
    for (let i = n - lookback; i < n; i++) path += Math.abs(candles[i].close - candles[i-1].close);
    const er = path ? net / path : 0;
    const ema50 = computeEMA(candles.map(c => c.close), 50);
    const slope = (ema50[n-1] - ema50[Math.max(0, n-11)]) / atr;
    let kind;
    if (er > 0.4) kind = candles[n-1].close > candles[n-1-lookback].close ? 'Strong uptrend' : 'Strong downtrend';
    else if (er > 0.25) kind = slope > 0 ? 'Weak uptrend' : 'Weak downtrend';
    else kind = 'Range / consolidation';
    return { er, slope, kind };
  };

  // ============================================================
  // RSI DIVERGENCE
  // ============================================================
  const detectDivergence = (candles, swings, rsi) => {
    const out = [];
    const n = candles.length;
    const sh = swings.sh.slice(-3);
    const sl = swings.sl.slice(-3);
    for (let i = 1; i < sh.length; i++) {
      const a = sh[i-1], b = sh[i];
      if (n - 1 - b.p > 15) continue;
      if (rsi[a.p] == null || rsi[b.p] == null) continue;
      if (b.price > a.price && rsi[b.p] < rsi[a.p] - 1) {
        out.push({ dir: -1, kind: 'Regular bearish divergence', a, b });
      } else if (b.price < a.price && rsi[b.p] > rsi[a.p] + 1) {
        out.push({ dir: -1, kind: 'Hidden bearish divergence', a, b });
      }
    }
    for (let i = 1; i < sl.length; i++) {
      const a = sl[i-1], b = sl[i];
      if (n - 1 - b.p > 15) continue;
      if (rsi[a.p] == null || rsi[b.p] == null) continue;
      if (b.price < a.price && rsi[b.p] > rsi[a.p] + 1) {
        out.push({ dir: 1, kind: 'Regular bullish divergence', a, b });
      } else if (b.price > a.price && rsi[b.p] < rsi[a.p] - 1) {
        out.push({ dir: 1, kind: 'Hidden bullish divergence', a, b });
      }
    }
    return out.slice(-2);
  };

  // ============================================================
  // MASTER ANALYSIS
  // ============================================================
  const analyze = (candles, tf) => {
    if (!candles || candles.length < 20) return null;
    const atr = computeATR(candles, 14);
    const swings = detectSwings(candles, 3);
    swings.sh = dedupeSwings(swings.sh, false);
    swings.sl = dedupeSwings(swings.sl, true);
    const structure = detectStructure(candles, swings);
    const ob = detectOrderBlocks(candles, structure, atr);
    const fvg = detectFVG(candles, atr);
    const sr = detectSR(candles, swings, atr);
    const trendlines = detectTrendlines(candles, swings, atr);
    const liq = detectLiquidity(candles, swings, atr);
    const fib = detectFib(candles, swings, atr);
    const pd = detectPD(candles, swings);
    const sessions = detectSessions(candles);
    const vprofile = computeVolumeProfile(candles);
    const patterns = detectPatterns(candles, swings, atr);
    const wyckoff = detectWyckoff(candles, atr);
    const regime = detectRegime(candles, atr);
    const rsi = computeRSI(candles);
    const divergence = detectDivergence(candles, swings, rsi);
    const ema20 = computeEMA(candles.map(c => c.close), 20);
    const ema50 = computeEMA(candles.map(c => c.close), 50);
    const ema200 = computeEMA(candles.map(c => c.close), 200);
    const bb = computeBollinger(candles, 20, 2);
    const vwap = computeVWAP(candles);
    const supertrend = computeSupertrend(candles, 10, 3);

    // Bias
    let score = 0, reasons = [];
    const lastEv = structure[structure.length-1];
    if (lastEv) {
      score += lastEv.dir * 20;
      reasons.push({ dir: lastEv.dir, text: `${lastEv.kind} to the ${lastEv.dir > 0 ? 'upside' : 'downside'}` });
    }
    if (regime.kind.includes('uptrend')) { score += 25; reasons.push({ dir: 1, text: regime.kind }); }
    else if (regime.kind.includes('downtrend')) { score -= 25; reasons.push({ dir: -1, text: regime.kind }); }
    else { reasons.push({ dir: 0, text: 'Range-bound — wait for break' }); }

    const price = candles[candles.length-1].close;
    if (pd) {
      if (pd.zone === 'discount') { score += 15; reasons.push({ dir: 1, text: `Discount zone (${(pd.pos*100).toFixed(0)}% of range)` }); }
      else { score -= 15; reasons.push({ dir: -1, text: `Premium zone (${(pd.pos*100).toFixed(0)}% of range)` }); }
    }

    divergence.forEach(d => {
      score += d.dir * 18;
      reasons.push({ dir: d.dir, text: d.kind });
    });

    const activeOB = ob.filter(o => o.dir !== 0);
    const recentOB = activeOB[activeOB.length-1];
    if (recentOB) {
      score += recentOB.dir * 12;
      reasons.push({ dir: recentOB.dir, text: `${recentOB.dir > 0 ? 'Bullish' : 'Bearish'} OB @ ${fmtPrice(recentOB.lo)}-${fmtPrice(recentOB.hi)}` });
    }

    const trendUp = ema20[candles.length-1] > ema50[candles.length-1];
    if (trendUp && price > ema20[candles.length-1]) score += 10;
    else if (!trendUp && price < ema20[candles.length-1]) score -= 10;

    const st = supertrend.dir[candles.length-1];
    if (st === 1) score += 8;
    else if (st === -1) score -= 8;

    if (wyckoff) {
      if (wyckoff.bias > 0) { score += 10; reasons.push({ dir: 1, text: `Wyckoff ${wyckoff.phase} — accumulating` }); }
      else if (wyckoff.bias < 0) { score -= 10; reasons.push({ dir: -1, text: `Wyckoff ${wyckoff.phase} — distributing` }); }
    }

    const bias = score > 20 ? 'Bullish' : score < -20 ? 'Bearish' : 'Neutral';
    const biasDir = score > 20 ? 1 : score < -20 ? -1 : 0;

    // Find key levels
    const nearestRes = sr.filter(s => s.price > price).sort((a,b) => a.price - b.price)[0];
    const nearestSup = sr.filter(s => s.price < price).sort((a,b) => b.price - a.price)[0];

    return {
      price, atr, swings, structure, ob, fvg, sr, trendlines, liq, fib, pd, sessions,
      vprofile, patterns, wyckoff, regime, rsi, divergence, ema20, ema50, ema200,
      bb, vwap, supertrend, bias, biasDir, score, reasons,
      nearestRes, nearestSup, tf
    };
  };

  // ============================================================
  // CHART TRANSFORMS
  // ============================================================
  const toHeikinAshi = (candles) => {
    const out = [];
    let prev = null;
    for (const c of candles) {
      const close = (c.open + c.high + c.low + c.close) / 4;
      const open = prev ? (prev.open + prev.close) / 2 : (c.open + c.close) / 2;
      const high = Math.max(c.high, open, close);
      const low = Math.min(c.low, open, close);
      out.push({ time: c.time, open, high, low, close });
      prev = out[out.length-1];
    }
    return out;
  };

  const toRenko = (candles, atr) => {
    if (!candles.length) return [];
    const size = atr || (candles[0].high - candles[0].low) * 2;
    let base = candles[0].close;
    let dir = 0;
    let last = 0;
    const out = [];
    for (const c of candles) {
      for (let guard = 0; guard < 50; guard++) {
        let o, cl;
        if (c.close >= base + (dir < 0 ? 2*size : size)) {
          o = dir < 0 ? base + size : base;
          cl = o + size;
          dir = 1;
        } else if (c.close <= base - (dir > 0 ? 2*size : size)) {
          o = dir > 0 ? base - size : base;
          cl = o - size;
          dir = -1;
        } else break;
        base = cl;
        last = Math.max(c.time, last + 1);
        out.push({ time: last, open: o, high: Math.max(o, cl), low: Math.min(o, cl), close: cl });
      }
    }
    return out;
  };

  // ============================================================
  // CHART RENDERING
  // ============================================================
  const chartOpts = () => ({
    layout: {
      background: { type: 'solid', color: '#06070a' },
      textColor: '#8b98ab',
      fontSize: 11,
      fontFamily: "'JetBrains Mono', ui-monospace, monospace",
    },
    grid: {
      vertLines: { color: 'rgba(29,38,52,0.5)' },
      horzLines: { color: 'rgba(29,38,52,0.5)' }
    },
    crosshair: {
      mode: 1,
      vertLine: { color: 'rgba(91,154,255,0.5)', width: 1, style: 2, labelBackgroundColor: '#5b9aff' },
      horzLine: { color: 'rgba(91,154,255,0.5)', width: 1, style: 2, labelBackgroundColor: '#5b9aff' }
    },
    timeScale: {
      borderColor: '#1d2634',
      timeVisible: true,
      secondsVisible: false,
      rightOffset: 5,
      barSpacing: 8,
    },
    rightPriceScale: {
      borderColor: '#1d2634',
      scaleMargins: { top: 0.08, bottom: 0.22 },
    },
    handleScroll: { vertTouchDrag: false }
  });

  const initChart = () => {
    if (STATE.chart) { STATE.chart.remove(); }
    STATE.chart = LightweightCharts.createChart($('#ch'), chartOpts());
    STATE.indSeries = {};

    STATE.chart.subscribeCrosshairMove(param => {
      updateLegend(param);
      if (!param.time) { $('#legend').classList.remove('show'); return; }
    });

    STATE.chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
      drawOverlay();
    });

    // Overlay canvas
    const cw = $('#cw');
    const canvas = $('#ov');
    const ro = new ResizeObserver(() => {
      const r = cw.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = r.width * dpr;
      canvas.height = r.height * dpr;
      canvas.style.width = r.width + 'px';
      canvas.style.height = r.height + 'px';
      STATE.overlay = canvas;
      STATE.overlayCtx = canvas.getContext('2d');
      STATE.overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawOverlay();
    });
    ro.observe(cw);
  };

  const updateLegend = (param) => {
    if (!param.time || !param.seriesData) { $('#legend').classList.remove('show'); return; }
    const d = param.seriesData.get(STATE.series);
    if (!d) { $('#legend').classList.remove('show'); return; }
    let open = d.open, high = d.high, low = d.low, close = d.close;
    if (open === undefined) { // line series
      $('#legend').innerHTML = `<span class="c">Price</span><span class="v">${fmtPrice(close)}</span>`;
      $('#legend').classList.add('show');
      return;
    }
    const change = open ? (close - open) / open * 100 : 0;
    const cls = change >= 0 ? 'up' : 'down';
    $('#legend').innerHTML =
      `<span class="o">O</span><span class="v">${fmtPrice(open)}</span>` +
      `<span class="h">H</span><span class="v">${fmtPrice(high)}</span>` +
      `<span class="l">L</span><span class="v">${fmtPrice(low)}</span>` +
      `<span class="c">C</span><span class="v">${fmtPrice(close)}</span>` +
      `<span class="sep">|</span>` +
      `<span class="chg ${cls}">${fmtPct(change)}</span>`;
    $('#legend').classList.add('show');
  };

  const buildSeries = () => {
    if (!STATE.chart) return;
    // Remove old series
    if (STATE.series) { try { STATE.chart.removeSeries(STATE.series); } catch(e) {} }
    Object.values(STATE.indSeries).forEach(s => { try { STATE.chart.removeSeries(s); } catch(e) {} });
    STATE.indSeries = {};

    const type = STATE.chartType;
    let series;
    const candles = STATE.candles;

    if (type === 'candle' || type === 'ha' || type === 'renko') {
      series = STATE.chart.addCandlestickSeries({
        upColor: '#00e5a0', downColor: '#ff3d5a',
        borderUpColor: '#00e5a0', borderDownColor: '#ff3d5a',
        wickUpColor: 'rgba(0,229,160,0.6)', wickDownColor: 'rgba(255,61,90,0.6)'
      });
    } else if (type === 'bars') {
      series = STATE.chart.addBarSeries({
        upColor: '#00e5a0', downColor: '#ff3d5a', thinBars: false
      });
    } else if (type === 'line') {
      series = STATE.chart.addLineSeries({
        color: '#5b9aff', lineWidth: 2, crosshairMarkerVisible: true,
        crosshairMarkerRadius: 4, crosshairMarkerBorderColor: '#06070a', crosshairMarkerBackgroundColor: '#5b9aff'
      });
    } else if (type === 'area') {
      series = STATE.chart.addAreaSeries({
        lineColor: '#5b9aff', topColor: 'rgba(91,154,255,0.35)', bottomColor: 'rgba(91,154,255,0.02)',
        lineWidth: 2
      });
    } else if (type === 'baseline') {
      series = STATE.chart.addBaselineSeries({
        baseValue: { type: 'price', price: candles.length ? candles[0].close : 0 },
        topLineColor: '#00e5a0', topFillColor1: 'rgba(0,229,160,0.28)', topFillColor2: 'rgba(0,229,160,0.02)',
        bottomLineColor: '#ff3d5a', bottomFillColor1: 'rgba(255,61,90,0.02)', bottomFillColor2: 'rgba(255,61,90,0.28)'
      });
    }

    STATE.series = series;

    let data = candles;
    if (type === 'ha') data = toHeikinAshi(candles);
    else if (type === 'renko') data = toRenko(candles, computeATR(candles, 14));

    if (type === 'line' || type === 'area' || type === 'baseline') {
      series.setData(data.map(c => ({ time: c.time, value: c.close })));
    } else {
      series.setData(data);
    }

    // Add indicator overlays
    addIndicators();
    STATE.chart.timeScale().fitContent();
    drawOverlay();
  };

  const addIndicators = () => {
    const candles = STATE.candles;
    if (!candles.length) return;

    if (STATE.layers.ema) {
      [20, 50, 200].forEach(p => {
        const ema = computeEMA(candles.map(c => c.close), p);
        const s = STATE.chart.addLineSeries({
          color: p === 20 ? 'rgba(0,217,229,0.8)' : p === 50 ? 'rgba(255,157,91,0.8)' : 'rgba(184,141,255,0.8)',
          lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false
        });
        s.setData(candles.map((c, i) => ({ time: c.time, value: ema[i] })));
        STATE.indSeries['ema'+p] = s;
      });
    }
    if (STATE.layers.bb) {
      const bb = computeBollinger(candles, 20, 2);
      const up = STATE.chart.addLineSeries({ color: 'rgba(91,154,255,0.6)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      const mid = STATE.chart.addLineSeries({ color: 'rgba(91,154,255,0.4)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      const lo = STATE.chart.addLineSeries({ color: 'rgba(91,154,255,0.6)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      up.setData(candles.map((c,i) => bb.upper[i] != null ? { time: c.time, value: bb.upper[i] } : null).filter(Boolean));
      mid.setData(candles.map((c,i) => bb.middle[i] != null ? { time: c.time, value: bb.middle[i] } : null).filter(Boolean));
      lo.setData(candles.map((c,i) => bb.lower[i] != null ? { time: c.time, value: bb.lower[i] } : null).filter(Boolean));
      STATE.indSeries.bb = { up, mid, lo };
    }
    if (STATE.layers.vwap) {
      const v = computeVWAP(candles);
      const s = STATE.chart.addLineSeries({ color: 'rgba(255,181,71,0.85)', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      s.setData(candles.map((c,i) => ({ time: c.time, value: v[i] })));
      STATE.indSeries.vwap = s;
    }
    if (STATE.layers.supertrend) {
      const st = computeSupertrend(candles);
      const up = [], dn = [];
      candles.forEach((c,i) => {
        if (st.line[i] == null) return;
        if (st.dir[i] === 1) up.push({ time: c.time, value: st.line[i] });
        else dn.push({ time: c.time, value: st.line[i] });
      });
      const su = STATE.chart.addLineSeries({ color: 'rgba(0,229,160,0.7)', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      su.setData(up);
      STATE.indSeries.su = su;
      const sd = STATE.chart.addLineSeries({ color: 'rgba(255,61,90,0.7)', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      sd.setData(dn);
      STATE.indSeries.sd = sd;
    }
  };

  // ============================================================
  // OVERLAY CANVAS DRAWING
  // ============================================================
  const drawOverlay = () => {
    if (!STATE.overlayCtx || !STATE.chart || !STATE.series || !STATE.analysis) return;
    const ctx = STATE.overlayCtx;
    const rect = STATE.overlay.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    const a = STATE.analysis;
    const candles = STATE.candles;
    const timeScale = STATE.chart.timeScale();
    const series = STATE.series;

    const xOf = (time) => {
      const x = timeScale.timeToCoordinate(time);
      return x == null ? null : x;
    };
    const yOf = (price) => series.priceToCoordinate(price);

    // Sessions backgrounds
    if (STATE.layers.sessions) {
      a.sessions.forEach(s => {
        const x1 = xOf(s.startTime);
        const x2 = xOf(s.endTime);
        if (x1 == null || x2 == null) return;
        ctx.fillStyle = s.color;
        ctx.fillRect(x1, 0, Math.max(1, x2 - x1), rect.height);
      });
    }

    // Volume profile on right edge
    if (STATE.layers.vprofile && a.vprofile) {
      const vp = a.vprofile;
      const maxW = 80;
      vp.profile.forEach((v, i) => {
        const y1 = yOf(vp.vlo + i * vp.step);
        const y2 = yOf(vp.vlo + (i+1) * vp.step);
        if (y1 == null || y2 == null) return;
        const w = (v / vp.max) * maxW;
        const isPOC = (i === vp.profile.indexOf(vp.max));
        ctx.fillStyle = isPOC ? 'rgba(255,157,91,0.55)' : 'rgba(91,154,255,0.22)';
        ctx.fillRect(rect.width - 12 - w, Math.min(y1, y2), w, Math.abs(y2 - y1) - 1);
      });
      // POC line
      const yPOC = yOf(vp.poc);
      if (yPOC != null) {
        ctx.strokeStyle = 'rgba(255,157,91,0.9)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4,3]);
        ctx.beginPath();
        ctx.moveTo(0, yPOC);
        ctx.lineTo(rect.width - 12, yPOC);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,157,91,0.95)';
        ctx.font = '600 10px "JetBrains Mono"';
        ctx.textAlign = 'right';
        ctx.fillText('POC', rect.width - 16, yPOC - 3);
      }
    }

    // S/R
    if (STATE.layers.sr) {
      a.sr.forEach((s, i) => {
        const y = yOf(s.price);
        if (y == null) return;
        const isSup = s.kind === 'support';
        ctx.strokeStyle = isSup ? 'rgba(0,229,160,0.45)' : 'rgba(255,61,90,0.45)';
        ctx.lineWidth = Math.max(1, s.strength / 60);
        ctx.setLineDash([6,4]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(rect.width - 60, y);
        ctx.stroke();
        ctx.setLineDash([]);
        // Label
