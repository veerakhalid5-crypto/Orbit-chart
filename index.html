<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<title>QCity Terminal · Institutional Chart Engine v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070a;--bg-2:#090b10;--surface:#0d1118;--surface-2:#141a24;--surface-3:#1a2230;--surface-4:#232d3f;
  --border:#1d2634;--border-2:#2a3648;--border-3:#3a4a61;
  --text:#e8ecf3;--text-dim:#8b98ab;--text-mute:#5d6b7f;--text-faint:#3d4855;
  --up:#00e5a0;--up-soft:rgba(0,229,160,.14);--up-glow:rgba(0,229,160,.35);
  --down:#ff3d5a;--down-soft:rgba(255,61,90,.14);--down-glow:rgba(255,61,90,.35);
  --accent:#5b9aff;--accent-2:#b88dff;--accent-3:#ff9d5b;--accent-4:#00d9e5;
  --accent-soft:rgba(91,154,255,.14);--warn:#ffb547;--success:#00e5a0;
  --radius-sm:6px;--radius:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow:0 4px 18px rgba(0,0,0,.45);--shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --ease:cubic-bezier(.16,1,.3,1);--ease-out:cubic-bezier(.33,1,.68,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --fast:150ms;--med:260ms;--slow:420ms;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --header-h:44px;--ticker-h:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;
  font-feature-settings:'cv02','cv03','cv04','cv11';overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 800px 500px at 20% -10%,rgba(91,154,255,.06),transparent 60%),
             radial-gradient(ellipse 700px 400px at 100% 0%,rgba(184,141,255,.04),transparent 55%)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;height:100vh}

/* ===== HEADER ===== */
#bar{display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:max(0px,env(safe-area-inset-top));
  height:calc(var(--header-h) + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(13,17,24,.98),rgba(13,17,24,.92));
  border-bottom:1px solid var(--border);backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);flex-shrink:0;position:relative;z-index:20}
#bar .brand{display:flex;align-items:center;gap:8px;padding-right:12px;margin-right:4px;border-right:1px solid var(--border);height:24px}
#bar .brand-logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#06101c;box-shadow:0 0 16px rgba(91,154,255,.4)}
#bar .brand-name{font-size:12px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--text),var(--text-dim));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.pill-select{position:relative;display:flex;align-items:center}
.pill-select select{appearance:none;-webkit-appearance:none;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 26px 6px 10px;
  font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer;outline:none;
  transition:all var(--fast) var(--ease);max-width:130px;text-overflow:ellipsis}
.pill-select select:hover{border-color:var(--border-2);background:var(--surface-3)}
.pill-select select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill-select::after{content:'';position:absolute;right:9px;top:50%;width:6px;height:6px;
  border-right:1.5px solid var(--text-dim);border-bottom:1.5px solid var(--text-dim);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;transition:border-color var(--fast)}
.pill-select:hover::after{border-color:var(--text)}
.pill-select#sym-wrap select{max-width:170px;min-width:120px;font-weight:600}

.icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-dim);cursor:pointer;transition:all var(--fast) var(--ease);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:15px;height:15px}

#px{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  gap:2px;padding-left:12px;border-left:1px solid var(--border);height:34px;min-width:130px;transition:color var(--fast)}
#px .p-main{font-family:var(--font-mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;line-height:1;transition:color var(--fast)}
#px .p-sub{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--text-mute);
  font-variant-numeric:tabular-nums;line-height:1;display:flex;gap:5px;align-items:center}
#px.up .p-main{color:var(--up)}#px.down .p-main{color:var(--down)}
#px.up .p-change{color:var(--up)}#px.down .p-change{color:var(--down)}
#htf-badge{display:none;padding:1px 5px;border-radius:3px;font-size:8.5px;font-weight:700;
  letter-spacing:.4px;font-family:var(--font-mono)}

/* ===== TICKER ===== */
#tk{display:flex;gap:4px;padding:3px 8px;height:var(--ticker-h);background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;flex-shrink:0;
  scrollbar-width:none;-ms-overflow-style:none;position:relative;z-index:15}
#tk::-webkit-scrollbar{display:none}
.tk-item{display:flex;align-items:center;gap:6px;padding:2px 9px;border-radius:4px;
  background:var(--surface-2);white-space:nowrap;font-size:11px;cursor:pointer;
  transition:all var(--fast) var(--ease);border:1px solid transparent;font-family:var(--font-mono)}
.tk-item:hover{background:var(--surface-3);border-color:var(--border-2)}
.tk-item .s{color:var(--text-dim);font-weight:600;letter-spacing:.2px}
.tk-item .p{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.tk-item .c{font-weight:600;font-variant-numeric:tabular-nums}
.tk-item .c.up{color:var(--up)}.tk-item .c.down{color:var(--down)}

/* ===== CHART ===== */
#cw{position:relative;flex:1 1 0;min-height:180px;background:var(--bg);overflow:hidden}
#ch{position:absolute;inset:0;width:100%;height:100%}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

#lay{position:absolute;top:8px;left:8px;z-index:10;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 130px)}
.layer-chip{padding:4px 9px;font-size:10.5px;font-weight:500;background:rgba(13,17,24,.85);
  border:1px solid var(--border);color:var(--text-dim);border-radius:20px;cursor:pointer;
  transition:all var(--fast) var(--ease);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:var(--font-ui);letter-spacing:.2px;white-space:nowrap}
.layer-chip:hover{color:var(--text);border-color:var(--border-2);background:rgba(20,26,36,.95)}
.layer-chip.on{color:#06101c;background:var(--accent);border-color:var(--accent);font-weight:600;box-shadow:0 0 12px rgba(91,154,255,.4)}
.layer-chip:active{transform:scale(.94)}

#dot{position:absolute;top:12px;right:78px;z-index:10;width:8px;height:8px;border-radius:50%;
  background:var(--text-mute);transition:all var(--med) var(--ease);box-shadow:0 0 8px transparent}
#dot.live{background:var(--up);box-shadow:0 0 8px var(--up-glow),0 0 16px var(--up-glow);animation:pulse-dot 2s ease-in-out infinite}
#dot.err{background:var(--down);box-shadow:0 0 8px var(--down-glow)}
#dot.closed{background:var(--warn);box-shadow:0 0 8px rgba(255,181,71,.4)}
#dot.loading{background:var(--warn);box-shadow:0 0 8px rgba(255,181,71,.4)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.5}}

#msg{position:absolute;bottom:8px;left:10px;z-index:10;font-size:10.5px;color:var(--text-mute);
  background:rgba(6,7,10,.85);padding:3px 8px;border-radius:4px;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);font-family:var(--font-mono);pointer-events:none;
  transition:opacity var(--med);border:1px solid var(--border);letter-spacing:.2px}

#mkt-banner{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:12;
  display:none;align-items:center;gap:6px;padding:5px 12px;background:rgba(255,181,71,.12);
  border:1px solid rgba(255,181,71,.35);border-radius:20px;font-size:11px;color:var(--warn);
  font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#mkt-banner.show{display:flex}
#mkt-banner svg{width:12px;height:12px}

#legend{position:absolute;top:8px;right:12px;z-index:10;display:flex;gap:8px;font-family:var(--font-mono);
  font-size:10.5px;background:rgba(6,7,10,.7);padding:4px 9px;border-radius:var(--radius-sm);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);
  opacity:0;transition:opacity var(--fast);pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
#legend.show{opacity:1}
#legend .o,#legend .h,#legend .l,#legend .c{color:var(--text-dim)}
#legend .v{color:var(--text);font-weight:500}
#legend .sep{color:var(--text-faint)}
#legend .chg.up{color:var(--up)}#legend .chg.down{color:var(--down)}

#chart-actions{position:absolute;top:34px;right:12px;z-index:10;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:140px}
.mini-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  background:rgba(6,7,10,.85);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);
  cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:all var(--fast)}
.mini-btn:hover{color:var(--text);border-color:var(--border-2);background:rgba(20,26,36,.95)}
.mini-btn:active{transform:scale(.94)}
.mini-btn svg{width:13px;height:13px}

#skeleton{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
  padding:40px 20px;gap:10px;opacity:0;pointer-events:none;transition:opacity var(--med)}
#skeleton.show{opacity:1;pointer-events:auto}
.sk-bar{height:12px;border-radius:4px;
  background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));
  background-size:200% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
.sk-bar.lg{height:22px;width:40%}.sk-bar.md{width:65%}.sk-bar.sm{width:30%}.sk-bar.full{width:100%;margin-top:8px;height:160px}
@keyframes sk-shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== FULLSCREEN EXIT ===== */
#fs-exit{display:none;position:fixed;top:max(20px,env(safe-area-inset-top));right:20px;z-index:9999;
  align-items:center;gap:6px;padding:8px 14px;background:rgba(13,17,24,.95);
  border:1px solid var(--border-2);border-radius:var(--radius);color:var(--text);
  font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);
  transition:all var(--fast)}
#fs-exit:hover{background:rgba(30,40,55,.98);border-color:var(--border-3)}
#fs-exit:active{transform:scale(.95)}
#fs-exit svg{width:14px;height:14px}
.fs #fs-exit{display:flex;animation:fs-slide-in var(--med) var(--ease)}
@keyframes fs-slide-in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ===== BOTTOM SHEET ===== */
#sheet{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:15;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#tabs{display:flex;background:var(--bg-2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1;min-width:62px;padding:10px 8px;border:0;background:none;color:var(--text-mute);
  font-family:var(--font-ui);font-size:11.5px;font-weight:500;cursor:pointer;position:relative;
  transition:color var(--fast);letter-spacing:.2px;white-space:nowrap}
#tabs button:hover{color:var(--text-dim)}
#tabs button.on{color:var(--accent);font-weight:600}
#tabs button.on::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0;box-shadow:0 0 12px var(--accent);
  animation:tab-underline var(--med) var(--ease)}
@keyframes tab-underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}

#body{overflow-y:auto;overflow-x:hidden;padding:12px;
  max-height:min(44dvh,calc(100dvh - 380px));display:none;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--surface-4) transparent}
#body::-webkit-scrollbar{width:6px}
#body::-webkit-scrollbar-track{background:transparent}
#body::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:3px}
#sheet.open #body{display:block}
#body>div{animation:fade-slide var(--med) var(--ease)}
@keyframes fade-slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Structure card */
.structure-card{background:linear-gradient(135deg,rgba(91,154,255,.06),rgba(184,141,255,.03));
  border:1px solid rgba(91,154,255,.2);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.structure-card .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.structure-card .bias-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  padding:3px 8px;border-radius:4px}
.structure-card .bias-tag.bull{background:var(--up-soft);color:var(--up)}
.structure-card .bias-tag.bear{background:var(--down-soft);color:var(--down)}
.structure-card .bias-tag.range{background:rgba(255,181,71,.14);color:var(--warn)}
.structure-card .sc-narrative{font-size:12px;color:var(--text-dim);line-height:1.5}
.structure-card .sc-narrative b{color:var(--text);font-weight:600}
.structure-card .sc-metrics{display:flex;gap:12px;margin-top:8px;font-family:var(--font-mono);font-size:10.5px;flex-wrap:wrap}
.structure-card .sc-metrics>div{display:flex;flex-direction:column;gap:2px}
.structure-card .sc-metrics .k{color:var(--text-mute);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.structure-card .sc-metrics .v{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.structure-card .sc-metrics .v.up{color:var(--up)}.structure-card .sc-metrics .v.down{color:var(--down)}

.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;transition:border-color var(--fast)}
.kv-cell:hover{border-color:var(--border-2)}
.kv-cell .k{font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.6px;
  font-weight:600;margin-bottom:3px}
.kv-cell .v{font-size:14px;font-weight:700;font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kv-cell .v.up{color:var(--up)}.kv-cell .v.down{color:var(--down)}.kv-cell .v.mute{color:var(--text-dim)}
.kv-cell .v.sm{font-size:11px}
.kv-cell .s{font-size:9.5px;color:var(--text-mute);margin-top:2px}

.section-h{font-size:10.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-h::after{content:'';flex:1;height:1px;background:var(--border)}

.analysis-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);margin-bottom:5px;
  transition:all var(--fast);font-size:12px}
.analysis-row:hover{border-color:var(--border-2);background:var(--surface-3)}
.analysis-row .tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;
  font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono);
  flex-shrink:0;margin-top:1px}
.analysis-row .tag.up{background:var(--up-soft);color:var(--up)}
.analysis-row .tag.down{background:var(--down-soft);color:var(--down)}
.analysis-row .tag.neu{background:rgba(255,181,71,.14);color:var(--warn)}
.analysis-row .tag.info{background:var(--accent-soft);color:var(--accent)}
.analysis-row .body{flex:1;line-height:1.45;color:var(--text-dim)}
.analysis-row .body b{color:var(--text);font-weight:600}
.analysis-row .meta{font-size:10px;color:var(--text-mute);font-family:var(--font-mono);margin-top:2px}

/* CHAT */
#chatlog{max-height:28dvh;max-height:28vh;overflow-y:auto;padding:4px 2px;scrollbar-width:thin}
#chatlog .msg{padding:8px 10px;margin-bottom:6px;border-radius:var(--radius-sm);line-height:1.5;
  animation:fade-slide var(--med) var(--ease);font-size:12.5px}
#chatlog .msg.user{background:var(--accent-soft);border:1px solid rgba(91,154,255,.25);
  margin-left:20px;color:var(--text)}
#chatlog .msg.bot{background:var(--surface-2);border:1px solid var(--border);margin-right:20px;color:var(--text-dim)}
#chatlog .msg.bot b{color:var(--text)}
#chatlog .msg.bot code{background:var(--bg);padding:1px 5px;border-radius:3px;
  font-family:var(--font-mono);font-size:11px;color:var(--accent-3)}

#chatin{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
#chatin input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;color:var(--text);font-family:var(--font-ui);font-size:12.5px;outline:none;transition:all var(--fast)}
#chatin input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#chatin button{padding:0 16px;background:var(--accent);color:#06101c;border:0;border-radius:var(--radius-sm);
  font-weight:700;font-size:12px;cursor:pointer;transition:all var(--fast);font-family:var(--font-ui)}
#chatin button:hover{background:#7cb0ff}

.chat-suggests{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chat-suggest{padding:4px 9px;font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:20px;color:var(--text-dim);cursor:pointer;transition:all var(--fast);font-family:var(--font-ui)}
.chat-suggest:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* SCAN */
.scan-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px;cursor:pointer;
  transition:all var(--fast);font-size:12px}
.scan-row:hover{border-color:var(--border-2);background:var(--surface-3)}
.scan-row .sym{font-family:var(--font-mono);font-weight:600;color:var(--text);min-width:76px;font-size:11.5px}
.scan-row .score-bar{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;min-width:30px}
.scan-row .score-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--up));transition:width var(--slow) var(--ease)}
.scan-row .score-num{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text-dim);
  min-width:32px;text-align:right}
.scan-row .chg{font-family:var(--font-mono);font-size:11px;font-weight:600;min-width:55px;text-align:right}
.scan-row .chg.up{color:var(--up)}.scan-row .chg.down{color:var(--down)}

/* STATS */
.stat-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:10px}
.stat-block h4{font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:10px}
.stat-block .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.stat-block .row:last-child{border-bottom:0}
.stat-block .row .k{color:var(--text-dim)}
.stat-block .row .v{font-family:var(--font-mono);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.stat-block .row .v.up{color:var(--up)}.stat-block .row .v.down{color:var(--down)}

.calc-input{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.calc-input label{font-size:10.5px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.calc-input input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;transition:all var(--fast)}
.calc-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* DATA */
.data-table-wrap{max-height:32dvh;overflow-y:auto;border:1px solid var(--border);
  border-radius:var(--radius-sm);scrollbar-width:thin}
.data-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.data-table th{position:sticky;top:0;background:var(--surface-3);padding:6px 8px;text-align:right;
  color:var(--text-mute);font-weight:600;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  border-bottom:1px solid var(--border)}
.data-table td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--border);color:var(--text-dim)}
.data-table tr:hover td{background:var(--surface-2)}
.data-table td:first-child,.data-table th:first-child{text-align:left}
.data-table td.up{color:var(--up)}.data-table td.down{color:var(--down)}

/* Fullscreen */
.fs #bar,.fs #sheet,.fs #tk,.fs #lay{display:none}
.fs #cw{min-height:100dvh;flex:1}

/* Layer panel */
#lp{display:none;position:absolute;top:44px;left:8px;z-index:30;background:rgba(13,17,24,.97);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border-2);
  border-radius:var(--radius-lg);padding:12px;max-width:340px;width:calc(100% - 16px);
  max-height:70dvh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:panel-in var(--med) var(--ease)}
#lp.open{display:block}
@keyframes panel-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
#lp h4{font-size:10px;font-weight:700;color:var(--text-mute);text-transform:uppercase;
  letter-spacing:.8px;margin:10px 0 6px}
#lp h4:first-child{margin-top:0}
#lp .grp{display:flex;flex-wrap:wrap;gap:4px}
#lp .grp button{padding:5px 10px;font-size:11px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;transition:all var(--fast);
  font-family:var(--font-ui);font-weight:500}
#lp .grp button:hover{border-color:var(--border-2);color:var(--text)}
#lp .grp button.on{background:var(--accent);border-color:var(--accent);color:#06101c;font-weight:600}

#toasts{position:fixed;top:calc(var(--header-h) + 12px);left:50%;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:90vw}
.toast{padding:8px 14px;background:rgba(13,17,24,.96);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border:1px solid var(--border-2);border-radius:var(--radius);
  font-size:12px;color:var(--text);box-shadow:var(--shadow-lg);animation:toast-in 320ms var(--ease-spring);
  border-left:3px solid var(--accent);pointer-events:auto;max-width:380px}
.toast.err{border-left-color:var(--down)}.toast.ok{border-left-color:var(--up)}.toast.warn{border-left-color:var(--warn)}
@keyframes toast-in{from{opacity:0;transform:translateY(-12px) scale(.94)}to{opacity:1;transform:none}}
.toast.out{animation:toast-out 260ms var(--ease) forwards}
@keyframes toast-out{to{opacity:0;transform:translateY(-8px) scale(.96)}}

@media (max-width:480px){
  #bar .brand-name{display:none}
  #bar{gap:5px;padding:0 6px}
  .pill-select select{padding:5px 22px 5px 8px;font-size:11.5px}
  .pill-select#sym-wrap select{max-width:130px;min-width:95px}

  #lay{max-width:calc(100% - 130px)}
  .layer-chip{padding:3px 7px;font-size:10px}
  #chart-actions{max-width:110px}
}
